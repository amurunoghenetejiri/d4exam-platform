name: fix-notif-ui-pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-notif-ui-pipeline.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch NotificationsPage + notify.ts
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          # --- notify.ts: action_url + minimal retry ---
          np = Path('src/lib/notify.ts')
          nt = np.read_text()
          nt = nt.replace(
          '''    if (p.schoolId) row.school_id = p.schoolId;
    if (p.link) row.link = p.link;
    if (p.entityType) row.entity_type = p.entityType;
    if (p.entityId) row.entity_id = p.entityId;''',
          '''    if (p.schoolId) row.school_id = p.schoolId;
    if (p.link) {
      row.link = p.link;
      row.action_url = p.link;
    }
    if (p.entityType) row.entity_type = p.entityType;
    if (p.entityId) row.entity_id = p.entityId;''',
          )
          old_ins = '''    const { data, error } = await supabase.from("notifications").insert(row as never).select("id").maybeSingle();
    if (error) {
      console.warn("[notify] insert failed", error.message);
      return null;
    }
    return (data?.id as string) ?? null;'''
          new_ins = '''    let { data, error } = await supabase.from("notifications").insert(row as never).select("id").maybeSingle();
    if (error) {
      const minimal = {
        recipient_user_id: p.recipientUserId,
        title: p.title,
        message: p.message,
        type: p.type || "info",
      };
      const retry = await supabase.from("notifications").insert(minimal as never).select("id").maybeSingle();
      if (retry.error) {
        console.warn("[notify] insert failed", error.message, retry.error.message);
        return null;
      }
      data = retry.data;
      error = null;
    }
    return (data?.id as string) ?? null;'''
          if old_ins in nt:
              nt = nt.replace(old_ins, new_ins)
              print('notify insert retry ok')
          else:
              print('notify insert already patched or miss')
          np.write_text(nt)

          # --- NotificationsPage ---
          p = Path('src/components/pages/NotificationsPage.tsx')
          t = p.read_text()
          if 'useNavigate' not in t:
              t = t.replace(
                  'import { useSessionUser } from "@/lib/session";',
                  'import { useSessionUser } from "@/lib/session";\nimport { useNavigate } from "@tanstack/react-router";',
              )
          if 'function resolveNotifHref' not in t:
              helper = '''
function resolveNotifHref(n: Notif, scope: string): string | null {
  const direct = (n.link || n.action_url || "").trim();
  if (direct.startsWith("/")) return direct;

  const ty = (n.type || "info").toLowerCase();
  const home =
    scope === "super-admin"
      ? "/super-admin"
      : scope === "admin"
        ? "/admin"
        : scope === "officer"
          ? "/officer"
          : scope === "teacher"
            ? "/teacher"
            : "/student";

  const byScope: Record<string, Record<string, string>> = {
    student: {
      exam_available: "/student/examinations",
      exam_scheduled: "/student/examinations",
      exam_approved: "/student/examinations",
      result_published: "/student/results",
      result_pending_release: "/student/results",
      officer_warning: "/student/examinations",
      announcement: "/student/notifications",
      system_alert: "/student",
      warning: "/student/examinations",
    },
    teacher: {
      exam_submitted: "/teacher/examinations",
      exam_approved: "/teacher/examinations",
      exam_rejected: "/teacher/examinations",
      exam_revision_requested: "/teacher/examinations",
      exam_scheduled: "/teacher/examinations",
      announcement: "/teacher/notifications",
      system_alert: "/teacher",
    },
    officer: {
      exam_submitted: "/officer/approvals",
      exam_approved: "/officer/approvals",
      result_pending_release: "/officer/results",
      result_published: "/officer/results",
      officer_warning: "/officer/live-monitor",
      system_alert: "/officer/live-monitor",
      warning: "/officer/live-monitor",
      announcement: "/officer/notifications",
    },
    admin: {
      exam_scheduled: "/admin/examinations",
      exam_available: "/admin/examinations",
      result_published: "/admin/results",
      announcement: "/admin/notifications",
      system_alert: "/admin",
    },
    "super-admin": {
      system_alert: "/super-admin/applications",
      announcement: "/super-admin/applications",
      warning: "/super-admin/applications",
      info: "/super-admin/applications",
    },
  };

  const map = byScope[scope] || byScope.student;
  return map[ty] || `${home}/notifications`;
}

'''
              t = t.replace(
                  'export function NotificationsPage({ scope }: { scope: string }) {',
                  helper + 'export function NotificationsPage({ scope }: { scope: string }) {',
              )

          if 'const navigate = useNavigate()' not in t:
              t = t.replace(
                  'export function NotificationsPage({ scope }: { scope: string }) {\n  const { data: user } = useSessionUser();\n  const qc = useQueryClient();',
                  'export function NotificationsPage({ scope }: { scope: string }) {\n  const { data: user } = useSessionUser();\n  const navigate = useNavigate();\n  const qc = useQueryClient();',
              )

          # Replace old hrefFromType block if present
          t2, n = re.subn(
              r'const hrefFromType: Record<string, string> = \{[\s\S]*?\};\n\s*const href = n\.link \|\| n\.action_url \|\| hrefFromType\[t\] \|\| null;',
              'const href = resolveNotifHref(n, scope);',
              t,
              count=1,
          )
          print('href replace', n)
          t = t2 if n else t

          if 'void navigate({ to: href as never })' not in t:
              t = t.replace(
                  '''if (href && href.startsWith("/")) {
                  window.location.assign(href);
                } else if (href) {
                  window.location.href = href;
                }''',
                  '''if (href && href.startsWith("/")) {
                  try {
                    void navigate({ to: href as never });
                  } catch {
                    window.location.assign(href);
                  }
                } else if (href) {
                  window.location.href = href;
                }''',
              )

          p.write_text(t)
          print('page ok', 'resolveNotifHref' in t, 'useNavigate' in t)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/pages/NotificationsPage.tsx src/lib/notify.ts
          if git diff --cached --quiet; then echo No changes; else
            git commit -m 'fix(notifications): role-aware click routes + resilient DB inserts'
            git push
          fi
