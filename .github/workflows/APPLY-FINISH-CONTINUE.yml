name: APPLY-FINISH-CONTINUE
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/wave_parts/**"
      - ".github/workflows/APPLY-FINISH-CONTINUE.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and run
        run: |
          set -e
          python3 -c "import base64,pathlib; ps=sorted(pathlib.Path('scripts/wave_parts').glob('p*.b64')); pathlib.Path('scripts/patch_wave_haptic_continue.py').write_bytes(base64.b64decode(''.join(p.read_text().strip() for p in ps))); print('assembled', pathlib.Path('scripts/patch_wave_haptic_continue.py').stat().st_size)"
          python3 scripts/patch_wave_haptic_continue.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/haptic.ts src/components/brand/BrandLoader.tsx src/routes/student.index.tsx src/components/cbt/CbtExamSession.impl.tsx
          git status
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix: Continue countdown with fallback, hard violation haptics, wave loader, grey locked answers"
            git pull --rebase origin main
            git push origin main
          fi
