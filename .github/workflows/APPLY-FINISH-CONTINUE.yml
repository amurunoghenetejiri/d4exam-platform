name: APPLY-FINISH-CONTINUE
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/APPLY-FINISH-CONTINUE.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore files
        run: |
          set -eux
          git show 3748ba0fd77ac313727116769b4ac56ecc94a44d:src/components/dashboard/kit.tsx > src/components/dashboard/kit.tsx
          git show 91d6857b6ea1006528c042b8318080a5db8a2b1f:src/routes/student.index.tsx > src/routes/student.index.tsx
          wc -c src/components/dashboard/kit.tsx src/routes/student.index.tsx
          # inject released/held into STATUS_STYLES via sed
          sed -i 's/  closed: "bg-slate-100 text-slate-600 border-slate-200",/  closed: "bg-slate-100 text-slate-600 border-slate-200",\n  released: "bg-emerald-50 text-emerald-700 border-emerald-200",\n  held: "bg-red-50 text-red-700 border-red-200",/' src/components/dashboard/kit.tsx
          # ends_at select
          sed -i 's/\.select("exam_id, status")/.select("exam_id, status, ends_at")/' src/routes/student.index.tsx
          # lock answers
          sed -i 's/disabled={locked && !selected}/disabled={locked}/' src/components/cbt/CbtExamSession.impl.tsx
          grep -n released src/components/dashboard/kit.tsx | head -3
          grep -n ends_at src/routes/student.index.tsx | head -3
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/kit.tsx src/routes/student.index.tsx src/components/cbt/CbtExamSession.impl.tsx
          git status
          if git diff --staged --quiet; then
            echo No changes
          else
            git commit -m "fix: restore kit+index, Released/Held badges, ends_at, lock answers"
            git pull --rebase origin main
            git push origin main
          fi
