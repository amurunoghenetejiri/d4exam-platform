name: APPLY-FINISH-CONTINUE
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/finish_parts/**"
      - ".github/workflows/APPLY-FINISH-CONTINUE.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble script and apply
        run: |
          set -e
          python3 -c "import base64,pathlib; ps=sorted(pathlib.Path('scripts/finish_parts').glob('p*.b64')); pathlib.Path('scripts/apply_finish_continue_fixes.py').write_bytes(base64.b64decode(''.join(p.read_text().strip() for p in ps))); print('ok', pathlib.Path('scripts/apply_finish_continue_fixes.py').stat().st_size)"
          python3 scripts/apply_finish_continue_fixes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/kit.tsx src/routes/student.index.tsx src/components/cbt/CbtExamSession.impl.tsx src/components/cbt/ExamCameraPip.tsx
          git status
          git diff --staged --stat || true
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "fix: Continue remaining time, Released/Held colors, lock answers, instant submit, resume unanswered"
            git push
          fi
