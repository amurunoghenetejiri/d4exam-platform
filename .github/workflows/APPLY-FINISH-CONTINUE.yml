name: APPLY-FINISH-CONTINUE
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/APPLY-FINISH-CONTINUE.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore kit and student index
        run: |
          set -e
          echo before kit=$(wc -c < src/components/dashboard/kit.tsx) index=$(wc -c < src/routes/student.index.tsx)
          if [ "$(wc -c < src/components/dashboard/kit.tsx)" -lt 5000 ]; then
            git show 3748ba0fd77ac313727116769b4ac56ecc94a44d:src/components/dashboard/kit.tsx > src/components/dashboard/kit.tsx
            echo restored kit
          fi
          if [ "$(wc -c < src/routes/student.index.tsx)" -lt 5000 ]; then
            git show 91d6857b6ea1006528c042b8318080a5db8a2b1f:src/routes/student.index.tsx > src/routes/student.index.tsx
            echo restored index
          fi
          echo after kit=$(wc -c < src/components/dashboard/kit.tsx) index=$(wc -c < src/routes/student.index.tsx)
      - name: Add released held badges
        run: |
          set -e
          python3 -c "from pathlib import Path; p=Path('src/components/dashboard/kit.tsx'); t=p.read_text(); o='  terminated: \"bg-red-50 text-red-700 border-red-200\",\n  closed: \"bg-slate-100 text-slate-600 border-slate-200\",\n};'; n='  terminated: \"bg-red-50 text-red-700 border-red-200\",\n  closed: \"bg-slate-100 text-slate-600 border-slate-200\",\n  released: \"bg-emerald-50 text-emerald-700 border-emerald-200\",\n  held: \"bg-red-50 text-red-700 border-red-200\",\n};';
p.write_text(t.replace(o,n,1) if o in t else t); print('kit', p.stat().st_size, 'released' in p.read_text())"
      - name: Select ends_at
        run: |
          set -e
          python3 -c "from pathlib import Path; p=Path('src/routes/student.index.tsx'); t=p.read_text(); t2=t.replace('.select(\"exam_id, status\")', '.select(\"exam_id, status, ends_at\")', 1) if '.select(\"exam_id, status, ends_at\")' not in t else t; p.write_text(t2); print('index', len(t2))"
      - name: CBT lock and instant submit
        run: |
          set -e
          python3 -c "from pathlib import Path; p=Path('src/components/cbt/CbtExamSession.impl.tsx'); t=p.read_text();
t=t.replace('disabled={locked && !selected}', 'disabled={locked}', 1) if 'disabled={locked && !selected}' in t else t;
old='    doneRef.current = true;\n    setFsGate(false);\n    setPaused(false);\n    shutdownMedia();\n    void leaveExamFullscreen();\n    if (previewMode) {\n      toast.message(\"Preview ended — nothing was saved\");\n      setDone(true);\n      finishingRef.current = false;\n      return;\n    }';
new='    doneRef.current = true;\n    setFsGate(false);\n    setPaused(false);\n    setDone(true);\n    shutdownMedia();\n    void leaveExamFullscreen();\n    if (previewMode) {\n      toast.message(\"Preview ended — nothing was saved\");\n      finishingRef.current = false;\n      return;\n    }';
t=t.replace(old,new,1) if old in t else t;
p.write_text(t); print('cbt', len(t))"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/kit.tsx src/routes/student.index.tsx src/components/cbt/CbtExamSession.impl.tsx
          git status
          if git diff --staged --quiet; then
            echo No changes
          else
            git commit -m "fix: restore kit+index, Released/Held badges, ends_at, lock answers, instant submit"
            git pull --rebase origin main || git pull --rebase --autostash origin main
            git push origin main
          fi
