name: APPLY-FINISH-CONTINUE
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/APPLY-FINISH-CONTINUE.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and patch
        run: |
          set -e
          if [ "$(wc -c < src/components/dashboard/kit.tsx)" -lt 5000 ]; then
            git show 3748ba0fd77ac313727116769b4ac56ecc94a44d:src/components/dashboard/kit.tsx > src/components/dashboard/kit.tsx
            echo restored kit
          fi
          if [ "$(wc -c < src/routes/student.index.tsx)" -lt 5000 ]; then
            git show 91d6857b6ea1006528c042b8318080a5db8a2b1f:src/routes/student.index.tsx > src/routes/student.index.tsx
            echo restored index
          fi
          python3 << 'PY'
          from pathlib import Path
          kit = Path("src/components/dashboard/kit.tsx")
          t = kit.read_text()
          if "released:" not in t:
            old = '  terminated: "bg-red-50 text-red-700 border-red-200",\n  closed: "bg-slate-100 text-slate-600 border-slate-200",\n};'
            new = '  terminated: "bg-red-50 text-red-700 border-red-200",\n  closed: "bg-slate-100 text-slate-600 border-slate-200",\n  released: "bg-emerald-50 text-emerald-700 border-emerald-200",\n  held: "bg-red-50 text-red-700 border-red-200",\n};'
            assert old in t
            kit.write_text(t.replace(old, new, 1))
            print("badges")
          idx = Path("src/routes/student.index.tsx")
          t = idx.read_text()
          if '.select("exam_id, status, ends_at")' not in t:
            t = t.replace('.select("exam_id, status")', '.select("exam_id, status, ends_at")', 1)
          if "endsAtByExam" not in t:
            m = "  const attemptsByExam = useMemo(() => {\n    const m = new Map<string, string>();\n    for (const a of attemptsQ.data ?? []) m.set(a.exam_id, a.status);\n    return m;\n  }, [attemptsQ.data]);\n\n  const finishedByResult"
            b = m.replace("  const finishedByResult", """  const endsAtByExam = useMemo(() => {
    const m = new Map<string, string | null>();
    for (const a of attemptsQ.data ?? []) {
      const row = a as { exam_id: string; ends_at?: string | null };
      m.set(row.exam_id, row.ends_at ?? null);
    }
    return m;
  }, [attemptsQ.data]);

  const [nowTick, setNowTick] = useState(() => Date.now());
  useEffect(() => {
    const hasLive = [...endsAtByExam.values()].some((ea) => ea);
    if (!hasLive) return;
    const tmr = setInterval(() => setNowTick(Date.now()), 1000);
    return () => clearInterval(tmr);
  }, [endsAtByExam]);

  function formatLeft(ms: number): string {
    if (ms <= 0) return "00:00:00";
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const pad = (n: number) => String(n).padStart(2, "0");
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  const finishedByResult""")
            assert m in t
            t = t.replace(m, b, 1)
          if "Continue ·" not in t:
            old = "                        Continue\n                      </Button>\n                    ) : canStart ? ("
            new = """                        {(() => {
                          const ea = endsAtByExam.get(e.id);
                          if (!ea) return "Continue";
                          const left = Math.max(0, new Date(ea).getTime() - nowTick);
                          if (left <= 0) return "Continue";
                          return `Continue · ${formatLeft(left)}`;
                        })()}
                      </Button>
                    ) : canStart ? ("""
            assert old in t
            t = t.replace(old, new, 1)
          idx.write_text(t)
          print("index", len(t))

          cbt = Path("src/components/cbt/CbtExamSession.impl.tsx")
          ct = cbt.read_text()
          if "resumeIndexRef" not in ct:
            ct = ct.replace("const finishingRef = useRef(false);", "const finishingRef = useRef(false);\n  const resumeIndexRef = useRef<number | null>(null);", 1)
          if "resumeIndexRef.current = idx;" not in ct:
            ct = ct.replace("              setIndex(idx);\n            } catch {}", "              resumeIndexRef.current = idx;\n              setIndex(idx);\n            } catch {}", 1)
          if "immediate UI exit" not in ct:
            old = "    doneRef.current = true;\n    setFsGate(false);\n    setPaused(false);\n    shutdownMedia();\n    void leaveExamFullscreen();\n    if (previewMode) {\n      toast.message(\"Preview ended — nothing was saved\");\n      setDone(true);\n      finishingRef.current = false;\n      return;\n    }"
            new = "    doneRef.current = true;\n    setFsGate(false);\n    setPaused(false);\n    setDone(true); // immediate UI exit — no camera reconnect flash\n    shutdownMedia();\n    void leaveExamFullscreen();\n    if (previewMode) {\n      toast.message(\"Preview ended — nothing was saved\");\n      finishingRef.current = false;\n      return;\n    }"
            if old in ct:
              ct = ct.replace(old, new, 1)
          if "disabled={locked && !selected}" in ct:
            ct = ct.replace("disabled={locked && !selected}", "disabled={locked}", 1)
          if "cursor-not-allowed border-slate-100 bg-slate-100" not in ct:
            old_cls = 'className={cn("flex w-full items-start gap-3 rounded-xl border px-4 py-3 text-left text-sm transition",\n                      selected ? "border-primary bg-primary/5 ring-2 ring-primary/20" : "border-slate-200 hover:border-primary/40")}'
            new_cls = 'className={cn("flex w-full items-start gap-3 rounded-xl border px-4 py-3 text-left text-sm transition",\n                      locked && selected && "cursor-not-allowed border-primary/60 bg-primary/10 ring-2 ring-primary/15 opacity-90",\n                      locked && !selected && "cursor-not-allowed border-slate-100 bg-slate-100 text-slate-400 opacity-70",\n                      !locked && selected && "border-primary bg-primary/5 ring-2 ring-primary/20",\n                      !locked && !selected && "border-slate-200 hover:border-primary/40")}'
            if old_cls in ct:
              ct = ct.replace(old_cls, new_cls, 1)
          cbt.write_text(ct)
          print("cbt", len(ct))

          import re
          pip = Path("src/components/cbt/ExamCameraPip.tsx")
          pt = pip.read_text()
          if "const tryReconnect = () => {\n      if (!enabled) return;" not in pt:
            pt = pt.replace(
              "const tryReconnect = () => {\n      if (document.visibilityState !== \"visible\") return;",
              "const tryReconnect = () => {\n      if (!enabled) return;\n      if (document.visibilityState !== \"visible\") return;",
              1,
            )
          if 'setCamConn("unavailable")' not in pt:
            m = re.search(r"const \[camConn, setCamConn\] = useState[\s\S]{0,250}?\);", pt)
            if m:
              insert = "\n  useEffect(() => {\n    if (!enabled) {\n      setCamConn(\"unavailable\");\n    }\n  }, [enabled]);\n"
              pt = pt[:m.end()] + insert + pt[m.end():]
          pip.write_text(pt)
          print("pip", len(pt))
          print("ALL OK")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/kit.tsx src/routes/student.index.tsx src/components/cbt/CbtExamSession.impl.tsx src/components/cbt/ExamCameraPip.tsx
          git status
          git diff --staged --stat || true
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "fix: Continue remaining time, Released/Held colors, lock answers, instant submit, resume unanswered"
            git push
          fi
