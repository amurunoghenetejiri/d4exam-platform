name: STITCH-MIC2
on:
  workflow_dispatch:
  push:
    paths:
      - ".d4exam-payload/mic2/**"
      - ".github/workflows/STITCH-MIC2.yml"
jobs:
  stitch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit
        run: |
          set -e
          python3 << 'PY'
          import gzip, base64, pathlib
          root = pathlib.Path(".d4exam-payload/mic2")
          def assemble(prefix, dest):
              parts = sorted(root.glob(prefix + ".*.b64"))
              if not parts:
                  print("skip", prefix)
                  return False
              b64 = "".join(p.read_text().strip() for p in parts)
              data = gzip.decompress(base64.b64decode(b64))
              pathlib.Path(dest).write_bytes(data)
              print("wrote", dest, len(data))
              return True
          ok = False
          ok |= assemble("c", "src/components/cbt/CbtExamSession.impl.tsx")
          ok |= assemble("o", "src/routes/officer.live-monitor.tsx")
          if not ok:
              raise SystemExit(0)
          PY
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx
          if git diff --cached --quiet; then echo no changes; else git commit -m "feat: live student mic + officer mute/focus listen" && git push; fi
