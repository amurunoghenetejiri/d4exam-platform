name: APPLY-CBT-CAM-TAB-FIX
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/APPLY-CBT-CAM-TAB-FIX.yml
      - scripts/apply_cbt_cam_tab_fix.py
      - scripts/blobs/**
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply camera + tab pause fix
        run: python3 scripts/apply_cbt_cam_tab_fix.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/live-video.ts src/components/cbt/CbtExamSession.impl.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(cbt): camera recovery after background, real timed pause, tab violation counter"
            git push
          fi
