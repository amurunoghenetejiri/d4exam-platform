name: Finalize offline-first

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/finalize-offline-first.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Wire assertOnline into exam start
        run: |
          set -eux
          f=src/components/cbt/CbtExamSession.impl.tsx
          if grep -q assertOnline "$f"; then
            echo already wired
            exit 0
          fi
          if ! grep -q 'require-online' "$f"; then
            sed -i '1a import { assertOnline } from "@/lib/require-online";' "$f"
          fi
          python3 -c "
from pathlib import Path
p = Path('src/components/cbt/CbtExamSession.impl.tsx')
c = p.read_text()
old = 'async function beginWithMedia(_opts: { skipScreenShare: boolean; caps: DeviceCapabilities }) {\n    setMediaBusy(true);'
new = '''async function beginWithMedia(_opts: { skipScreenShare: boolean; caps: DeviceCapabilities }) {
    if (!previewMode) {
      try {
        await assertOnline(\"Connect to the Internet before starting this examination.\");
      } catch (e) {
        toast.error((e as Error).message || \"Internet connection required\");
        return;
      }
    }
    setMediaBusy(true);'''
if old in c:
    p.write_text(c.replace(old, new, 1))
    print('patched')
else:
    print('skip pattern')
"

      - name: SW shell v4
        run: |
          set -eux
          f=public/firebase-messaging-sw.js
          sed -i 's/d4exam-shell-v3/d4exam-shell-v4/g; s/d4exam-runtime-v3/d4exam-runtime-v4/g' "$f"
          grep -q '"/index.html"' "$f" || sed -i 's|"/",|"/",\n  "/index.html",|' "$f"

      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.app
          date -u +'redeploy %Y%m%d%H%M%S offline-finalize' > DEPLOY_TRIGGER.txt
          git add -A
          git commit -m 'fix(offline): exam requires online + SW shell v4' || exit 0
          git push origin HEAD:main
