name: Patch student name on live-monitor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-student-name.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject nameFromMetadata
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/routes/officer.live-monitor.tsx')
          t = p.read_text()
          if 'nameFromMetadata' in t:
              print('already patched')
              raise SystemExit(0)
          needle = 'function studentDisplayName(a: AttemptRow): string {'
          idx = t.find(needle)
          if idx < 0:
              raise SystemExit('studentDisplayName not found')
          # find end of function (next function at column 0)
          end = t.find('\nfunction ', idx + 10)
          if end < 0:
              raise SystemExit('end not found')
          new_fn = '''function nameFromMetadata(meta: unknown): string {
  if (!meta || typeof meta !== "object") return "";
  const m = meta as Record<string, unknown>;
  return String(m.studentName || m.full_name || m.student_name || "").trim();
}

function studentDisplayName(a: AttemptRow): string {
  const fromMeta = nameFromMetadata(a.metadata);
  if (fromMeta) return fromMeta;
  const fromStudent = String(a.students?.full_name || "").trim();
  if (fromStudent) return fromStudent;
  const fromProfile = String(a.students?.profiles?.full_name || "").trim();
  if (fromProfile) return fromProfile;
  return a.students?.matric_number || a.students?.student_id || "Student";
}
'''
          t2 = t[:idx] + new_fn + t[end+1:]
          p.write_text(t2)
          print('patched ok', len(t2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/officer.live-monitor.tsx
          if git diff --cached --quiet; then echo nochange; else git commit -m "fix(officer): prefer student full name from attempt metadata on live-monitor" && git push; fi
