name: APPLY-COLDSTART-LOGO
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/APPLY-COLDSTART-LOGO.yml"
      - "scripts/patch_coldstart_logo.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch
        run: python3 scripts/patch_coldstart_logo.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/session.ts src/routes/index.tsx src/routes/__root.tsx src/components/cbt/CbtExamSession.impl.tsx src/components/cbt/ExamSecurityGate.tsx src/components/brand/SchoolLogo.tsx FORCE_DEPLOY.txt
          git status
          git diff --cached --stat
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "fix: cold-start restore last role dashboard; exam gate school logo"
          git push origin HEAD:main
