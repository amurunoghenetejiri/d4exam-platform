name: FIX-MONITOR-INLINE

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/FIX-MONITOR-INLINE.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch sources
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          # --- haptic ---
          p = Path("src/lib/haptic.ts")
          t = p.read_text()
          if "Cap?.isNativePlatform?.()) return true" not in t.split("canVibrate")[1][:400] if "canVibrate" in t else True:
              pass
          # Move native check first
          old = '''export function canVibrate(): boolean {
  try {
    if (typeof window === "undefined") return false;
    const nav = navigator as Navigator & { vibrate?: (p: number | number[]) => boolean };
    const win = window as Window & { navigator?: Navigator; vibrate?: (p: number | number[]) => boolean };
    if (typeof nav?.vibrate === "function" || typeof win?.vibrate === "function") return true;
    // Capacitor Android WebView often exposes vibrate only after a user gesture;
    // still treat as available so integrity alerts attempt vibration.
    try {
      const Cap = (window as unknown as { Capacitor?: { isNativePlatform?: () => boolean } }).Capacitor;
      if (Cap?.isNativePlatform?.()) return true;
    } catch {
      /* ignore */
    }
    return false;
  } catch {
    return false;
  }
}'''
          new = '''export function canVibrate(): boolean {
  try {
    if (typeof window === "undefined") return false;
    try {
      const Cap = (window as unknown as { Capacitor?: { isNativePlatform?: () => boolean } }).Capacitor;
      if (Cap?.isNativePlatform?.()) return true;
    } catch {
      /* ignore */
    }
    const nav = navigator as Navigator & { vibrate?: (p: number | number[]) => boolean };
    const win = window as Window & { navigator?: Navigator; vibrate?: (p: number | number[]) => boolean };
    if (typeof nav?.vibrate === "function" || typeof win?.vibrate === "function") return true;
    return false;
  } catch {
    return false;
  }
}'''
          if old in t:
              t = t.replace(old, new, 1)
          t = t.replace(
              'kind === "officer_warning" ? 800 : kind === "multi" ? 1200 : kind === "start" ? 500 : 1600;',
              'kind === "officer_warning" ? 600 : kind === "multi" ? 900 : kind === "start" ? 400 : 1200;',
          )
          if "fn(0)" not in t:
              t = t.replace(
                  "return Boolean(fn(arg));",
                  "try { fn(0); } catch { /* ignore */ }\n        const _ok = Boolean(fn(arg));\n        if (_ok) return true;\n        return false;",
                  1,
              )
          p.write_text(t)
          print("haptic OK")

          # --- session heartbeat ---
          p = Path("src/components/cbt/CbtExamSession.impl.tsx")
          t = p.read_text()
          t = t.replace("setInterval(tick, 8000)", "setInterval(tick, 4000)")
          if "camera_active: camOn" not in t:
              needle = 'cameraActive: Boolean(mediaStreamRef.current || liveStream),' 
              if needle in t:
                  t = t.replace(
                      needle,
                      "cameraActive: Boolean(mediaStreamRef.current || liveStream),\n        camera_active: Boolean(mediaStreamRef.current || liveStream),",
                      1,
                  )
              t = t.replace(
                  'screenActive: Boolean(screenStreamRef.current || screenStream),',
                  'screenActive: Boolean(screenStreamRef.current || screenStream || isNativeScreenShareActive()),\n        screen_active: Boolean(screenStreamRef.current || screenStream || isNativeScreenShareActive()),',
                  1,
              )
          p.write_text(t)
          print("session OK")

          # --- pip ---
          p = Path("src/components/cbt/ExamCameraPip.tsx")
          t = p.read_text().replace("ALERT_COOLDOWN_MS = 1800", "ALERT_COOLDOWN_MS = 1400")
          p.write_text(t)
          print("pip OK")

          # --- screen-share ended handler ---
          p = Path("src/lib/screen-share.ts")
          t = p.read_text()
          if "isNativeAndroid() && nativeActive) return" not in t:
              t = t.replace(
                  "const handler = () => {\n    try {\n      onEnded();\n    } catch {\n      /* ignore */\n    }\n  };",
                  "const handler = () => {\n    if (isNativeAndroid() && nativeActive) return;\n    try {\n      onEnded();\n    } catch {\n      /* ignore */\n    }\n  };",
                  1,
              )
          p.write_text(t)
          print("screen-share OK")

          # --- live-video meta ---
          p = Path("src/lib/live-video.ts")
          t = p.read_text()
          t = t.replace(
              "faceStatus: meta.faceStatus,\n          cameraActive: meta.cameraActive,",
              'faceStatus: meta.faceStatus ?? "ok",\n          cameraActive: meta.cameraActive !== false,',
          )
          p.write_text(t)
          print("live-video OK")
          print("ALL_OK")
          PY

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/haptic.ts src/lib/screen-share.ts src/lib/live-video.ts \
            src/components/cbt/CbtExamSession.impl.tsx src/components/cbt/ExamCameraPip.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(monitor): presence heartbeat, screen keep-alive, vibration, live frames"
            git push
          fi
