name: FIX-ALWAYS-REQUEST-CAMERA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/FIX-ALWAYS-REQUEST-CAMERA.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sed patch
        run: |
          set -e
          # Always attempt camera preview when exam requires camera (do not gate on caps.camera)
          sed -i 's/if (needCam && caps.camera && previewState === "idle")/if (needCam \&\& previewState === "idle")/' src/components/cbt/ExamSecurityGate.tsx
          grep -n 'needCam && previewState' src/components/cbt/ExamSecurityGate.tsx | head -5
          # Silence noisy workflows except CI + android + this file
          python3 - <<'PY'
          from pathlib import Path
          import re
          keep = {"ci-status.yml", "build-android.yml", "FIX-ALWAYS-REQUEST-CAMERA.yml", "RUN-PATCH-EXAM-PERMS.yml", "RESTORE-GATE-NOW.yml"}
          n = 0
          for f in Path(".github/workflows").glob("*.yml"):
              if f.name in keep:
                  continue
              t = f.read_text()
              if "push:" not in t:
                  continue
              m = re.search(r"\non:\n", t)
              m2 = re.search(r"\njobs:", t)
              if not m or not m2:
                  continue
              f.write_text(t[: m.start() + 1] + "on:\n  workflow_dispatch:\n" + t[m2.start() :])
              n += 1
          print("silenced", n)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/cbt/ExamSecurityGate.tsx .github/workflows
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(cbt+ci): always request camera on exam gate + reduce cancelled workflows"
            git push
          fi
