name: APPLY-SWITCH-REAUTH
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/APPLY-SWITCH-REAUTH.yml
      - scripts/write_switch_files.py
      - scripts/as_z_0.txt
      - scripts/as_z_1.txt
      - scripts/as_z_2.txt
      - scripts/as_z_3.txt
      - scripts/as_z_4.txt
      - scripts/as_z_5.txt
      - scripts/as_z_6.txt
      - scripts/as_z_7.txt
      - scripts/sc_z_0.txt
      - scripts/sc_z_1.txt
      - scripts/sc_z_2.txt
      - scripts/sc_z_3.txt
      - scripts/patch_login_switch.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 scripts/write_switch_files.py
          python3 scripts/patch_login_switch.py || true
          grep -q beginReauthForAccount src/lib/account-switcher.ts
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/account-switcher.ts src/components/settings/SwitchAccountCard.tsx src/routes/login.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(auth): seamless re-auth when switching accounts"
            git push
          fi
