name: APPLY-SWITCH-REAUTH
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify switch files (no corrupt zlib restore)
        run: |
          set -euo pipefail
          python3 scripts/write_switch_files.py
          test -f src/lib/account-switcher.ts
          grep -q switchToAccount src/lib/account-switcher.ts
          echo "Account switcher sources OK — no overwrite needed"
