name: Restore ExamCameraPip face+haptic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-exam-camera-pip.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore ExamCameraPip from last good commit
        run: |
          set -e
          GOOD=$(git log --all --pretty=format:'%H' -- src/components/cbt/ExamCameraPip.tsx | while read h; do
            s=$(git cat-file -s "$h:src/components/cbt/ExamCameraPip.tsx" 2>/dev/null || echo 0)
            if [ "$s" -gt 10000 ]; then echo "$h"; break; fi
          done)
          echo "Using commit $GOOD"
          git show "$GOOD:src/components/cbt/ExamCameraPip.tsx" > src/components/cbt/ExamCameraPip.tsx
          bytes=$(wc -c < src/components/cbt/ExamCameraPip.tsx)
          echo "bytes=$bytes"
          if [ "$bytes" -lt 5000 ]; then
            echo "ERROR: ExamCameraPip still too small"
            exit 1
          fi
          if grep -q 'PLACEHOLDER' src/components/cbt/ExamCameraPip.tsx; then
            echo "ERROR: still PLACEHOLDER"
            exit 1
          fi
          grep -q 'createFaceEngine' src/components/cbt/ExamCameraPip.tsx
          grep -q 'haptic' src/components/cbt/ExamCameraPip.tsx
          sed -i 's/\.replaceAll("_", " ")/.split("_").join(" ")/g' src/components/cbt/ExamCameraPip.tsx || true
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/cbt/ExamCameraPip.tsx
          if git diff --cached --quiet; then
            echo No changes
          else
            git commit -m 'fix(cbt): restore ExamCameraPip face detection + haptics'
            git push
          fi
