name: Restore officer pages now
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-officer-pages-now.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore good files
        run: |
          set -e
          GOOD=d1c7a9198f0b0b72cfa00ea2fc7d33bfd0ee490e
          git checkout "$GOOD" -- src/routes/officer.approvals.tsx src/routes/officer.live-monitor.tsx
          test -f src/routes/officer.approvals.tsx
          test -f src/routes/officer.live-monitor.tsx
          ! grep -q PLACEHOLDER src/routes/officer.approvals.tsx
          ! grep -q PLACEHOLDER src/routes/officer.live-monitor.tsx
          wc -c src/routes/officer.approvals.tsx src/routes/officer.live-monitor.tsx
          git config user.name "restore-bot"
          git config user.email "bot@d4exam.local"
          git add src/routes/officer.approvals.tsx src/routes/officer.live-monitor.tsx
          git commit -m "fix: restore officer approvals + live-monitor from good commit" || echo no-change
          git push
