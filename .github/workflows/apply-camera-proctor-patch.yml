name: Apply camera proctoring patch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-camera-proctor-patch.yml"
      - "patches/part_pip.patch"
      - "patches/part_sess.patch"
      - "patches/part_lm.patch"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact camera patches
        run: |
          set -e
          for f in patches/part_pip.patch patches/part_sess.patch patches/part_lm.patch; do
            if [ -f "$f" ]; then
              echo "Applying $f"
              git apply --whitespace=nowarn "$f" || git apply --3way --whitespace=nowarn "$f"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/ExamCameraPip.tsx src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(cbt): camera lifecycle, false blocked status, officer LIVE/RECONNECTING/OFFLINE"
            git push
          fi
