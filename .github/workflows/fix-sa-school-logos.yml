name: fix-sa-school-logos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sa-school-logos.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch schools list and detail
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          # --- schools index ---
          p = Path('src/routes/super-admin.schools.index.tsx')
          t = p.read_text()
          if 'logo_url' not in t:
              t = t.replace(
                  '  status: string;\n  created_at: string | null;\n};',
                  '  status: string;\n  created_at: string | null;\n  logo_url: string | null;\n};',
              )
              t = t.replace(
                  '.select("id, name, school_code, country, subscription_plan, status, created_at")',
                  '.select("id, name, school_code, country, subscription_plan, status, created_at, logo_url")',
              )
          old = '''                  <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="min-w-0">
                      <div className="flex flex-wrap items-center gap-2">
                        <p className="text-base font-extrabold text-slate-900">{s.name}</p>
                        <StatusBadge status={s.status} />
                      </div>'''
          new = '''                  <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="flex min-w-0 flex-1 items-start gap-3">
                      {s.logo_url ? (
                        <img
                          src={s.logo_url}
                          alt={`${s.name} logo`}
                          className="h-12 w-12 shrink-0 rounded-xl border border-slate-200 bg-white object-contain p-1 shadow-sm"
                        />
                      ) : (
                        <span className="grid h-12 w-12 shrink-0 place-items-center rounded-xl border border-slate-200 bg-slate-50 text-slate-400 shadow-sm">
                          <Building2 className="h-6 w-6" />
                        </span>
                      )}
                      <div className="min-w-0 flex-1">
                      <div className="flex flex-wrap items-center gap-2">
                        <p className="text-base font-extrabold text-slate-900">{s.name}</p>
                        <StatusBadge status={s.status} />
                      </div>'''
          if old in t and 'alt={`${s.name} logo`}' not in t:
              t = t.replace(old, new, 1)
              t = t.replace(
                  '''                      </div>
                    </div>
                    <Button size="sm" className="font-semibold" asChild>''',
                  '''                      </div>
                      </div>
                    </div>
                    <Button size="sm" className="font-semibold" asChild>''',
                  1,
              )
              print('index logo ok')
          else:
              print('index skip', 'logo_url' in t)
          p.write_text(t)

          # --- school detail ---
          p2 = Path('src/routes/super-admin.schools.$id.tsx')
          t2 = p2.read_text()
          t2 = t2.replace(
              '.select("id, name, school_code, country, subscription_plan, status, created_at")',
              '.select("id, name, school_code, country, subscription_plan, status, created_at, logo_url")',
          )
          t2 = t2.replace(
          '''      return data as {
        id: string;
        name: string;
        school_code: string | null;
        country: string | null;
        subscription_plan: string | null;
        status: string;
        created_at: string | null;
      } | null;''',
          '''      return data as {
        id: string;
        name: string;
        school_code: string | null;
        country: string | null;
        subscription_plan: string | null;
        status: string;
        created_at: string | null;
        logo_url: string | null;
      } | null;''',
          )
          if 'from "sonner"' not in t2:
              t2 = t2.replace(
                  'from "@/integrations/supabase/client";',
                  'from "@/integrations/supabase/client";\nimport { toast } from "sonner";',
                  1,
              )
          if 'Remove school' not in t2:
              old_h = '''      <PageHeader
        title={`${school.name} — School Overview`}
        description={
          [
            school.school_code ? `Code ${school.school_code}` : null,
            school.country,
            school.subscription_plan,
          ]
            .filter(Boolean)
            .join(" · ") || "School overview"
        }
        actions={<StatusBadge status={school.status} />}
      />

      <div className="mb-4 grid gap-2 rounded-2xl border border-slate-200 bg-white p-4 text-sm shadow-sm sm:grid-cols-2 lg:grid-cols-4">
        <Meta label="School" value={school.name} bold />'''
              new_h = '''      <div className="mb-4 flex flex-wrap items-center gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
        {school.logo_url ? (
          <img
            src={school.logo_url}
            alt={`${school.name} logo`}
            className="h-16 w-16 shrink-0 rounded-2xl border border-slate-200 bg-white object-contain p-1.5 shadow-sm"
          />
        ) : (
          <span className="grid h-16 w-16 shrink-0 place-items-center rounded-2xl border border-slate-200 bg-slate-50 text-slate-400">
            <Building2 className="h-8 w-8" />
          </span>
        )}
        <div className="min-w-0 flex-1">
          <p className="text-lg font-extrabold text-slate-900">{school.name}</p>
          <p className="text-xs text-slate-500">
            {[
              school.school_code ? `Code ${school.school_code}` : null,
              school.country,
              school.subscription_plan,
            ]
              .filter(Boolean)
              .join(" · ") || "School overview"}
          </p>
        </div>
        <StatusBadge status={school.status} />
      </div>

      <PageHeader
        title={`${school.name} — School Overview`}
        description="Full academic and operational overview for this institution."
        actions={
          <Button
            size="sm"
            variant="destructive"
            className="font-semibold"
            onClick={() => {
              const ok = window.confirm(
                `Remove school "${school.name}" from the platform?\n\nThis sets the school status to suspended.`,
              );
              if (!ok) return;
              void (async () => {
                const { error } = await supabase
                  .from("schools")
                  .update({ status: "suspended" })
                  .eq("id", school.id);
                if (error) {
                  toast.error(error.message || "Could not remove school");
                  return;
                }
                toast.success("School removed (suspended)");
                void schoolQ.refetch();
              })();
            }}
          >
            Remove school
          </Button>
        }
      />

      <div className="mb-4 grid gap-2 rounded-2xl border border-slate-200 bg-white p-4 text-sm shadow-sm sm:grid-cols-2 lg:grid-cols-4">
        <Meta label="School" value={school.name} bold />'''
              if old_h in t2:
                  t2 = t2.replace(old_h, new_h)
                  print('detail header ok')
              else:
                  print('detail header miss')
          else:
              print('detail already has Remove school')

          # ensure Button import
          if 'from "@/components/ui/button"' not in t2:
              t2 = t2.replace(
                  'import { PageHeader',
                  'import { Button } from "@/components/ui/button";\nimport { PageHeader',
              )

          p2.write_text(t2)
          print('done')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/super-admin.schools.index.tsx src/routes/super-admin.schools.\$id.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m 'feat(super-admin): school logos on list/detail + remove school'
            git push
          fi
