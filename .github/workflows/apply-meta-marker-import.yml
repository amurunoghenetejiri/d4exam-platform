name: Apply META_MARKER import
on:
  push:
    paths:
      - scripts/apply_meta_marker_import.py
      - .github/workflows/apply-meta-marker-import.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_meta_marker_import.py
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          if git diff --staged --quiet; then echo No changes; else git commit -m "fix: import META_MARKER and SECURITY_MARKER in teacher examinations"; git push; fi
