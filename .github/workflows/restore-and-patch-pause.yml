name: Restore and patch pause
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-and-patch-pause.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Restore and patch
        run: |
          set -e
          git show 633e45c:src/routes/teacher.exam-security.tsx > src/routes/teacher.exam-security.tsx
          git show 633e45c:src/routes/teacher.examinations.tsx > /tmp/exam_orig.tsx
          # If examinations still has seconds UI, use current; if already patched skip
          python3 << 'PY'
          from pathlib import Path
          import re, subprocess

          def patch_pause_block(text, is_settings):
              # Replace any pause duration (seconds) block with min/sec UI
              if is_settings:
                  pattern = r'\{settings\.thresholdAction === "pause" && \([\s\S]*?Pause duration \(seconds\)[\s\S]*?\)\}'
                  repl = '''{settings.thresholdAction === "pause" && (
              <div className="space-y-2 rounded-xl border border-slate-200 px-4 py-3">
                <Label className="font-semibold">Pause duration</Label>
                <div className="grid grid-cols-2 gap-3">
                  <div className="space-y-1">
                    <p className="text-xs font-medium text-slate-500">Minutes</p>
                    <Input
                      type="number"
                      min={0}
                      max={60}
                      value={Math.floor((settings.pauseDurationSeconds ?? 300) / 60)}
                      onChange={(e) => {
                        const mins = Math.max(0, Math.min(60, Number(e.target.value) || 0));
                        const secs = (settings.pauseDurationSeconds ?? 300) % 60;
                        toggle("pauseDurationSeconds", Math.max(30, mins * 60 + secs));
                      }}
                    />
                  </div>
                  <div className="space-y-1">
                    <p className="text-xs font-medium text-slate-500">Seconds</p>
                    <Input
                      type="number"
                      min={0}
                      max={59}
                      step={5}
                      value={(settings.pauseDurationSeconds ?? 300) % 60}
                      onChange={(e) => {
                        const secs = Math.max(0, Math.min(59, Number(e.target.value) || 0));
                        const mins = Math.floor((settings.pauseDurationSeconds ?? 300) / 60);
                        toggle("pauseDurationSeconds", Math.max(30, mins * 60 + secs));
                      }}
                    />
                  </div>
                </div>
                <p className="text-xs text-slate-500">
                  Student must wait{" "}
                  <strong>
                    {Math.floor((settings.pauseDurationSeconds ?? 300) / 60)} min{" "}
                    {(settings.pauseDurationSeconds ?? 300) % 60} sec
                  </strong>{" "}
                  before continuing (minimum 30 seconds).
                </p>
              </div>
            )}'''
              else:
                  pattern = r'\{security\.thresholdAction === "pause" && \([\s\S]*?Pause duration \(seconds\)[\s\S]*?\)\}'
                  repl = '''{security.thresholdAction === "pause" && (
                <div className="space-y-2 rounded-xl border border-slate-200 px-4 py-3">
                  <Label className="font-semibold">Pause duration</Label>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <p className="text-xs font-medium text-slate-500">Minutes</p>
                      <Input
                        type="number"
                        min={0}
                        max={60}
                        value={Math.floor((security.pauseDurationSeconds ?? 300) / 60)}
                        onChange={(e) => {
                          const mins = Math.max(0, Math.min(60, Number(e.target.value) || 0));
                          const secs = (security.pauseDurationSeconds ?? 300) % 60;
                          toggleSec("pauseDurationSeconds", Math.max(30, mins * 60 + secs));
                        }}
                      />
                    </div>
                    <div className="space-y-1">
                      <p className="text-xs font-medium text-slate-500">Seconds</p>
                      <Input
                        type="number"
                        min={0}
                        max={59}
                        step={5}
                        value={(security.pauseDurationSeconds ?? 300) % 60}
                        onChange={(e) => {
                          const secs = Math.max(0, Math.min(59, Number(e.target.value) || 0));
                          const mins = Math.floor((security.pauseDurationSeconds ?? 300) / 60);
                          toggleSec("pauseDurationSeconds", Math.max(30, mins * 60 + secs));
                        }}
                      />
                    </div>
                  </div>
                  <p className="text-xs text-slate-500">
                    Student must wait{" "}
                    <strong>
                      {Math.floor((security.pauseDurationSeconds ?? 300) / 60)} min{" "}
                      {(security.pauseDurationSeconds ?? 300) % 60} sec
                    </strong>{" "}
                    before continuing (minimum 30 seconds).
                  </p>
                </div>
              )}'''
              new_t, n = re.subn(pattern, repl, text, count=1)
              if n != 1:
                  raise SystemExit(f'pause block replace failed n={n} settings={is_settings}')
              return new_t

          # exam-security
          p = Path('src/routes/teacher.exam-security.tsx')
          t = p.read_text()
          if 'PLACEHOLDER' in t:
              raise SystemExit('still placeholder')
          if 'Minutes' not in t:
              p.write_text(patch_pause_block(t, True))
              print('exam-security patched')
          else:
              print('exam-security already')

          # examinations
          p = Path('src/routes/teacher.examinations.tsx')
          t = p.read_text()
          if 'Pause duration (seconds)' in t:
              p.write_text(patch_pause_block(t, False))
              print('examinations patched')
          else:
              print('examinations already or different')

          # summary
          es = Path('src/lib/exam-security.ts')
          et = es.read_text()
          old_s = '    `On threshold: ${n.thresholdAction}`,'
          new_s = '    `On threshold: ${n.thresholdAction}${n.thresholdAction === "pause" ? ` (${Math.floor((n.pauseDurationSeconds ?? 300) / 60)}m ${(n.pauseDurationSeconds ?? 300) % 60}s)` : ""}`,'
          if old_s in et:
              es.write_text(et.replace(old_s, new_s, 1))
              print('summary ok')
          else:
              print('summary skip')

          # push.ts
          p = Path('src/lib/push.ts')
          t = p.read_text()
          if 'state === "granted" || state === "default"' not in t:
              start = t.find('export async function initNativePushIfNeeded')
              comment = t.rfind('/**', 0, start)
              end = t.find('\nexport ', start + 10)
              if end < 0: end = len(t)
              if comment < 0: comment = start
              new_fn = (
                  '/** Called from root NativeBootstrap on session - native only, never web FCM. */\n'
                  'export async function initNativePushIfNeeded(\n'
                  '  userId?: string | null,\n'
                  '  role?: string | null,\n'
                  '): Promise<void> {\n'
                  '  if (!isNativeShell()) return;\n'
                  '  try {\n'
                  '    await disableWebPushInNativeShell();\n'
                  '    const state = await refreshNativePushPermissionState();\n'
                  '    if (!userId) return;\n'
                  '    if (state === "granted" || state === "default") {\n'
                  '      void enableNativePushNotifications(userId, role);\n'
                  '    }\n'
                  '  } catch {\n'
                  '    /* never crash startup */\n'
                  '  }\n'
                  '}\n'
              )
              # Use real newlines
              new_fn = new_fn.replace('\\n', '\n')
              p.write_text(t[:comment] + new_fn + t[end:])
              print('push.ts ok')
          else:
              print('push.ts skip')

          # FCM
          p = Path('src/lib/push-send.functions.ts')
          t = p.read_text()
          if 'PRIORITY_MAX' not in t:
              t2 = t.replace(
                  '            sound: "default",\n            click_action: "FCM_PLUGIN_ACTIVITY",',
                  '            sound: "default",\n            default_sound: true,\n            default_vibrate_timings: true,\n            notification_priority: "PRIORITY_MAX",\n            visibility: "PUBLIC",\n            click_action: "FCM_PLUGIN_ACTIVITY",',
                  1,
              )
              if t2 == t:
                  raise SystemExit('fcm replace failed')
              p.write_text(t2)
              print('fcm ok')
          else:
              print('fcm skip')
          print('DONE')
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add -A
          git status
          git commit -m "fix: pause duration minutes+seconds UI; restore exam-security; push heads-up" || echo no-changes
          git pull --rebase origin main || true
          git push origin main
