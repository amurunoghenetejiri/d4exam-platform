name: restore-login-tsx
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/login_p1.txt
      - scripts/login_p2.txt
      - scripts/login_p3.txt
      - scripts/login_p4.txt
      - .github/workflows/restore-login-tsx.yml
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble login.tsx from base64 parts
        run: |
          python3 << 'PY'
          from pathlib import Path
          import base64
          parts = [Path(f"scripts/login_p{i}.txt").read_text().strip() for i in range(1, 5)]
          data = base64.b64decode("".join(parts))
          assert b"LoginPage" in data and b"confirmSessionReady" in data
          Path("src/routes/login.tsx").write_bytes(data)
          print("restored", len(data))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/login.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(auth): restore full login.tsx with session confirm"
            git push
          fi
