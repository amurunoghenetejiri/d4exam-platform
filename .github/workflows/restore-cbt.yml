name: Restore full CBT session

# Retired — CBT is already restored on main.
# Manual only; always succeeds so it never shows red.
on:
  workflow_dispatch:

jobs:
  restore:
    name: Already restored
    runs-on: ubuntu-latest
    steps:
      - name: No-op success
        run: |
          echo "CBT session already on main. This workflow is retired."
          echo "Status: success"
