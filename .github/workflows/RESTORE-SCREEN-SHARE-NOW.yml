name: RESTORE-SCREEN-SHARE-NOW
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/RESTORE-SCREEN-SHARE-NOW.yml
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch screen-share.ts
        run: |
          set -euo pipefail
          git show 310e749dea1369d51caf48fdb8202fd7e9485352:src/lib/screen-share.ts > src/lib/screen-share.ts
          test -s src/lib/screen-share.ts
          grep -q isNativeScreenShareActive src/lib/screen-share.ts
          python3 scripts/patch_screen_listeners.py || python3 -c "
from pathlib import Path
p=Path('src/lib/screen-share.ts')
t=p.read_text()
old='''      if (st?.active) {
        nativeActive = true;
        if (!nativeStream) nativeStream = new MediaStream();
        return { ok: true, stream: nativeStream };
      }'''
new='''      if (st?.active) {
        nativeActive = true;
        if (!nativeStream) nativeStream = new MediaStream();
        if (!nativeFrameUnsub) {
          latestNativeScreenJpeg = null;
          nativeFrameUnsub = await D4ScreenShare().addListener(\"frame\", (data) => {
            if (!data?.jpeg) return;
            try { latestNativeScreenJpeg = \`data:image/jpeg;base64,\${data.jpeg}\`; } catch {}
          });
        }
        return { ok: true, stream: nativeStream };
      }'''
if old in t:
  t=t.replace(old,new,1)
  print('patched')
p.write_text(t)
print('bytes', len(t))
"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/screen-share.ts
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(screen): restore screen-share.ts + re-attach frame listeners on reuse"
            git push
          fi
