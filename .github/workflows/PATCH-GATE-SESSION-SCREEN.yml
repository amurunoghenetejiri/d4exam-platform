name: PATCH-GATE-SESSION-SCREEN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/patch_gate_session_screen.py
      - .github/workflows/PATCH-GATE-SESSION-SCREEN.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_gate_session_screen.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/cbt/ExamSecurityGate.tsx src/components/cbt/CbtExamSession.impl.tsx src/lib/live-video.ts || true
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(screen): keep share after gate grant; reuse + publish in exam"
            git push
          fi
