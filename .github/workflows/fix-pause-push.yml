name: Fix pause UI and push login prompt
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-pause-push.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply files
        run: |
          set -e
          python3 scripts/apply_part0.py
          python3 scripts/apply_part1.py
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add -A
          git diff --cached --stat
          git commit -m "fix: pause duration as minutes+seconds; prompt push permission on login for heads-up" || echo no-changes
          git pull --rebase origin main || true
          git push origin main
