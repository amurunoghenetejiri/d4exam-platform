name: Patch CBT studentName metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cbt-metadata.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch CbtExamSession.impl.tsx
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/components/cbt/CbtExamSession.impl.tsx')
          t = p.read_text()
          changed = False
          if 'studentName: String(student.fullName' not in t and 'studentName: String(student?.fullName' not in t:
              old = 'metadata: { cameraActive: needCam, lastSeenAt: new Date().toISOString(), videoStreaming: needCam },'
              new = '''metadata: {
            cameraActive: needCam,
            lastSeenAt: new Date().toISOString(),
            videoStreaming: needCam,
            studentName: String(student.fullName || "").trim() || null,
            matric: String(student.matricNumber || student.studentId || "").trim() || null,
          },'''
              if old in t:
                  t = t.replace(old, new, 1)
                  changed = True
                  print('patched begin metadata')
              else:
                  print('begin metadata pattern missing')
          else:
              print('studentName already in file')

          if 'studentName: String(student?.fullName' not in t:
              oldp = '''        tabHidden,
      };'''
              newp = '''        tabHidden,
        studentName: String(student?.fullName || "").trim() || null,
        matric: String(student?.matricNumber || student?.studentId || "").trim() || null,
      };'''
              if oldp in t:
                  t = t.replace(oldp, newp, 1)
                  changed = True
                  print('patched presence payload')

          old_opt = 'onClick={() => q && setAnswers((a) => ({ ...a, [q.id]: oi }))}'
          new_opt = '''onClick={() => {
                    if (!q) return;
                    try { refreshHapticUnlock(); } catch { /* ignore */ }
                    setAnswers((a) => ({ ...a, [q.id]: oi }));
                  }}'''
          if old_opt in t:
              t = t.replace(old_opt, new_opt, 1)
              changed = True
              print('patched option click haptic')

          if changed:
              p.write_text(t)
              print('wrote', len(t))
          else:
              print('no changes')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx
          if git diff --cached --quiet; then echo nochange; else git commit -m "fix(cbt): write studentName to metadata + haptic unlock on answer" && git push; fi
