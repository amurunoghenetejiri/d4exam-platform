name: Apply face+haptic restore
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          python3 << 'PY'
          import base64, gzip, pathlib
          def write_gz(path, b64):
              data = gzip.decompress(base64.b64decode(b64))
              p = pathlib.Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print("wrote", path, len(data))
          write_gz("src/lib/exam-security.ts", """""")
          print("placeholder")
          PY
