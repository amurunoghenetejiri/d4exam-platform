name: APPLY-CBT-FIX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/APPLY-CBT-FIX.yml
      - scripts/write_cbt_fix.py
      - scripts/cbt_fix_b64_0.txt
      - scripts/cbt_fix_b64_1.txt
      - scripts/cbt_fix_b64_2.txt
      - scripts/cbt_fix_b64_3.txt
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/write_cbt_fix.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/cbt/CbtExamSession.impl.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(cbt): scrollable exam, tab-threshold pause, face warn-only, media restore on return"
            git push
          fi
