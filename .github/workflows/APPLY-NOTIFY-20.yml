name: Apply notify 20.0 templates
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/APPLY-NOTIFY-20.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch notify-messages templates
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, pathlib, re
          path = pathlib.Path("src/lib/notify-messages.ts")
          text = path.read_text()
          blob = base64.b64decode("")
          block = gzip.decompress(blob).decode()
          pat = re.compile(
              r"function examDisplay\([\s\S]*?(?=export function studentExamEnded\()",
              re.M,
          )
          if not pat.search(text):
              raise SystemExit("examDisplay..StartingNow block not found")
          text2 = pat.sub(block, text, count=1)
          path.write_text(text2)
          assert "Examination available" in text2
          assert "VIEW EXAMINATIONS" in text2
          print("notify-messages patched", path.stat().st_size)
          PY
      - name: Patch notify.ts action labels
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/lib/notify.ts")
          t = p.read_text()
          t = t.replace(
              'actionLabel: copy.action?.label ?? "VIEW EXAM",',
              'actionLabel: copy.action?.label ?? "VIEW EXAMINATIONS",',
          )
          if "actionLabel: copy.action?.label ?? null," in t and 'actionLabel: copy.action?.label ?? "START EXAM"' in t:
              t = t.replace(
                  '''actionLabel: copy.action?.label ?? null,
      actionLabel: copy.action?.label ?? "START EXAM",''',
                  '''actionLabel: copy.action?.label ?? "START EXAM",''',
                  1,
              )
          p.write_text(t)
          print("notify.ts patched", p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/notify-messages.ts src/lib/notify.ts
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(notify): Notification 20.0 student exam copy (name, course, exam, schedule, START/VIEW actions)"
            git push
          fi
