name: Apply notify 20.0 templates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        env:
          B64: |
            
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib, re, os
          path = pathlib.Path('src/lib/notify-messages.ts')
          text = path.read_text()
          blob = base64.b64decode(os.environ['B64'].replace('\n','').strip())
          block = gzip.decompress(blob).decode()
          pat = re.compile(r'function examDisplay\([\s\S]*?(?=export function studentExamEnded\()', re.M)
          m = pat.search(text)
          if not m:
            raise SystemExit('block not found')
          path.write_text(pat.sub(block, text, count=1))
          out = path.read_text()
          assert 'Examination available' in out
          assert 'VIEW EXAMINATIONS' in out
          print('ok', path.stat().st_size)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/notify.ts')
          t = p.read_text()
          t = t.replace('actionLabel: copy.action?.label ?? "VIEW EXAM",', 'actionLabel: copy.action?.label ?? "VIEW EXAMINATIONS",')
          p.write_text(t)
          print('notify ok')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/notify-messages.ts src/lib/notify.ts
          git diff --cached --quiet || (git commit -m "fix(notify): Notification 20.0 student exam copy" && git push)
