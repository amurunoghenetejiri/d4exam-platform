name: APPEND-ENROL-FN
on:
  push:
    paths:
      - ".github/workflows/APPEND-ENROL-FN.yml"
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Append enrol + patch courses
        run: |
          set -euo pipefail
          if ! grep -q enrolStudentInCourse src/lib/student.server.ts; then
            cat >> src/lib/student.server.ts << 'END'

export const enrolStudentInCourse = createServerFn({ method: "POST" })
  .middleware([requireSupabaseAuth])
  .inputValidator((data: unknown) =>
    z.object({ courseId: z.string().uuid(), studentId: z.string().uuid().optional() }).parse(data),
  )
  .handler(async ({ data, context }) => {
    const userId = context.userId as string;
    let db = context.supabase;
    try {
      const mod = await import("@/integrations/supabase/client.server");
      if (mod.supabaseAdmin) db = mod.supabaseAdmin as unknown as typeof db;
    } catch {}
    const { data: profile } = await db.from("profiles").select("id, school_id").eq("auth_user_id", userId).maybeSingle();
    if (!profile?.id || !profile.school_id) throw new Error("Student profile not found.");
    const schoolId = String(profile.school_id);
    const { data: student } = await db.from("students").select("id, school_id, department_id, level_id, profile_id").eq("profile_id", profile.id).eq("school_id", schoolId).maybeSingle();
    if (!student?.id) throw new Error("Student record not found.");
    const studentId = String(student.id);
    if (data.studentId && String(data.studentId) !== studentId) throw new Error("You can only enrol yourself.");
    const { data: course, error: cErr } = await db.from("courses").select("id, school_id, department_id, level_id, code, name").eq("id", data.courseId).maybeSingle();
    if (cErr || !course) throw new Error(cErr?.message || "Course not found.");
    if (String(course.school_id) !== schoolId) throw new Error("Course is not in your school.");
    if (student.department_id && course.department_id && String(student.department_id) !== String(course.department_id)) throw new Error("Course is not offered to your department.");
    const { error: scErr } = await db.from("student_courses").insert({ student_id: studentId, course_id: data.courseId, school_id: schoolId, status: "enrolled" } as never);
    if (!scErr || /duplicate|unique/i.test(scErr.message || "")) {
      return { ok: true as const, course: { id: String(course.id), code: String(course.code || ""), name: String(course.name || "") } };
    }
    const { error: enErr } = await db.from("course_enrollments").insert({ student_id: studentId, course_id: data.courseId, school_id: schoolId } as never);
    if (enErr && !/duplicate|unique/i.test(enErr.message || "")) throw new Error(scErr.message || enErr.message || "Could not enrol");
    return { ok: true as const, course: { id: String(course.id), code: String(course.code || ""), name: String(course.name || "") } };
  });
END
