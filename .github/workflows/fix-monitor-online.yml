name: Fix monitor online and warnings
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-monitor-online.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # --- officer live-monitor ---
          p = Path("src/routes/officer.live-monitor.tsx")
          t = p.read_text()

          old_sub = """        setFrames((prev) => ({\n          ...prev,\n          [attemptId]: { src: p.frame, ts: p.ts || Date.now(), faceStatus: p.faceStatus, cameraActive: p.cameraActive !== false, answeredCount: p.answeredCount, totalQuestions: p.totalQuestions, timeRemainingSec: p.timeRemainingSec },\n        }));"""
          new_sub = """        const entry = {\n          src: p.frame,\n          ts: p.ts || Date.now(),\n          faceStatus: p.faceStatus,\n          cameraActive: p.cameraActive !== false,\n          answeredCount: p.answeredCount,\n          totalQuestions: p.totalQuestions,\n          timeRemainingSec: p.timeRemainingSec,\n        };\n        const sid = String(p.studentId || (p as { student_id?: string }).student_id || "");\n        setFrames((prev) => {\n          const next = { ...prev, [attemptId]: entry };\n          if (sid) next[`student:${sid}`] = entry;\n          return next;\n        });"""
          if "student:${sid}" not in t:
              if old_sub not in t:
                  raise SystemExit("setFrames block missing")
              t = t.replace(old_sub, new_sub, 1)
              print("frames dual-key")

          if "frames[`student:${a.student_id}`]" not in t:
              t = t.replace(
                  "        const frame = frames[a.id];",
                  "        const frame = frames[a.id] || frames[`student:${a.student_id}`];",
                  1,
              )
              print("frame lookup")

          if 'presence.cameraActive = true' not in t:
              t = t.replace(
                  "          presence.cameraActive = frame.cameraActive !== false;",
                  '''          presence.cameraActive = true;
          if (frame.faceStatus) {
            const fs = String(frame.faceStatus).toLowerCase();
            if (fs === "ok" || fs === "none" || fs === "multi" || fs === "unclear" || fs === "unavailable") {
              presence.faceStatus = fs as typeof presence.faceStatus;
            }
          } else if (!presence.faceStatus || presence.faceStatus === "unknown" || presence.faceStatus === "unavailable") {
            presence.faceStatus = "ok";
          }''',
                  1,
              )
              # remove duplicate faceStatus block if double-applied
              dup = '''          if (frame.faceStatus) {
            const fs = String(frame.faceStatus).toLowerCase();
            if (fs === "ok" || fs === "none" || fs === "multi" || fs === "unclear" || fs === "unavailable") {
              presence.faceStatus = fs as typeof presence.faceStatus;
            }
          }
          if (frame.faceStatus) {
            const fs = String(frame.faceStatus).toLowerCase();
            if (fs === "ok" || fs === "none" || fs === "multi" || fs === "unclear" || fs === "unavailable") {
              presence.faceStatus = fs as typeof presence.faceStatus;
            }
          }'''
              single = '''          if (frame.faceStatus) {
            const fs = String(frame.faceStatus).toLowerCase();
            if (fs === "ok" || fs === "none" || fs === "multi" || fs === "unclear" || fs === "unavailable") {
              presence.faceStatus = fs as typeof presence.faceStatus;
            }
          }'''
              if dup in t:
                  t = t.replace(dup, single, 1)
              print("camera force")

          if 'if (!isDone && hasLiveVideo && sev === "offline")' not in t:
              t = t.replace(
                  '        const sev: MonitorSeverity = isDone ? "completed" : severityFromPresence(a.status, presence, now);',
                  '''        let sev: MonitorSeverity = isDone ? "completed" : severityFromPresence(a.status, presence, now);
        if (!isDone && hasLiveVideo && sev === "offline") {
          const fs = presence.faceStatus;
          if (fs === "multi") sev = "violation";
          else if (fs === "none" || fs === "unclear") sev = "warning";
          else sev = "normal";
        }''',
                  1,
              )
              print("sev override")

          if "function humanLiveStatus" not in t:
              t = t.replace(
                  "function doneStatusLabel(status: string | null | undefined): string {",
                  '''function humanLiveStatus(sev: MonitorSeverity): string {
  if (sev === "normal") return "Online";
  if (sev === "warning") return "Warning";
  if (sev === "violation") return "Violation";
  if (sev === "offline") return "Offline";
  if (sev === "completed") return "Completed";
  return "Online";
}

function doneStatusLabel(status: string | null | undefined): string {''',
                  1,
              )
              print("humanLiveStatus")

          if "humanLiveStatus(selected.sev)" not in t:
              t = t.replace(
                  '<Info label="Status" value={selected.isDone ? doneStatusLabel(selected.a.status) : selected.sev} />',
                  '<Info label="Status" value={selected.isDone ? doneStatusLabel(selected.a.status) : humanLiveStatus(selected.sev)} />',
                  1,
              )
              print("status label")

          t = t.replace(
              'className="min-h-0 flex-1 overflow-y-auto overscroll-contain"',
              'className="min-h-0 flex-1 overflow-y-auto overscroll-contain pb-[max(1rem,env(safe-area-inset-bottom))]"',
              1,
          )

          p.write_text(t)
          assert "humanLiveStatus" in t
          assert "student:${a.student_id}" in t or "student:${sid}" in t
          print("officer ok", len(t))

          # --- session officer warning listener ---
          sp = Path("src/components/cbt/CbtExamSession.impl.tsx")
          st = sp.read_text()
          if "exam-officer-warn" not in st:
              marker = """  useEffect(() => () => {\n    stopMediaStream(mediaStreamRef.current);\n    mediaStreamRef.current = null;\n    void exitExamImmersive();\n  }, []);"""
              inject = marker + """

  // Officer warnings from live monitor — top banner + haptic during the attempt
  useEffect(() => {
    if (!started || done || previewMode) return;
    const studentId = student?.studentId;
    if (!studentId || !id) return;
    const channel = supabase
      .channel(`exam-officer-warn-${id}-${studentId}`)
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "integrity_events",
          filter: `student_id=eq.${studentId}`,
        },
        (payload) => {
          try {
            const row = payload.new as {
              event_type?: string;
              description?: string;
              exam_id?: string | null;
            };
            const et = String(row.event_type || "").toUpperCase();
            if (et !== "WARNING_SHOWN" && et !== "OFFICER_WARNING") return;
            if (row.exam_id && String(row.exam_id) !== String(id)) return;
            const msg =
              String(row.description || "").trim() ||
              "Officer warning: Follow exam rules. Further violations may void your result.";
            setWarnBanner(msg);
            try {
              haptic("officer_warning");
            } catch {
              /* ignore */
            }
            window.setTimeout(() => setWarnBanner(null), 12_000);
          } catch {
            /* ignore */
          }
        },
      )
      .subscribe();
    return () => {
      void supabase.removeChannel(channel);
    };
  }, [started, done, previewMode, student?.studentId, id]);"""
              if marker not in st:
                  raise SystemExit("session marker missing")
              st = st.replace(marker, inject, 1)
              sp.write_text(st)
              print("session warn listener")
          else:
              print("session warn already")

          # --- notify fallback ---
          np = Path("src/lib/notify.ts")
          nt = np.read_text()
          if "Fallback: profiles linked" not in nt:
              old = '''    let uid = (opts.studentUserId || "").trim();
    if (!uid && opts.studentId) {
      const ids = await studentIdsToAuthUserIds([opts.studentId]);
      uid = ids[0] || "";
    }
    if (!uid) {
      console.warn("[notify] notifyStudentOfficerWarning: no auth user", opts.studentId);
      return;
    }'''
              new = '''    let uid = (opts.studentUserId || "").trim();
    if (!uid && opts.studentId) {
      const ids = await studentIdsToAuthUserIds([opts.studentId]);
      uid = ids[0] || "";
    }
    if (!uid && opts.studentId) {
      // Fallback: profiles linked via students.profile_id or auth_user_id column
      try {
        const { data: stRow } = await supabase
          .from("students")
          .select("id, profile_id, auth_user_id")
          .eq("id", opts.studentId)
          .maybeSingle();
        const row = stRow as { auth_user_id?: string | null; profile_id?: string | null } | null;
        uid = String(row?.auth_user_id || "").trim();
        if (!uid && row?.profile_id) {
          const { data: pr } = await supabase
            .from("profiles")
            .select("auth_user_id")
            .eq("id", row.profile_id)
            .maybeSingle();
          uid = String((pr as { auth_user_id?: string } | null)?.auth_user_id || "").trim();
        }
      } catch {
        /* ignore */
      }
    }
    if (!uid) {
      console.warn("[notify] notifyStudentOfficerWarning: no auth user", opts.studentId);
      return;
    }'''
              if old not in nt:
                  raise SystemExit("notify block missing")
              nt = nt.replace(old, new, 1)
              np.write_text(nt)
              print("notify fallback")
          else:
              print("notify already")

          # --- teacher writing counts ---
          tp = Path("src/routes/teacher.live-exams.tsx")
          tt = tp.read_text()
          if "teacher-live-writing" not in tt:
              needle = """    },\n  });\n\n  if (isLoading) return <p className=\"text-sm text-slate-500\">Loading…</p>;\n"""
              extra = """    },\n  });\n\n  const writingQ = useQuery({\n    queryKey: [\"teacher-live-writing\", teacher?.schoolId, teacher?.courseIds],\n    enabled: Boolean(teacher?.schoolId && teacher?.courseIds?.length),\n    refetchInterval: 8_000,\n    queryFn: async () => {\n      if (!teacher) return [] as { exam_id: string; id: string }[];\n      const { data, error } = await supabase\n        .from(\"exam_attempts\")\n        .select(\"id, exam_id\")\n        .eq(\"school_id\", teacher.schoolId)\n        .eq(\"status\", \"in_progress\")\n        .limit(200);\n      if (error) return [];\n      return (data ?? []) as { exam_id: string; id: string }[];\n    },\n  });\n\n  if (isLoading) return <p className=\"text-sm text-slate-500\">Loading…</p>;\n"""
              if needle not in tt:
                  print("teacher needle miss - skip")
              else:
                  tt = tt.replace(needle, extra, 1)
                  tt = tt.replace(
                      '<p className="text-xs text-slate-500">{(e.courses as { code?: string } | null)?.code}</p>',
                      '''<p className="text-xs text-slate-500">
                    {(e.courses as { code?: string } | null)?.code}
                    {" · "}
                    {(writingQ.data ?? []).filter((a) => a.exam_id === e.id).length} writing
                  </p>''',
                      1,
                  )
                  tp.write_text(tt)
                  print("teacher writing")
          else:
              print("teacher already")

          print("ALL DONE")
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add src/routes/officer.live-monitor.tsx src/components/cbt/CbtExamSession.impl.tsx src/lib/notify.ts src/routes/teacher.live-exams.tsx
          git commit -m "fix(monitor): live frames = Online; in-exam officer warnings; status labels; teacher writing counts" || echo no-changes
          git pull --rebase origin main || true
          git push origin main
