name: PATCH-SCREEN-SHARE-PLUGIN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/PATCH-SCREEN-SHARE-PLUGIN.yml
      - scripts/patch_screen_share_plugin.py
      - native-android/app/src/main/java/com/d4exam/app/ScreenCaptureService.java
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_screen_share_plugin.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native-android/app/src/main/java/com/d4exam/app/ScreenSharePlugin.java
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(android): ScreenSharePlugin FGS wait + keep-alive"
            git push
          fi
