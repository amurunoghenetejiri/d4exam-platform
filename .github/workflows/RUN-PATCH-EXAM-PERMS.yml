name: RUN-PATCH-EXAM-PERMS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/RUN-PATCH-EXAM-PERMS.yml
      - scripts/patch_exam_permissions.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch script
        run: python3 scripts/patch_exam_permissions.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/cbt/ExamSecurityGate.tsx .github/workflows
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(cbt+ci): apply exam media permission UI + silence noisy workflows"
            git push
          fi
