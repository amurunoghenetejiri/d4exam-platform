name: assemble-material-viewer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/components/materials/_viewer_part1.txt
      - src/components/materials/_viewer_part2.txt
      - .github/workflows/assemble-material-viewer.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble viewer
        run: |
          cat src/components/materials/_viewer_part1.txt src/components/materials/_viewer_part2.txt > src/components/materials/MaterialViewer.tsx
          wc -c src/components/materials/MaterialViewer.tsx
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/materials/MaterialViewer.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "feat(materials): full Material Viewer with annotations (reference)"
            git push
          fi
