name: RESTORE-STUDENT-INDEX-AND-PATCH
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/RESTORE-STUDENT-INDEX-AND-PATCH.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Restore + patch student.index
        run: |
          set -euo pipefail
          git show 9196e3f7bc94c953fb165a40eef2ec7d3316e143:src/routes/student.index.tsx > src/routes/student.index.tsx
          wc -c src/routes/student.index.tsx
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/routes/student.index.tsx")
          t = p.read_text()
          assert "createFileRoute" in t
          t = t.replace('.select("exam_id, status, ends_at")', '.select("exam_id, status, ends_at, started_at")', 1)
          old = """  const endsAtByExam = useMemo(() => {
    const m = new Map<string, string | null>();
    for (const a of attemptsQ.data ?? []) {
      const row = a as { exam_id: string; ends_at?: string | null };
      m.set(row.exam_id, row.ends_at ?? null);
    }
    return m;
  }, [attemptsQ.data]);"""
          new = """  const endsAtByExam = useMemo(() => {
    const m = new Map<string, string | null>();
    const examById = new Map((examsQ.data ?? []).map((e) => [e.id, e]));
    for (const a of attemptsQ.data ?? []) {
      const row = a as { exam_id: string; ends_at?: string | null; started_at?: string | null };
      let ea = row.ends_at ?? null;
      if (!ea && row.started_at) {
        const exam = examById.get(row.exam_id);
        const mins = Number(exam?.duration_minutes) || 0;
        if (mins > 0) {
          const startMs = new Date(row.started_at).getTime();
          if (!Number.isNaN(startMs)) {
            ea = new Date(startMs + mins * 60_000).toISOString();
          }
        }
      }
      m.set(row.exam_id, ea);
    }
    return m;
  }, [attemptsQ.data, examsQ.data]);"""
          if old not in t:
              raise SystemExit("endsAtByExam not found")
          t = t.replace(old, new, 1)
          p.write_text(t)
          print("patched", len(t))
          PY

          python3 <<'PY'
          from pathlib import Path
          p = Path("src/components/cbt/CbtExamSession.impl.tsx")
          t = p.read_text()
          if "line-through decoration-slate-400" in t:
              print("greys already")
          else:
              old = '''                    className={cn("flex w-full items-start gap-3 rounded-xl border px-4 py-3 text-left text-sm transition",
                      selected ? "border-primary bg-primary/5 ring-2 ring-primary/20" : "border-slate-200 hover:border-primary/40")}>
                    <span className={cn("mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-full border text-xs font-bold",
                      selected ? "border-primary bg-primary text-white" : "border-slate-300 text-slate-500")}>{String.fromCharCode(65 + oi)}</span>
                    <span>{opt}</span>'''
              new = '''                    className={cn(
                      "flex w-full items-start gap-3 rounded-xl border px-4 py-3 text-left text-sm transition",
                      locked && selected && "border-slate-300 bg-slate-100 opacity-80 cursor-not-allowed",
                      locked && !selected && "border-slate-200 bg-slate-50 opacity-50 cursor-not-allowed line-through decoration-slate-400",
                      !locked && selected && "border-primary bg-primary/5 ring-2 ring-primary/20",
                      !locked && !selected && "border-slate-200 hover:border-primary/40",
                    )}>
                    <span className={cn(
                      "mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-full border text-xs font-bold",
                      locked && selected && "border-slate-400 bg-slate-400 text-white",
                      locked && !selected && "border-slate-300 text-slate-400",
                      !locked && selected && "border-primary bg-primary text-white",
                      !locked && !selected && "border-slate-300 text-slate-500",
                    )}>{String.fromCharCode(65 + oi)}</span>
                    <span className={cn(locked && !selected && "text-slate-400")}>{opt}</span>'''
              if old not in t:
                  raise SystemExit("option block not found")
              t = t.replace(old, new, 1)
              p.write_text(t)
              print("greys patched", len(t))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/student.index.tsx src/components/cbt/CbtExamSession.impl.tsx
          git commit -m "fix: restore student.index + Continue countdown fallback + grey locked answers" || echo nochange
          git push
