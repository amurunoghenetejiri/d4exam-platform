name: RUN-EXAM-PATCH
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/patch_exam_fixes.py"
      - ".github/workflows/RUN-EXAM-PATCH.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 scripts/patch_exam_fixes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx src/lib/cbt-save-result.ts
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "fix(cbt+officer): terminate no-result; lock on resume only; absolute timer; force-submit message"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
