name: RUN-EXAM-PATCH
on:
  push:
    paths:
      - ".github/workflows/RUN-EXAM-PATCH.yml"
      - "scripts/payloads/patch_exam_behavior.py.gz.b64"
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Decode and run patch
        run: |
          set -euo pipefail
          python3 -c "import base64,gzip,pathlib; b64=pathlib.Path('scripts/payloads/patch_exam_behavior.py.gz.b64').read_text().strip(); raw=gzip.decompress(base64.b64decode(b64)); pathlib.Path('scripts/patch_exam_behavior.py').write_bytes(raw); print(len(raw))"
          python3 scripts/patch_exam_behavior.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx src/components/cbt/ExamSecurityGate.tsx src/lib/live-audio.ts
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "fix: answers lock only after leave; absolute timer; mic UI; faster officer poll"
            git pull --rebase origin main || true
            git push origin main
          fi
