name: RUN-EXAM-PATCH
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/patch_lock_tab.py"
      - "scripts/patch_exam_fixes.py"
      - ".github/workflows/RUN-EXAM-PATCH.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run lock+tab patch
        run: |
          if [ -f scripts/patch_lock_tab.py ]; then
            python3 scripts/patch_lock_tab.py
          else
            python3 scripts/patch_exam_fixes.py
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "fix(cbt): lock answered options after leave+return; live tab violation consequences"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
