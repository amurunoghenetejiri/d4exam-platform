name: Apply identity v2
on:
  push:
    paths:
      - .github/workflows/apply-identity-v2.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 << 'PY'
          from pathlib import Path
          OM = Path("src/routes/officer.live-monitor.tsx")
          om = OM.read_text()

          # FrameEntry: ensure studentId field
          om = om.replace(
            "type FrameEntry = { src: string; ts: number; faceStatus?: string; cameraActive?: boolean; answeredCount?: number; totalQuestions?: number; timeRemainingSec?: number | null; studentName?: string; matricNumber?: string; courseCode?: string; examTitle?: string };",
            "type FrameEntry = { src: string; ts: number; faceStatus?: string; cameraActive?: boolean; answeredCount?: number; totalQuestions?: number; timeRemainingSec?: number | null; studentName?: string; matricNumber?: string; courseCode?: string; examTitle?: string; studentId?: string; examId?: string };",
          )

          # Store studentId/examId on frame entry
          old = """          studentName: p.studentName ? String(p.studentName).trim() : undefined,
          matricNumber: p.matricNumber ? String(p.matricNumber).trim() : undefined,"""
          # may already have course fields - match flexibly
          if "studentId: p.studentId" not in om.split("onFrame: (p: LiveCamFramePayload)")[1][:800]:
              om = om.replace(
                  "studentName: p.studentName ? String(p.studentName).trim() : undefined,",
                  "studentId: p.studentId ? String(p.studentId).trim() : undefined,\n          examId: p.examId ? String(p.examId).trim() : undefined,\n          studentName: p.studentName ? String(p.studentName).trim() : undefined,",
                  1,
              )
              print("frame store studentId")

          # frameOnly cards: use real student id + identity from frame
          old_fo = """      frameOnly.push({
        id: key,
        exam_id: "",
        student_id: key,
        status: "in_progress",
        started_at: new Date(entry.ts).toISOString(),
        updated_at: new Date(entry.ts).toISOString(),
        tab_switch_count: 0,
        metadata: { lastSeenAt: new Date(entry.ts).toISOString() },
        examinations: null,
        students: null,
      });"""
          new_fo = """      frameOnly.push({
        id: key,
        exam_id: String(entry.examId || ""),
        student_id: String(entry.studentId || key),
        status: "in_progress",
        started_at: new Date(entry.ts).toISOString(),
        updated_at: new Date(entry.ts).toISOString(),
        tab_switch_count: 0,
        metadata: {
          lastSeenAt: new Date(entry.ts).toISOString(),
          studentName: entry.studentName || undefined,
          matricNumber: entry.matricNumber || undefined,
          courseCode: entry.courseCode || undefined,
          examTitle: entry.examTitle || undefined,
        },
        examinations: entry.examTitle
          ? { title: entry.examTitle, status: "ongoing", courses: entry.courseCode ? { code: entry.courseCode } : null }
          : null,
        students: (entry.studentName || entry.matricNumber)
          ? {
              full_name: entry.studentName || null,
              matric_number: entry.matricNumber || null,
              student_id: entry.matricNumber || null,
            }
          : null,
      });"""
          if old_fo in om:
              om = om.replace(old_fo, new_fo, 1)
              print("frameOnly identity")
          else:
              print("FAIL frameOnly")

          # studentNamesQ: always store name even if empty, and store matric; never skip
          om = om.replace(
              'if (name && name.toLowerCase() !== matric.toLowerCase()) map[row.id] = name;',
              'map[row.id] = (name && (!matric || name.toLowerCase() !== matric.toLowerCase()) ? name : (name || pName || ""));\n        // keep matric available via side map on metadata path below',
          )

          # Better: change map to always prefer any non-empty name
          # Fix cards identity to treat resolved carefully + prefer non-Student
          old_name = '''        const resolved = studentNamesQ.data?.[String(a.student_id)];
        const frameId = camFrame || frames[a.id] || frames[`student:${a.student_id}`];
        const metaName = nameFromMetadata(a.metadata);
        const frameName = String(frameId?.studentName || "").trim();
        const name = (resolved && String(resolved).trim()) || frameName || metaName || studentDisplayName(a);'''
          new_name = '''        const resolved = studentNamesQ.data?.[String(a.student_id)];
        const frameId = camFrame || frames[a.id] || frames[`student:${a.student_id}`] || null;
        const metaName = nameFromMetadata(a.metadata);
        const frameName = String(frameId?.studentName || "").trim();
        const fromStudentRow = String(a.students?.full_name || "").trim();
        const nameCandidates = [
          typeof resolved === "string" ? resolved.trim() : "",
          frameName,
          metaName,
          fromStudentRow,
          studentDisplayName(a),
        ].filter((n) => n && n.toLowerCase() !== "student");
        const name = nameCandidates[0] || "Student";'''
          if old_name in om:
              om = om.replace(old_name, new_name, 1)
              print("name candidates")
          else:
              print("FAIL name candidates")

          # Matric: also from students row full path already; ensure frameMatric before dash
          old_mat = '''        const frameMatric = String(frameId?.matricNumber || "").trim();
        const matric = String(a.students?.matric_number || a.students?.student_id || frameMatric || metaMatric || "").trim() || "—";'''
          new_mat = '''        const frameMatric = String(frameId?.matricNumber || "").trim();
        const matric = String(
          a.students?.matric_number ||
            a.students?.student_id ||
            frameMatric ||
            metaMatric ||
            "",
        ).trim() || "—";'''
          if old_mat in om:
              om = om.replace(old_mat, new_mat, 1)
              print("matric")

          # Course from frame metadata too
          if "frameId?.courseCode" not in om:
              om = om.replace(
                  'const courseCode = String(courseObj?.code || examEnrichQ.data?.[String(a.exam_id)]?.courseCode || "").trim();',
                  'const courseCode = String(courseObj?.code || examEnrichQ.data?.[String(a.exam_id)]?.courseCode || frameId?.courseCode || (a.metadata as Record<string, unknown> | null)?.courseCode || "").trim();',
              )
              om = om.replace(
                  'const title = String(a.examinations?.title || examEnrichQ.data?.[String(a.exam_id)]?.title || "").trim() || "Exam";',
                  'const title = String(a.examinations?.title || examEnrichQ.data?.[String(a.exam_id)]?.title || frameId?.examTitle || (a.metadata as Record<string, unknown> | null)?.examTitle || "").trim() || "Exam";',
              )
              print("course/title frame")

          OM.write_text(om)
          print("DONE")
          PY
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          if git diff --staged --quiet; then echo No changes; else git commit -m "fix(officer-live): identity from frames + students row + metadata"; git push; fi
