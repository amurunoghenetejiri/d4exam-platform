name: APPLY-CONTINUE-TIMER-SURGICAL
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_continue_timer_patch.b64"
      - "scripts/run_continue_timer_patch.py"
      - ".github/workflows/APPLY-CONTINUE-TIMER-SURGICAL.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and run patch
        run: |
          set -e
          python3 -c "import base64,pathlib; p=pathlib.Path('scripts/run_continue_timer_patch.b64'); pathlib.Path('scripts/run_continue_timer_patch.py').write_bytes(base64.b64decode(p.read_text().strip()))"
          git show b6d2db7:src/components/dashboard/kit.tsx > src/components/dashboard/kit.tsx
          python3 scripts/run_continue_timer_patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/kit.tsx src/routes/student.index.tsx src/components/cbt/CbtExamSession.impl.tsx src/components/cbt/ExamCameraPip.tsx
          git diff --staged --quiet || git commit -m "fix: Continue remaining time, lock answered options, instant submit, Released/Held colors"
          git push
