name: PATCH-CBT-WHOLE-PAGE-SCROLL
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/PATCH-CBT-WHOLE-PAGE-SCROLL.yml
      - scripts/patch_cbt_whole_page_scroll.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply whole-page scroll fix
        run: python3 scripts/patch_cbt_whole_page_scroll.py
      - name: Verify
        run: |
          set -euo pipefail
          grep -q 'flex h-dvh flex-col' src/components/cbt/CbtExamSession.impl.tsx
          grep -q 'd4-cbt-scroll min-h-0 flex-1' src/components/cbt/CbtExamSession.impl.tsx
          grep -q 'd4-cbt-header z-40 shrink-0' src/components/cbt/CbtExamSession.impl.tsx
          grep -q '</main>' src/components/cbt/CbtExamSession.impl.tsx
          grep -q 'flex: 1 1 0%' src/styles.css
          echo OK
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/cbt/CbtExamSession.impl.tsx src/styles.css
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(cbt): whole exam body scrolls under pinned header (flex column, not question-only)"
            git push
          fi
