name: APPLY-OFFLINE-FIRST-REMAINING

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/APPLY-OFFLINE-FIRST-REMAINING.yml
      - scripts/apply_offline_first_remaining.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply patches
        run: python3 scripts/apply_offline_first_remaining.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/login.tsx .github/workflows/build-android.yml
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "feat(android): offline-first APK build checks + login offline guard"
            git push
          fi
