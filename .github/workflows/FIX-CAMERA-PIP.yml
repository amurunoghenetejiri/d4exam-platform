name: Fix ExamCameraPip no fake ok
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix camera pip
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/components/cbt/ExamCameraPip.tsx")
          t = p.read_text()
          t2 = t.replace(
          '''        if (!engine) {
          // Offline-first: no CDN face engine. Camera-only.
          setFaceStatus("ok");
          lastStateRef.current = "ok";
          onSecRef.current?.({ kind: "ok", faceCount: null, at: new Date().toISOString() });
          return;
        }faceEngineRef.current = engine;''',
          '''        if (!engine) {
          setFaceStatus("unavailable");
          lastStateRef.current = "unavailable";
          onSecRef.current?.({ kind: "unclear", faceCount: null, at: new Date().toISOString() });
          return;
        }
        faceEngineRef.current = engine;''',
          1,
          )
          t2 = t2.replace(
          '''      } catch {
        // Offline: continue camera-only
        setFaceStatus("ok");
        lastStateRef.current = "ok";
      }''',
          '''      } catch {
        setFaceStatus("unavailable");
        lastStateRef.current = "unavailable";
      }''',
          1,
          )
          if t2 == t:
              raise SystemExit("patterns not found")
          p.write_text(t2)
          print("ExamCameraPip fixed")
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/cbt/ExamCameraPip.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(cbt): ExamCameraPip — do not fake 1-face when detector missing"
            git push
          fi
