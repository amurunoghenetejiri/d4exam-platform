name: Fix vibration keepalive + faceDetection

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-vibration-keepalive.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply vibration fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("src/components/cbt/CbtExamSession.impl.tsx")
          t = p.read_text()
          changed = []

          a = 'import { hapticOfficerWarning, haptic as fireHaptic, primeHaptics, refreshHapticUnlock } from "@/lib/haptic";'
          b = 'import { hapticOfficerWarning, haptic as fireHaptic, primeHaptics, refreshHapticUnlock, startHapticKeepAlive, stopHapticKeepAlive } from "@/lib/haptic";'
          if a in t:
              t = t.replace(a, b, 1)
              changed.append("import")
          elif "startHapticKeepAlive" in t:
              changed.append("import-ok")

          a = "faceDetection={Boolean(security.faceDetection)}"
          b = "faceDetection={Boolean(security.faceDetection || security.requireCamera)}"
          if a in t:
              t = t.replace(a, b, 1)
              changed.append("faceDetection")
          elif b in t:
              changed.append("faceDetection-ok")

          a = "try { primeHaptics(); } catch { /* ignore */ }"
          b = "try { primeHaptics(); startHapticKeepAlive(); } catch { /* ignore */ }"
          if a in t and "startHapticKeepAlive()" not in t:
              t = t.replace(a, b, 1)
              changed.append("prime-keepalive")
          elif "startHapticKeepAlive()" in t:
              changed.append("prime-ok")

          a = """  const shutdownMedia = useCallback(() => {
    stopLiveCamStream();
    stopMediaStream(mediaStreamRef.current);
    mediaStreamRef.current = null;
    setLiveStream(null);
  }, [stopLiveCamStream]);"""
          b = """  const shutdownMedia = useCallback(() => {
    try { stopHapticKeepAlive(); } catch { /* ignore */ }
    stopLiveCamStream();
    stopMediaStream(mediaStreamRef.current);
    mediaStreamRef.current = null;
    setLiveStream(null);
  }, [stopLiveCamStream]);"""
          if "stopHapticKeepAlive()" not in t and a in t:
              t = t.replace(a, b, 1)
              changed.append("shutdown")
          elif "stopHapticKeepAlive()" in t:
              changed.append("shutdown-ok")

          p.write_text(t)
          print("session:", changed)

          h = Path("src/lib/haptic.ts")
          ht = h.read_text()
          hc = []
          if "}, 12_000);" in ht:
              ht = ht.replace("}, 12_000);", "}, 8_000);", 1)
              hc.append("8s")
          if "const pulse = Math.max(60, ms);" in ht:
              ht = ht.replace("const pulse = Math.max(60, ms);", "const pulse = Math.max(80, ms);", 1)
              hc.append("pulse80")
          h.write_text(ht)
          print("haptic:", hc)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx src/lib/haptic.ts || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(cbt): vibration keepalive + faceDetection when camera required"
            git push
          fi
