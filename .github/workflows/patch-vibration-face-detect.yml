name: Patch vibration face-detect + keepalive

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-vibration-face-detect.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch CbtExamSession and ExamCameraPip
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("src/components/cbt/CbtExamSession.impl.tsx")
          t = p.read_text()
          changed = False

          a = 'faceDetection={Boolean(security.faceDetection)}'
          b = 'faceDetection={Boolean(security.faceDetection || security.requireCamera)}'
          if a in t:
              t = t.replace(a, b, 1)
              changed = True
              print("faceDetection forced when camera required")
          elif b in t:
              print("faceDetection already forced")
          else:
              print("WARN: faceDetection prop line not found")

          a2 = 'import { hapticOfficerWarning, haptic as fireHaptic, primeHaptics, refreshHapticUnlock } from "@/lib/haptic";'
          b2 = 'import { hapticOfficerWarning, haptic as fireHaptic, primeHaptics, refreshHapticUnlock, startHapticKeepAlive, stopHapticKeepAlive } from "@/lib/haptic";'
          if a2 in t:
              t = t.replace(a2, b2, 1)
              changed = True
              print("keepalive import added")
          elif "startHapticKeepAlive" in t:
              print("keepalive import already present")

          a3 = "try { primeHaptics(); } catch { /* ignore */ }"
          b3 = "try { primeHaptics(); startHapticKeepAlive(); } catch { /* ignore */ }"
          if a3 in t and "startHapticKeepAlive()" not in t:
              t = t.replace(a3, b3, 1)
              changed = True
              print("prime+keepalive wired")

          if "stopHapticKeepAlive()" not in t:
              old = "  const shutdownMedia = useCallback(() => {\n    stopLiveCamStream();"
              new = "  const shutdownMedia = useCallback(() => {\n    try { stopHapticKeepAlive(); } catch { /* ignore */ }\n    stopLiveCamStream();"
              if old in t:
                  t = t.replace(old, new, 1)
                  changed = True
                  print("shutdown stop keepalive")

          if "notifyOfficersExamStarted" not in t:
              marker = "      setSeconds((examQ.data?.duration_minutes ?? 60) * 60);\n      setStarted(true);\n      setIndex(0);"
              insert = marker + '''\n      if (!previewMode && student?.studentId && examQ.data?.school_id) {\n        try {\n          const { notifyOfficersExamStarted } = await import("@/lib/notify");\n          void notifyOfficersExamStarted({\n            schoolId: String(examQ.data.school_id),\n            examId: id,\n            examTitle: String(examQ.data.title || "Examination"),\n            studentName: student.fullName || null,\n            matric: student.matric || null,\n          });\n        } catch { /* ignore */ }\n      }'''
              if marker in t:
                  t = t.replace(marker, insert, 1)
                  changed = True
                  print("exam start notify wired")

          if changed:
              p.write_text(t)
              print("CbtExamSession written", len(t))
          else:
              print("CbtExamSession no change")

          pip = Path("src/components/cbt/ExamCameraPip.tsx")
          pt = pip.read_text()
          pc = False
          if 'refreshHapticUnlock' not in pt.split('from "@/lib/haptic"')[0][-120:]:
              pt2 = pt.replace(
                  'import { haptic as fireHaptic, type HapticKind } from "@/lib/haptic";',
                  'import { haptic as fireHaptic, refreshHapticUnlock, type HapticKind } from "@/lib/haptic";',
              )
              if pt2 != pt:
                  pt = pt2
                  pc = True
                  print("PIP import refresh")
          if "refreshHapticUnlock();" not in pt:
              old = """    try {
      haptic(kind);
    } catch {
      /* ignore */
    }"""
              new = """    try {
      refreshHapticUnlock();
      haptic(kind);
      if (kind === "multi" || kind === "camera_blocked") {
        window.setTimeout(() => { try { haptic(kind); } catch { /* ignore */ } }, 100);
      }
    } catch {
      /* ignore */
    }"""
              if old in pt:
                  pt = pt.replace(old, new, 1)
                  pc = True
                  print("PIP haptic double-fire")
          if "ALERT_COOLDOWN_MS = 2500" in pt:
              pt = pt.replace("ALERT_COOLDOWN_MS = 2500", "ALERT_COOLDOWN_MS = 1800", 1)
              pc = True
              print("PIP cooldown 1800")
          if pc:
              pip.write_text(pt)
              print("ExamCameraPip written")
          else:
              print("ExamCameraPip no change")
          PY
      - name: Commit
        run: |
          git config user.name "amurunoghenetejiri"
          git config user.email "amurunoghenetejiri@gmail.com"
          git add src/components/cbt/CbtExamSession.impl.tsx src/components/cbt/ExamCameraPip.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: force face detection for vibration + haptic keepalive + start notify"
            git push origin HEAD:main
          fi
