name: Force CBT production fixes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/force-cbt-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch CbtExamSession studentName + force touch
        run: |
          python3 << 'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path("src/components/cbt/CbtExamSession.impl.tsx")
          t = p.read_text(encoding="utf-8")
          changed = False

          old_meta = "metadata: { cameraActive: needCam, lastSeenAt: new Date().toISOString(), videoStreaming: needCam },"
          new_meta = """metadata: {
              cameraActive: needCam,
              lastSeenAt: new Date().toISOString(),
              videoStreaming: needCam,
              studentName: String(student.fullName || "").trim() || null,
              matric: String(student.matric || "").trim() || null,
            },"""
          if old_meta in t:
              t = t.replace(old_meta, new_meta, 1)
              changed = True
              print("patched beginWithMedia metadata with studentName")
          else:
              print("beginWithMedia metadata already patched or different shape")

          needle = "const payload = {\n        cameraActive:"
          insert = """const payload = {
        // Keep name on every heartbeat so officer live-monitor can show it (profiles RLS)
        studentName: String(student?.fullName || "").trim() || null,
        matric: String(student?.matric || "").trim() || null,
        cameraActive:"""
          if needle in t and "studentName: String(student?.fullName" not in t:
              t = t.replace(needle, insert, 1)
              changed = True
              print("patched presence payload with studentName")
          else:
              print("presence payload already has studentName or different shape")

          if 'to: "/student/results/$id"' in t:
              print("goToResult path OK")
          else:
              print("WARN: goToResult path missing")

          if "hapticOfficerWarning" in t:
              print("hapticOfficerWarning OK")
          else:
              print("WARN: hapticOfficerWarning missing")

          stamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          if not changed:
              t = t.rstrip() + f"\n\n/* force-cbt-fixes {stamp} */\n"
              print("force touch for redeploy")
          p.write_text(t, encoding="utf-8")
          print("done")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: write studentName into attempt metadata + force production redeploy (results, haptics, names)"
          git push
