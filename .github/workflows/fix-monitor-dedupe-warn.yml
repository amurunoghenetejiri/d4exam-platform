name: Fix monitor dedupe and warnings
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-monitor-dedupe-warn.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path

          p = Path("src/routes/officer.live-monitor.tsx")
          t = p.read_text()

          old_cards = '''  const cards = useMemo(() => {
            const inProgress = attemptsQ.data ?? [];
            const recentDone = recentDoneQ.data ?? [];
            const merged = [...inProgress, ...recentDone];
            const seen = new Set<string>();
            return merged
              .filter((a) => {
                if (seen.has(a.id)) return false;
                seen.add(a.id);
                return true;
              })
              .map((a) => {'''

          new_cards = '''  const cards = useMemo(() => {
            const inProgress = attemptsQ.data ?? [];
            const recentDone = recentDoneQ.data ?? [];
            const merged = [...inProgress, ...recentDone];
            // One card per student: prefer in-progress + live frame + most recent activity
            const byStudent = new Map<string, AttemptRow>();
            const attemptRank = (a: AttemptRow) => {
              const st = String(a.status || "").toLowerCase();
              const isDone = ["submitted", "terminated", "flagged", "completed"].includes(st);
              const frame = frames[a.id] || frames[`student:${a.student_id}`];
              const frameTs = frame?.ts ?? 0;
              const updated = a.updated_at ? new Date(a.updated_at).getTime() : 0;
              const started = a.started_at ? new Date(a.started_at).getTime() : 0;
              const liveBoost = frame && isLiveCamFrameFresh(frame.ts, Date.now()) ? 1e15 : 0;
              const progressBoost = isDone ? 0 : 1e14;
              return progressBoost + liveBoost + Math.max(frameTs, updated, started);
            };
            for (const a of merged) {
              const key = String(a.student_id || a.id);
              const prev = byStudent.get(key);
              if (!prev || attemptRank(a) >= attemptRank(prev)) byStudent.set(key, a);
            }
            const unique = Array.from(byStudent.values());
            return unique
              .map((a) => {'''

          if "byStudent" in t:
              print("dedupe already present")
          elif old_cards in t:
              t = t.replace(old_cards, new_cards, 1)
              print("dedupe applied")
          else:
              raise SystemExit("cards block not found")

          old_send = '''      await notifyStudentOfficerWarning({
            schoolId,
            studentId: selected.a.student_id,
            examId: selected.a.exam_id,
            examTitle: selected.title,
            message: "Warning: Follow exam rules. Further violations may void your result.",
          });
          toast.success(`Warning sent to ${selected.name}`);'''

          new_send = '''      await notifyStudentOfficerWarning({
            schoolId,
            studentId: selected.a.student_id,
            examId: selected.a.exam_id,
            examTitle: selected.title,
            message: "Warning: Follow exam rules. Further violations may void your result.",
          });
          // Instant in-exam delivery via Realtime broadcast (does not depend on RLS on integrity_events)
          try {
            const warnCh = supabase.channel(`student-exam-warn:${selected.a.student_id}`);
            await warnCh.subscribe();
            await warnCh.send({
              type: "broadcast",
              event: "officer_warning",
              payload: {
                studentId: selected.a.student_id,
                examId: selected.a.exam_id,
                attemptId: selected.a.id,
                message: "Warning: Follow exam rules. Further violations may void your result.",
                ts: Date.now(),
              },
            });
            void supabase.removeChannel(warnCh);
          } catch (be) {
            console.warn("[live-monitor] warn broadcast", be);
          }
          toast.success(`Warning sent to ${selected.name}`);'''

          if "student-exam-warn:" in t and "warnCh" in t:
              print("broadcast already present")
          elif old_send in t:
              t = t.replace(old_send, new_send, 1)
              print("broadcast applied")
          else:
              raise SystemExit("send block not found")

          p.write_text(t)

          sp = Path("src/components/cbt/CbtExamSession.impl.tsx")
          st = sp.read_text()

          if "student-exam-warn:" in st and "broadcastCh" in st:
              print("session warn already patched")
          else:
              marker = "  // Officer warnings from live monitor"
              if marker not in st:
                  raise SystemExit("session warn marker missing")
              # Replace from marker through the dependency array closing of that effect
              start = st.index(marker)
              end = st.index("  }, [started, done, previewMode, student?.studentId, id]);", start)
              end = st.index("\n", end) + 1
              new_block = '''  // Officer warnings from live monitor — top banner + haptic during the attempt
  useEffect(() => {
    if (!started || done || previewMode) return;
    const studentId = student?.studentId;
    if (!studentId || !id) return;

    const showWarn = (raw?: string | null) => {
      const msg =
        String(raw || "").trim() ||
        "Officer warning: Follow exam rules. Further violations may void your result.";
      setWarnBanner(msg);
      try {
        haptic("officer_warning");
      } catch {
        /* ignore */
      }
      window.setTimeout(() => setWarnBanner(null), 12_000);
    };

    // 1) Broadcast channel — immediate, no RLS dependency
    const broadcastCh = supabase
      .channel(`student-exam-warn:${studentId}`)
      .on("broadcast", { event: "officer_warning" }, ({ payload }) => {
        try {
          const p = (payload || {}) as {
            examId?: string;
            studentId?: string;
            message?: string;
          };
          if (p.studentId && String(p.studentId) !== String(studentId)) return;
          if (p.examId && String(p.examId) !== String(id)) return;
          showWarn(p.message);
        } catch {
          /* ignore */
        }
      })
      .subscribe();

    // 2) postgres integrity_events (backup if RLS allows)
    const pgCh = supabase
      .channel(`exam-officer-warn-${id}-${studentId}`)
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "integrity_events",
          filter: `student_id=eq.${studentId}`,
        },
        (payload) => {
          try {
            const row = payload.new as {
              event_type?: string;
              description?: string;
              exam_id?: string | null;
            };
            const et = String(row.event_type || "").toUpperCase();
            if (et !== "WARNING_SHOWN" && et !== "OFFICER_WARNING") return;
            if (row.exam_id && String(row.exam_id) !== String(id)) return;
            showWarn(row.description);
          } catch {
            /* ignore */
          }
        },
      )
      .subscribe();

    return () => {
      void supabase.removeChannel(broadcastCh);
      void supabase.removeChannel(pgCh);
    };
  }, [started, done, previewMode, student?.studentId, id]);
'''
              st = st[:start] + new_block + st[end:]
              sp.write_text(st)
              print("session warn patched")

          # balance check
          import re
          t = p.read_text()
          start = t.index('  return (\n    <div className="mx-auto')
          end = t.index('\nfunction StatCard')
          jsx = t[start:end]
          o = len(re.findall(r'<div\\b', jsx))
          c = len(re.findall(r'</div>', jsx))
          print('officer divs', o, c)
          assert o == c
          assert 'byStudent' in t
          assert 'student-exam-warn:' in t
          assert 'student-exam-warn:' in sp.read_text()
          print('OK')
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add src/routes/officer.live-monitor.tsx src/components/cbt/CbtExamSession.impl.tsx
          git diff --cached --stat || true
          git commit -m "fix(monitor): one card per student; instant officer warning via broadcast" || echo no-changes
          git pull --rebase origin main || true
          git push origin main
