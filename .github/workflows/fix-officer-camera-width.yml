name: fix-officer-camera-width
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-officer-camera-width.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Full-width student camera in officer detail
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/routes/officer.live-monitor.tsx')
          t = p.read_text()
          a = 'relative mx-auto aspect-square w-full max-w-[min(100%,420px)] bg-slate-900'
          b = 'relative w-full bg-slate-900'
          if a in t:
              t = t.replace(a, b, 1)
              # add fixed height close to previous square height
              t = t.replace(
                  '<div className="sticky top-0 z-10 border-b border-slate-200 bg-white shadow-sm"><div className="relative w-full bg-slate-900">',
                  '<div className="sticky top-0 z-10 border-b border-slate-200 bg-white shadow-sm"><div className="relative w-full bg-slate-900" style={{ height: "min(420px, 70vw)" }}>',
                  1,
              )
              print('patched aspect-square')
          elif 'height: "min(420px, 70vw)"' in t:
              print('already patched')
          else:
              t2 = t.replace(
                  'mx-auto aspect-square w-full max-w-[min(100%,420px)]',
                  'w-full',
              )
              if t2 != t:
                  t = t2
                  print('patched alt')
              else:
                  print('NO MATCH')
          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/officer.live-monitor.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m 'fix(officer): full-width student camera viewer (keep height)'
            git push
          fi
