name: Apply departmental officer labels
on:
  push:
    paths:
      - "DEPLOY_TRIGGER.txt"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply renames and Clear all
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path

          replacements = {
            "src/components/layout/AppShell.tsx": [
              ('examination_officer: { label: "Exam Officer", icon: Shield}',
               'examination_officer: { label: "Departmental Officer", icon: Shield}'),
            ],
            "src/components/pages/ProfilePage.tsx": [
              ('examination_officer: "Examination Officer"', 'examination_officer: "Departmental Officer"'),
            ],
            "src/components/navigation/navConfig.ts": [
              ('label: "Examination Officers"', 'label: "Departmental Officers"'),
              ('label: "Examination Officer"', 'label: "Departmental Officer"'),
            ],
            "src/routes/officer.index.tsx": [
              ("Examination Officer Dashboard", "Departmental Officer Dashboard"),
              (", Examination Officer", ", Departmental Officer"),
              ("Examination officer dashboard", "Departmental officer dashboard"),
            ],
            "src/routes/admin.officers.tsx": [
              ("Examination Officers — D4EXAM", "Departmental Officers — D4EXAM"),
              ('title="Examination Officers"', 'title="Departmental Officers"'),
              ("Add examination officer", "Add departmental officer"),
              ("No examination officers yet", "No departmental officers yet"),
              ("Create officers who approve", "Create departmental officers who approve"),
              ("How officers sign in", "How departmental officers sign in"),
              ("Create the first officer with", "Create the first departmental officer with"),
            ],
            "src/routes/index.tsx": [
              ('title: "Exam Officers"', 'title: "Departmental Officers"'),
            ],
            "src/routes/student.results.tsx": [
              ("Examination Officer", "Departmental Officer"),
              ("examination officer", "departmental officer"),
            ],
            "src/routes/student.results.$id.tsx": [
              ("Examination Officer", "Departmental Officer"),
            ],
            "src/routes/student.examinations.tsx": [
              ("Examination Officer", "Departmental Officer"),
            ],
            "src/routes/officer.settings.tsx": [
              ("examination officer account", "departmental officer account"),
              ('scope="examination officer"', 'scope="departmental officer"'),
            ],
            "src/routes/officer.notifications.tsx": [
              ("examination officer account", "departmental officer account"),
            ],
            "src/routes/pricing.tsx": [
              ("Examination officer workflow", "Departmental officer workflow"),
            ],
            "src/routes/support.tsx": [
              ("examination officer approval", "departmental officer approval"),
            ],
            "src/routes/about.tsx": [
              ("examination officer structures", "departmental officer structures"),
            ],
            "src/lib/notify.ts": [
              ("An examination officer sent you a warning", "A departmental officer sent you a warning"),
            ],
            "src/lib/access-control.ts": [
              ("// examination officer owns approval workflow",
               "// departmental officer (examination_officer) owns approval workflow"),
            ],
            "src/data/mock/index.ts": [
              ('role: "Examination Officer"', 'role: "Departmental Officer"'),
              ("by the examination officer.", "by the departmental officer."),
            ],
            "docs/NOTIFICATIONS.md": [
              ("Examination officer", "Departmental officer"),
            ],
          }

          for path, pairs in replacements.items():
            p = Path(path)
            if not p.exists():
              print("skip missing", path)
              continue
            text = p.read_text(encoding="utf-8")
            for old, new in pairs:
              text = text.replace(old, new)
            p.write_text(text, encoding="utf-8")
            print("updated", path)

          np = Path("src/components/pages/NotificationsPage.tsx")
          if np.exists():
            t = np.read_text(encoding="utf-8")
            if "clearAllNotifications" not in t and "async function markAllRead" in t:
              old = '''  async function markAllRead() {
    if (!user?.userId) return;
    setBusy(true);
    try {
      const { error: upErr } = await supabase
        .from("notifications")
        .update({ read_at: new Date().toISOString() })
        .eq("recipient_user_id", user.userId)
        .is("read_at", null);
      if (upErr) throw upErr;
      await invalidateAll();
      toast.success("All notifications marked as read");
    } catch (e) {
      toast.error((e as Error).message || "Could not update");
    } finally {
      setBusy(false);
    }
  }'''
              new = old + '''

  async function clearAllNotifications() {
    if (!user?.userId) return;
    if (!items.length) return;
    if (!window.confirm("Remove all notifications? This cannot be undone.")) return;
    setBusy(true);
    try {
      const { error: delErr } = await supabase
        .from("notifications")
        .delete()
        .eq("recipient_user_id", user.userId);
      if (delErr) throw delErr;
      await invalidateAll();
      toast.success("All notifications cleared");
    } catch (e) {
      toast.error((e as Error).message || "Could not clear notifications");
    } finally {
      setBusy(false);
    }
  }'''
              if old in t:
                t = t.replace(old, new)
              old_act = '''        actions={
          <Button
            type="button"
            variant="outline"
            size="sm"
            disabled={busy || unread === 0}
            onClick={() => void markAllRead()}
          >
            {busy ? <Loader2 className="mr-1 h-4 w-4 animate-spin" /> : <CheckCheck className="mr-1 h-4 w-4" />}
            Mark all read
          </Button>
        }'''
              new_act = '''        actions={
          <div className="flex flex-wrap items-center gap-2">
            <Button
              type="button"
              variant="outline"
              size="sm"
              disabled={busy || unread === 0}
              onClick={() => void markAllRead()}
            >
              {busy ? <Loader2 className="mr-1 h-4 w-4 animate-spin" /> : <CheckCheck className="mr-1 h-4 w-4" />}
              Mark all read
            </Button>
            <Button
              type="button"
              variant="outline"
              size="sm"
              disabled={busy || items.length === 0}
              onClick={() => void clearAllNotifications()}
            >
              <Trash2 className="mr-1 h-4 w-4" />
              Clear all
            </Button>
          </div>
        }'''
              if old_act in t:
                t = t.replace(old_act, new_act)
              np.write_text(t, encoding="utf-8")
              print("NotificationsPage clear-all applied")
            else:
              print("NotificationsPage skip")

          mig = Path("supabase/migrations/20260824120000_departmental_officer_labels.sql")
          if not mig.exists():
            mig.write_text("""-- D4EXAM: Departmental Officer display name for role examination_officer.
-- Machine value stays examination_officer. No data rewrite.

COMMENT ON TABLE public.examination_officers IS
  'Departmental officers (DB role examination_officer).';

ALTER TABLE public.notifications ADD COLUMN IF NOT EXISTS priority text DEFAULT 'normal';
""", encoding="utf-8")
            print("wrote migration")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "feat(roles+notify): Departmental Officer labels + Clear all notifications"
          git push
