name: Apply departmental officer labels
on:
  push:
    paths:
      - "DEPLOY_TRIGGER.txt"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sed renames + clear all
        run: |
          set -euo pipefail
          # Display labels only — keep machine role examination_officer
          sed -i 's/label: "Exam Officer"/label: "Departmental Officer"/g' src/components/layout/AppShell.tsx || true
          sed -i 's/"Examination Officer"/"Departmental Officer"/g' src/components/pages/ProfilePage.tsx || true
          sed -i 's/label: "Examination Officers"/label: "Departmental Officers"/g' src/components/navigation/navConfig.ts || true
          sed -i 's/label: "Examination Officer"/label: "Departmental Officer"/g' src/components/navigation/navConfig.ts || true
          sed -i 's/Examination Officer Dashboard/Departmental Officer Dashboard/g' src/routes/officer.index.tsx || true
          sed -i 's/, Examination Officer/, Departmental Officer/g' src/routes/officer.index.tsx || true
          sed -i 's/Examination officer dashboard/Departmental officer dashboard/g' src/routes/officer.index.tsx || true
          sed -i 's/Examination Officers — D4EXAM/Departmental Officers — D4EXAM/g' src/routes/admin.officers.tsx || true
          sed -i 's/title="Examination Officers"/title="Departmental Officers"/g' src/routes/admin.officers.tsx || true
          sed -i 's/Add examination officer/Add departmental officer/g' src/routes/admin.officers.tsx || true
          sed -i 's/No examination officers yet/No departmental officers yet/g' src/routes/admin.officers.tsx || true
          sed -i 's/Create officers who approve/Create departmental officers who approve/g' src/routes/admin.officers.tsx || true
          sed -i 's/How officers sign in/How departmental officers sign in/g' src/routes/admin.officers.tsx || true
          sed -i 's/Create the first officer with/Create the first departmental officer with/g' src/routes/admin.officers.tsx || true
          sed -i 's/title: "Exam Officers"/title: "Departmental Officers"/g' src/routes/index.tsx || true
          sed -i 's/Examination Officer/Departmental Officer/g' src/routes/student.results.tsx src/routes/student.results.\$id.tsx src/routes/student.examinations.tsx || true
          sed -i 's/examination officer/departmental officer/g' src/routes/student.results.tsx src/routes/officer.settings.tsx src/routes/officer.notifications.tsx src/routes/support.tsx src/routes/about.tsx || true
          sed -i 's/Examination officer workflow/Departmental officer workflow/g' src/routes/pricing.tsx || true
          sed -i 's/scope="examination officer"/scope="departmental officer"/g' src/routes/officer.settings.tsx || true
          sed -i 's/An examination officer sent you a warning/A departmental officer sent you a warning/g' src/lib/notify.ts || true
          sed -i 's/role: "Examination Officer"/role: "Departmental Officer"/g' src/data/mock/index.ts || true
          sed -i 's/by the examination officer\./by the departmental officer./g' src/data/mock/index.ts || true
          sed -i 's/Examination officer/Departmental officer/g' docs/NOTIFICATIONS.md || true

          # Clear all on NotificationsPage if missing
          if ! grep -q clearAllNotifications src/components/pages/NotificationsPage.tsx; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("src/components/pages/NotificationsPage.tsx")
          t = p.read_text()
          old = '''  async function markAllRead() {
    if (!user?.userId) return;
    setBusy(true);
    try {
      const { error: upErr } = await supabase
        .from("notifications")
        .update({ read_at: new Date().toISOString() })
        .eq("recipient_user_id", user.userId)
        .is("read_at", null);
      if (upErr) throw upErr;
      await invalidateAll();
      toast.success("All notifications marked as read");
    } catch (e) {
      toast.error((e as Error).message || "Could not update");
    } finally {
      setBusy(false);
    }
  }'''
          new = old + '''

  async function clearAllNotifications() {
    if (!user?.userId) return;
    if (!items.length) return;
    if (!window.confirm("Remove all notifications? This cannot be undone.")) return;
    setBusy(true);
    try {
      const { error: delErr } = await supabase
        .from("notifications")
        .delete()
        .eq("recipient_user_id", user.userId);
      if (delErr) throw delErr;
      await invalidateAll();
      toast.success("All notifications cleared");
    } catch (e) {
      toast.error((e as Error).message || "Could not clear notifications");
    } finally {
      setBusy(false);
    }
  }'''
          if old in t:
            t = t.replace(old, new)
          old_act = '''        actions={
          <Button
            type="button"
            variant="outline"
            size="sm"
            disabled={busy || unread === 0}
            onClick={() => void markAllRead()}
          >
            {busy ? <Loader2 className="mr-1 h-4 w-4 animate-spin" /> : <CheckCheck className="mr-1 h-4 w-4" />}
            Mark all read
          </Button>
        }'''
          new_act = '''        actions={
          <div className="flex flex-wrap items-center gap-2">
            <Button
              type="button"
              variant="outline"
              size="sm"
              disabled={busy || unread === 0}
              onClick={() => void markAllRead()}
            >
              {busy ? <Loader2 className="mr-1 h-4 w-4 animate-spin" /> : <CheckCheck className="mr-1 h-4 w-4" />}
              Mark all read
            </Button>
            <Button
              type="button"
              variant="outline"
              size="sm"
              disabled={busy || items.length === 0}
              onClick={() => void clearAllNotifications()}
            >
              <Trash2 className="mr-1 h-4 w-4" />
              Clear all
            </Button>
          </div>
        }'''
          if old_act in t:
            t = t.replace(old_act, new_act)
          p.write_text(t)
          print("clear-all applied")
          PY
          fi

          if [ ! -f supabase/migrations/20260824120000_departmental_officer_labels.sql ]; then
            cat > supabase/migrations/20260824120000_departmental_officer_labels.sql << 'SQL'
          -- Display name: Departmental Officer. DB role remains examination_officer.
          COMMENT ON TABLE public.examination_officers IS
            'Departmental officers (DB role examination_officer).';
          ALTER TABLE public.notifications ADD COLUMN IF NOT EXISTS priority text DEFAULT 'normal';
          SQL
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "feat(roles+notify): Departmental Officer labels + Clear all notifications"
          git push
