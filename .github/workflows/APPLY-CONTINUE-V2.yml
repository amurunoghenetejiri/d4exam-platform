              )}
              {helpDoc === "privacy" && (
                <div className="space-y-3">
                  <p className="text-base font-bold text-slate-900">Privacy Policy</p>
                  <p>D4EXAM processes account, examination, and integrity data only to deliver secure CBT services for your school.</p>
                  <ul className="list-disc space-y-1 pl-5">
                    <li>Camera and microphone are used only when required by exam security settings.</li>
                    <li>Results and attempts are visible according to your school's policies and roles.</li>
                    <li>Push notification tokens are stored to deliver exam alerts on your devices.</li>
                  </ul>
                  <p className="text-xs text-slate-500">For the full policy, your school admin or the public website privacy page can provide additional detail.</p>
                </div>
              )}
              {helpDoc === "pricing" && (
                <div className="space-y-3">
                  <p className="text-base font-bold text-slate-900">Pricing</p>
                  <p>D4EXAM is licensed per school. Plans typically cover student seats, examinations, monitoring, and support.</p>
                  <p>Contact your school administrator or the D4EXAM sales team for the plan that applies to your institution.</p>
                  <p className="text-xs text-slate-500">Trial schools have time-limited access until the trial ends or is upgraded.</p>
                </div>
              )}
            </div>
          </div>
        ) : null}'''
          if old_help in t:
              t = t.replace(old_help, new_help, 1)
              print("settings: help sheet")
          else:
              print("settings: help skip", "helpDoc" in t)
          p.write_text(t)
          print("settings size", len(t))

          Path("FORCE_DEPLOY.txt").write_text("continue-v2-timer-lock-settings 2026-09-10\n")
          print("done")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx src/routes/student.examinations.tsx src/components/pages/SettingsPage.tsx FORCE_DEPLOY.txt
          git status
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: continue exam remaining timer, locked answers, Settings help in-app Back"
          git push origin HEAD:main
