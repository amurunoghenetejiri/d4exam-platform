name: Restore CBT session haptic unlock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore session from last good commit and wire haptic unlock
        run: |
          python3 << 'PY'
          from pathlib import Path
          import subprocess
          # Restore full session body from known-good commit (before placeholder accidents)
          blob = subprocess.check_output(
              ["git", "show", "aaeee1296e7302c3ae3caed94c8bd75bdf0f12ae:src/components/cbt/CbtExamSession.impl.tsx"],
              text=True,
          )
          p = Path("src/components/cbt/CbtExamSession.impl.tsx")
          t = blob
          old_import = 'import { haptic, primeHaptics } from "@/lib/haptic";'
          new_import = 'import { haptic, primeHaptics, refreshHapticUnlock } from "@/lib/haptic";'
          if old_import in t:
              t = t.replace(old_import, new_import, 1)
          elif "refreshHapticUnlock" not in t:
              raise SystemExit("import line not found")
          if "Keep vibration unlocked while the student interacts" not in t:
              block = (
                  '  /** Keep vibration unlocked while the student interacts with the exam UI. */\n'
                  '  useEffect(() => {\n'
                  '    if (previewMode || !started || done) return;\n'
                  '    const onInteract = () => {\n'
                  '      try {\n'
                  '        refreshHapticUnlock();\n'
                  '      } catch {\n'
                  '        /* ignore */\n'
                  '      }\n'
                  '    };\n'
                  '    document.addEventListener("pointerdown", onInteract, { passive: true });\n'
                  '    document.addEventListener("touchstart", onInteract, { passive: true });\n'
                  '    return () => {\n'
                  '      document.removeEventListener("pointerdown", onInteract);\n'
                  '      document.removeEventListener("touchstart", onInteract);\n'
                  '    };\n'
                  '  }, [previewMode, started, done]);\n\n'
              )
              for anchor in ("  useExamAttemptHeartbeat({", "  useLiveCamPublish({"):
                  if anchor in t:
                      t = t.replace(anchor, block + anchor, 1)
                      break
              else:
                  raise SystemExit("no anchor for unlock effect")
          p.write_text(t)
          assert "refreshHapticUnlock" in p.read_text()
          assert "prepareStudentPaper" in p.read_text()
          assert "export function CbtExamPage" in p.read_text()
          print("OK", p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/cbt/CbtExamSession.impl.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(haptic): restore CBT session + refreshHapticUnlock on touch"
            git push
          fi
