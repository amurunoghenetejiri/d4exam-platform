name: Apply mobile face shell fix
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-mobile-face-shell.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch files
        run: |
          set -e
          python3 <<'ENDPY'
          from pathlib import Path

          css = Path("src/styles.css")
          c = css.read_text()
          marker = "mobile safe-area / CBT fixes (2026-08-24)"
          if marker not in c:
              c += """

          /* === mobile safe-area / CBT fixes (2026-08-24) === */
          html.d4-exam-immersive,
          html.d4-exam-immersive body {
            background-color: #0b1b3a !important;
          }
          html.d4-exam-immersive header.fixed {
            background-color: #0b1b3a !important;
          }
          html.d4-native div[role="dialog"].fixed.inset-y-0 {
            padding-top: env(safe-area-inset-top, 0px);
          }
          html.d4-native .d4-shell-main-offset > main,
          html.d4-native .relative.z-10.pt-12 > main {
            padding-top: 0.75rem !important;
          }
          """
              css.write_text(c)
              print("styles ok")
          else:
              print("styles skip")

          s = Path("src/components/layout/AppShell.tsx")
          t = s.read_text()
          t = t.replace(
              'style={{ position: "fixed" }}',
              'style={{ position: "fixed", paddingTop: "env(safe-area-inset-top, 0px)" }}',
              1,
          )
          t = t.replace(
              '<div className="flex h-16 shrink-0 items-center justify-between gap-2 border-b border-white/10 px-3 sm:px-4">',
              '<div className="flex min-h-16 shrink-0 items-center justify-between gap-2 border-b border-white/10 px-3 sm:px-4 pt-[env(safe-area-inset-top,0px)]">',
              1,
          )
          t = t.replace(
              '<div className="relative z-10 pt-12 sm:pt-16 lg:pl-64">',
              '<div className="relative z-10 d4-shell-main-offset lg:pl-64" style={{ paddingTop: "calc(3rem + env(safe-area-inset-top, 0px))" }}>',
              1,
          )
          s.write_text(t)
          print("appshell ok")

          p = Path("src/components/cbt/ExamCameraPip.tsx")
          t = p.read_text()
          old = (
              '        faceEngineRef.current = engine;\n'
              '        setFaceStatus((prev) => (prev === "unavailable" || prev === "unclear" ? "ok" : prev));\n'
              '        lastStateRef.current =\n'
              '          lastStateRef.current === "unavailable" || lastStateRef.current === "unclear"\n'
              '            ? "ok"\n'
              '            : lastStateRef.current;\n'
              '        void tick();'
          )
          new = (
              '        faceEngineRef.current = engine;\n'
              '        setFaceStatus((prev) => (prev === "unavailable" ? "unclear" : prev));\n'
              '        if (lastStateRef.current === "unavailable") lastStateRef.current = "unclear";\n'
              '        void tick();'
          )
          if old in t:
              t = t.replace(old, new, 1)
              print("pip ok")
          else:
              print("pip miss")
          p.write_text(t)
          ENDPY
          git config user.name "fix-bot"
          git config user.email "bot@d4exam.local"
          git add src/styles.css src/components/layout/AppShell.tsx src/components/cbt/ExamCameraPip.tsx
          git status
          git commit -m "fix: safe-area header/drawer, CBT blue immersive, face detect no fake ok" || echo no-change
          git push
