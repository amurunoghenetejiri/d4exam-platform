name: fix-cbt-pip-session
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cbt-pip-session.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re

          p = Path('src/components/cbt/ExamCameraPip.tsx')
          t = p.read_text()
          t = t.replace('const FACE_TICK_MS = 550;', 'const FACE_TICK_MS = 400;')
          t = t.replace('const FACE_TICK_MS = 900;', 'const FACE_TICK_MS = 400;')
          t = t.replace('const ENGINE_TIMEOUT_MS = 8000;', 'const ENGINE_TIMEOUT_MS = 6000;')
          t = t.replace('const ENGINE_TIMEOUT_MS = 4000;', 'const ENGINE_TIMEOUT_MS = 6000;')
          t = t.replace('if (nullStreak >= 3)', 'if (nullStreak >= 2)')

          t2, n = re.subn(
              r'function haptic\(kind: SecurityAlertKind\) \{[\s\S]*?\n\}',
              '''function haptic(kind: SecurityAlertKind) {
  if (kind === "camera_blocked") return;
  if (kind === "none") fireHaptic("none");
  else if (kind === "unclear") fireHaptic("unclear");
  else if (kind === "multi") fireHaptic("multi");
}
''',
              t, count=1)
          print('haptic', n)
          t = t2 if n else t

          if 'fireAlert("unclear"' not in t:
              t = t.replace(
                  'if (next === "none") fireAlert("none", faceCount);\n      else if (next === "multi") fireAlert("multi", faceCount);',
                  'if (next === "none") fireAlert("none", faceCount);\n      else if (next === "unclear") fireAlert("unclear", faceCount);\n      else if (next === "multi") fireAlert("multi", faceCount);',
              )

          t = t.replace('// unclear: label only — no toast/haptic\n      if (next === "unclear" || next === "unavailable") return;\n\n', 'if (next === "unavailable") return;\n\n')

          if 'green monitoring' not in t:
              t = t.replace(
                  '        faceEngineRef.current = engine;\n        void tick();',
                  '''        faceEngineRef.current = engine;
        setFaceStatus((prev) => (prev === "unavailable" || prev === "unclear" ? "ok" : prev));
        lastStateRef.current =
          lastStateRef.current === "unavailable" || lastStateRef.current === "unclear"
            ? "ok"
            : lastStateRef.current;
        void tick();''',
              )
              print('green ok')

          p.write_text(t)
          assert 'FACE_TICK_MS = 400' in t

          s = Path('src/components/cbt/CbtExamSession.impl.tsx')
          st = s.read_text()
          st2, n2 = re.subn(
              r'  useEffect\(\(\) => \{\n    if \(previewMode \|\| !started \|\| done\) return;\n    const onInteract = \(\) => \{ try \{ refreshHapticUnlock\(\); \} catch \{ /\* ignore \*/ \} \};\n    document\.addEventListener\("pointerdown", onInteract, \{ passive: true \}\);\n    document\.addEventListener\("touchstart", onInteract, \{ passive: true \}\);\n    return \(\) => \{\n      document\.removeEventListener\("pointerdown", onInteract\);\n      document\.removeEventListener\("touchstart", onInteract\);\n    \};\n  \}, \[previewMode, started, done\]\);\n\n',
              '', st, count=1)
          print('interact', n2)
          st = st2 if n2 else st
          st = st.replace('                    try { refreshHapticUnlock(); } catch { /* ignore */ }\n', '')
          s.write_text(st)

          # notif + shell
          np = Path('src/components/pages/NotificationsPage.tsx')
          nt = np.read_text()
          if 'officer_warning' not in nt:
              nt = nt.replace('  system_alert: AlertTriangle,\n};', '  system_alert: AlertTriangle,\n  officer_warning: AlertTriangle,\n};')
              nt = nt.replace('  system_alert: "bg-amber-50 text-amber-700",\n};', '  system_alert: "bg-amber-50 text-amber-700",\n  officer_warning: "bg-red-50 text-red-700",\n};')
          if '400,' not in nt:
              nt = nt.replace('Boolean(user?.userId),\n  );', 'Boolean(user?.userId),\n    400,\n  );')
          np.write_text(nt)

          sh = Path('src/components/layout/AppShell.tsx')
          sht = sh.read_text().replace('Boolean(session?.userId),\n    800,', 'Boolean(session?.userId),\n    400,')
          sh.write_text(sht)
          print('all patched')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/cbt/ExamCameraPip.tsx src/components/cbt/CbtExamSession.impl.tsx src/components/pages/NotificationsPage.tsx src/components/layout/AppShell.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m 'fix(cbt): green face PiP + no touch vibrate; live notifications'
            git push
          fi
