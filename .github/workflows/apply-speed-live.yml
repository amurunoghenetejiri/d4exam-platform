name: Apply speed live fix
on:
  push:
    paths:
      - scripts/apply_speed_live.py
      - .github/workflows/apply-speed-live.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_speed_live.py
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          if git diff --staged --quiet; then echo No changes; else git commit -m "fix: parallel session (faster login) + live dashboard counts"; git push; fi
