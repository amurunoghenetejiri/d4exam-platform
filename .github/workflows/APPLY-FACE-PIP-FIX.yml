name: APPLY-FACE-PIP-FIX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/APPLY-FACE-PIP-FIX.yml
      - scripts/ExamCameraPip.full.tsx
      - scripts/patch_cbt_face_log.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply ExamCameraPip full file
        run: |
          set -euo pipefail
          if [ -f scripts/ExamCameraPip.full.tsx ]; then
            cp scripts/ExamCameraPip.full.tsx src/components/cbt/ExamCameraPip.tsx
            echo "ExamCameraPip applied"
          else
            echo "missing ExamCameraPip.full.tsx"
            exit 1
          fi
          if [ -f scripts/CbtExamSession.impl.full.tsx ]; then
            cp scripts/CbtExamSession.impl.full.tsx src/components/cbt/CbtExamSession.impl.tsx
            echo "CbtExamSession applied"
          fi
          python3 scripts/patch_cbt_face_log.py
          grep -q '1 Face Monitoring' src/components/cbt/ExamCameraPip.tsx
          grep -q 'waitVideoReady' src/components/cbt/ExamCameraPip.tsx
          grep -q 'lastLoggedFaceRef' src/components/cbt/CbtExamSession.impl.tsx
          grep -q 'SUBSCRIBED' src/routes/officer.live-monitor.tsx
      - name: Commit app sources only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/cbt/ExamCameraPip.tsx src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(cbt): face detection reliability + event log + officer warn delivery"
            git push
          fi
