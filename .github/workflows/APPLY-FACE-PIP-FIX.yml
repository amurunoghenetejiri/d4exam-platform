name: APPLY-FACE-PIP-FIX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/APPLY-FACE-PIP-FIX.yml
      - scripts/patch_exam_camera_pip.py
      - scripts/patch_cbt_face_log.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch face PIP + logging + officer warn
        run: |
          set -euo pipefail
          python3 scripts/patch_exam_camera_pip.py
          python3 scripts/patch_cbt_face_log.py
          grep -q 'export function ExamCameraPip' src/components/cbt/ExamCameraPip.tsx
      - name: Commit app sources only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/cbt/ExamCameraPip.tsx src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(cbt): face detection reliability + event log + officer warn delivery"
            git push
          fi
