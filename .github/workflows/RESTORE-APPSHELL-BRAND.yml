name: RESTORE-APPSHELL-BRAND
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/RESTORE-APPSHELL-BRAND.yml"
      - "scripts/appshell_b64_*.txt"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode AppShell
        run: |
          python3 << 'PY'
          import base64
          from pathlib import Path
          parts = [Path(f"scripts/appshell_b64_{i}.txt").read_text().strip() for i in range(4)]
          data = base64.b64decode("".join(parts).encode()).decode()
          assert "export function AppShell" in data
          Path("src/components/layout/AppShell.tsx").write_text(data)
          print("restored", len(data))
          PY
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add src/components/layout/AppShell.tsx
          git diff --cached --quiet || (git commit -m "fix: AppShell immediate school branding" && git push origin HEAD:main)
