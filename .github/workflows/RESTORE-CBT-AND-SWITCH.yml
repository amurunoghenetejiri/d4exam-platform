name: RESTORE-CBT-AND-SWITCH
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/RESTORE-CBT-AND-SWITCH.yml
      - scripts/write_cbt_restored.py
      - scripts/cbt_restored_b64_0.txt
      - scripts/cbt_restored_b64_1.txt
      - scripts/cbt_restored_b64_2.txt
      - src/lib/account-switcher.ts
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore full CBT exam page
        run: |
          set -euo pipefail
          python3 scripts/write_cbt_restored.py
          grep -q 'export function CbtExamPage' src/components/cbt/CbtExamSession.impl.tsx
          grep -q 'startScreenShareStream' src/components/cbt/CbtExamSession.impl.tsx
          ! grep -q 'Full exam UI is being restored' src/components/cbt/CbtExamSession.impl.tsx
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/cbt/CbtExamSession.impl.tsx
          if git diff --cached --quiet; then echo No CBT changes; else
            git commit -m "fix(cbt): restore full exam session UI + screen share publish"
            git push
          fi
