name: Apply notification system improvements
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/run-notif-clean.yml"
      - "scripts/apply_notif_clean.py"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python3 scripts/apply_notif_clean.py
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add src/components/pages/NotificationsPage.tsx src/lib/notify.ts src/components/cbt/CbtExamSession.impl.tsx
          git diff --cached --stat || true
          git commit -m "feat(notify): role-based messages, delete-all, CBT submit/terminate push" || echo no-changes
          git pull --rebase origin main || true
          git push origin main
