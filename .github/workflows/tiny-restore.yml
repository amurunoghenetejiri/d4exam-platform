name: Restore emptied teacher routes
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tiny-restore.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Restore from good commit and fix pause UI
        run: |
          set -e
          git show bdea511:src/routes/teacher.examinations.tsx > src/routes/teacher.examinations.tsx
          git show bdea511:src/routes/teacher.exam-security.tsx > src/routes/teacher.exam-security.tsx
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("src/routes/teacher.examinations.tsx")
          t = p.read_text()
          new = '''{security.thresholdAction === "pause" && (
                <div className="space-y-2 rounded-xl border border-slate-200 px-4 py-3">
                  <Label className="font-semibold">Pause duration</Label>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <p className="text-xs font-medium text-slate-500">Minutes</p>
                      <Input
                        type="number"
                        min={0}
                        max={60}
                        value={Math.floor((security.pauseDurationSeconds ?? 300) / 60)}
                        onChange={(e) => {
                          const mins = Math.max(0, Math.min(60, Number(e.target.value) || 0));
                          const secs = (security.pauseDurationSeconds ?? 300) % 60;
                          toggleSec("pauseDurationSeconds", Math.max(30, mins * 60 + secs));
                        }}
                      />
                    </div>
                    <div className="space-y-1">
                      <p className="text-xs font-medium text-slate-500">Seconds</p>
                      <Input
                        type="number"
                        min={0}
                        max={59}
                        step={5}
                        value={(security.pauseDurationSeconds ?? 300) % 60}
                        onChange={(e) => {
                          const secs = Math.max(0, Math.min(59, Number(e.target.value) || 0));
                          const mins = Math.floor((security.pauseDurationSeconds ?? 300) / 60);
                          toggleSec("pauseDurationSeconds", Math.max(30, mins * 60 + secs));
                        }}
                      />
                    </div>
                  </div>
                  <p className="text-xs text-slate-500">
                    Student must wait{" "}
                    <strong>
                      {Math.floor((security.pauseDurationSeconds ?? 300) / 60)} min{" "}
                      {(security.pauseDurationSeconds ?? 300) % 60} sec
                    </strong>{" "}
                    before continuing (minimum 30 seconds). Set any time, e.g. 2 min 30 sec.
                  </p>
                </div>
              )}'''
          pat2 = re.compile(
              r'\{security\.thresholdAction === "pause" && \([\s\S]*?Exact time the student must wait[\s\S]*?\n\s*\)\}',
              re.M,
          )
          pat = re.compile(
              r'\{security\.thresholdAction === "pause" && \([\s\S]*?\n\s*\)\}',
              re.M,
          )
          if pat2.search(t):
              t = pat2.sub(new, t, count=1)
              print("fixed via pat2")
          elif pat.search(t):
              t = pat.sub(new, t, count=1)
              print("fixed via pat")
          else:
              print("no pause match - writing as restored")
          t = t.replace("Exact time the student must wait (e.g. 300 = 5 minutes).", "")
          p.write_text(t)
          assert "createFileRoute" in t
          assert "Minutes" in t
          print("examinations ok", len(t))
          sp = Path("src/routes/teacher.exam-security.tsx")
          st = sp.read_text()
          if "Set any time, e.g. 2 min 30 sec" not in st:
              st = st.replace(
                  "before continuing (minimum 30 seconds).",
                  "before continuing (minimum 30 seconds). Set any time, e.g. 2 min 30 sec.",
              )
              sp.write_text(st)
          print("security ok", len(st))
          PY
      - name: Commit and push
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add src/routes/teacher.examinations.tsx src/routes/teacher.exam-security.tsx
          git status
          git commit -m "fix: restore teacher routes; pause duration Minutes + Seconds (no 300)" || echo no-changes
          git pull --rebase origin main || true
          git push origin main
