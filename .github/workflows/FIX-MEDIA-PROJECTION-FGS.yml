name: FIX-MEDIA-PROJECTION-FGS
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden ScreenCaptureService + ScreenSharePlugin + build workflow
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          SERVICE = r'''package com.d4exam.app;

import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.Service;
import android.content.Intent;
import android.content.pm.ServiceInfo;
import android.graphics.Bitmap;
import android.graphics.BitmapFactory;
import android.os.Build;
import android.os.IBinder;
import android.util.Log;
import androidx.core.app.NotificationCompat;
import java.util.concurrent.CountDownLatch;
import java.util.concurrent.atomic.AtomicBoolean;

/**
 * Foreground service required while MediaProjection is active (Android 10+ / API 34+).
 * Must reach startForeground with FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
 * BEFORE MediaProjectionManager.getMediaProjection is called.
 */
public class ScreenCaptureService extends Service {
  private static final String TAG = "D4ScreenCaptureSvc";
  private static final String CHANNEL_ID = "d4exam_screen_share";
  private static final int NOTIF_ID = 4402;
  private static final int NOTIF_COLOR = 0xFF0B1B3A;

  public static final AtomicBoolean FOREGROUND_READY = new AtomicBoolean(false);
  public static volatile CountDownLatch READY_LATCH = new CountDownLatch(1);

  public static void resetReady() {
    FOREGROUND_READY.set(false);
    READY_LATCH = new CountDownLatch(1);
  }

  @Override
  public void onCreate() {
    super.onCreate();
    promoteToForeground();
  }

  private void promoteToForeground() {
    createChannel();

    int smallIcon = android.R.drawable.ic_menu_camera;
    try {
      int resId = getResources().getIdentifier("ic_stat_d4exam", "drawable", getPackageName());
      if (resId != 0) smallIcon = resId;
    } catch (Exception ignored) {
    }

    NotificationCompat.Builder builder =
        new NotificationCompat.Builder(this, CHANNEL_ID)
            .setContentTitle("D4EXAM exam monitoring")
            .setContentText("Screen sharing stays on until you submit the exam.")
            .setSmallIcon(smallIcon)
            .setColor(NOTIF_COLOR)
            .setOngoing(true)
            .setOnlyAlertOnce(true)
            .setPriority(NotificationCompat.PRIORITY_DEFAULT)
            .setCategory(NotificationCompat.CATEGORY_SERVICE)
            .setSilent(true)
            .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
            .setForegroundServiceBehavior(NotificationCompat.FOREGROUND_SERVICE_IMMEDIATE);

    try {
      Bitmap large = BitmapFactory.decodeResource(getResources(), R.mipmap.ic_launcher);
      if (large != null) builder.setLargeIcon(large);
    } catch (Exception e) {
      Log.w(TAG, "largeIcon load failed", e);
    }

    Notification notification = builder.build();
    boolean ok = false;

    // MUST use MEDIA_PROJECTION type on API 29+ — untyped FGS will make getMediaProjection throw.
    try {
      if (Build.VERSION.SDK_INT >= 34) {
        startForeground(
            NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
        ok = true;
      } else if (Build.VERSION.SDK_INT >= 29) {
        startForeground(
            NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
        ok = true;
      } else {
        startForeground(NOTIF_ID, notification);
        ok = true;
      }
    } catch (Exception e) {
      Log.e(TAG, "startForeground MEDIA_PROJECTION failed", e);
      try {
        Notification fallback =
            new NotificationCompat.Builder(this, CHANNEL_ID)
                .setContentTitle("D4EXAM")
                .setContentText("Screen monitoring active")
                .setSmallIcon(android.R.drawable.ic_menu_camera)
                .setOngoing(true)
                .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                .setForegroundServiceBehavior(NotificationCompat.FOREGROUND_SERVICE_IMMEDIATE)
                .build();
        if (Build.VERSION.SDK_INT >= 29) {
          startForeground(
              NOTIF_ID, fallback, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
        } else {
          startForeground(NOTIF_ID, fallback);
        }
        ok = true;
      } catch (Exception e2) {
        Log.e(TAG, "startForeground typed fallback failed", e2);
        ok = false;
      }
    }

    FOREGROUND_READY.set(ok);
    Log.i(TAG, "FOREGROUND_READY=" + ok + " api=" + Build.VERSION.SDK_INT);
    try {
      READY_LATCH.countDown();
    } catch (Exception ignored) {
    }
  }

  private void createChannel() {
    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
      NotificationChannel channel =
          new NotificationChannel(
              CHANNEL_ID, "Exam screen monitoring", NotificationManager.IMPORTANCE_DEFAULT);
      channel.setDescription("Shown while screen share is active during an examination");
      channel.setShowBadge(false);
      channel.setSound(null, null);
      NotificationManager nm = getSystemService(NotificationManager.class);
      if (nm != null) nm.createNotificationChannel(channel);
    }
  }

  @Override
  public int onStartCommand(Intent intent, int flags, int startId) {
    if (!FOREGROUND_READY.get()) {
      promoteToForeground();
    }
    return START_STICKY;
  }

  @Override
  public IBinder onBind(Intent intent) {
    return null;
  }

  @Override
  public void onDestroy() {
    FOREGROUND_READY.set(false);
    Log.i(TAG, "onDestroy");
    super.onDestroy();
  }
}
'''

          for path in [
              "native-android/app/src/main/java/com/d4exam/app/ScreenCaptureService.java",
              "android/app/src/main/java/com/d4exam/app/ScreenCaptureService.java",
          ]:
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(SERVICE)
              print("wrote", path)

          def harden_plugin(path: str) -> None:
              p = Path(path)
              if not p.exists():
                  print("skip missing", path)
                  return
              t = p.read_text()

              # Replace soft-proceed / hard-reject block with gate that blocks getMediaProjection
              # until typed FGS is ready.
              old_soft = '''      if (!ScreenCaptureService.FOREGROUND_READY.get()) {
        Log.w(TAG, "FGS not ready after await — proceeding anyway (check notification permission)");
      }'''
              old_soft2 = '''      if (!ready || !ScreenCaptureService.FOREGROUND_READY.get()) {
        Log.w(TAG, "FGS not ready in time — proceeding anyway");
      }'''
              old_hard = '''      if (!ScreenCaptureService.FOREGROUND_READY.get()) {
        call.reject(
            "Could not start screen monitoring service. Allow notifications for D4EXAM and try again.");
        return;
      }'''

              gate = '''      if (!ScreenCaptureService.FOREGROUND_READY.get()) {
        Log.w(TAG, "FGS not ready — third startForegroundService attempt");
        try {
          ScreenCaptureService.resetReady();
          Intent svc3 = new Intent(getContext(), ScreenCaptureService.class);
          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            getContext().startForegroundService(svc3);
          } else {
            getContext().startService(svc3);
          }
          ScreenCaptureService.READY_LATCH.await(6, TimeUnit.SECONDS);
        } catch (Exception retry3) {
          Log.e(TAG, "FGS third attempt failed", retry3);
        }
      }
      if (!ScreenCaptureService.FOREGROUND_READY.get()) {
        call.reject(
            "Could not start screen monitoring service. Allow notifications for D4EXAM in system settings, then try again.");
        return;
      }
      // Brief settle so the system registers MEDIA_PROJECTION FGS before getMediaProjection
      try {
        Thread.sleep(250);
      } catch (InterruptedException ie) {
        Thread.currentThread().interrupt();
      }'''

              replaced = False
              for old in (old_soft, old_soft2, old_hard):
                  if old in t:
                      t = t.replace(old, gate, 1)
                      replaced = True
                      break

              if not replaced and "third startForegroundService attempt" not in t:
                  # Insert gate just before getMediaProjection call
                  needle = "MediaProjection mp ="
                  idx = t.find(needle)
                  if idx < 0:
                      needle = "projectionManager.getMediaProjection"
                      idx = t.find(needle)
                  if idx > 0:
                      # find start of line
                      line_start = t.rfind("\n", 0, idx) + 1
                      t = t[:line_start] + gate + "\n" + t[line_start:]
                      replaced = True

              if "third startForegroundService attempt" not in t and not replaced:
                  raise SystemExit(f"Could not insert FGS gate into {path}")

              # Ensure notification request block exists before resetReady
              if "POST_NOTIFICATIONS" not in t or "requestPermissions" not in t:
                  if "import android.Manifest;" not in t:
                      t = t.replace(
                          "import android.app.Activity;",
                          "import android.Manifest;\nimport android.app.Activity;",
                      )
                  if "import android.content.pm.PackageManager;" not in t:
                      t = t.replace(
                          "import android.content.Context;",
                          "import android.content.Context;\nimport android.content.pm.PackageManager;",
                      )
                  if "import androidx.core.app.ActivityCompat;" not in t:
                      t = t.replace(
                          "import androidx.activity.result.ActivityResult;",
                          "import androidx.activity.result.ActivityResult;\n"
                          "import androidx.core.app.ActivityCompat;\n"
                          "import androidx.core.content.ContextCompat;",
                      )
                  marker = "ScreenCaptureService.resetReady();"
                  notif = (
                      "// Android 13+: notification permission required for FGS notification\n"
                      "      try {\n"
                      "        if (Build.VERSION.SDK_INT >= 33) {\n"
                      "          Activity act = getActivity();\n"
                      "          if (act != null\n"
                      "              && ContextCompat.checkSelfPermission(act, Manifest.permission.POST_NOTIFICATIONS)\n"
                      "                  != PackageManager.PERMISSION_GRANTED) {\n"
                      "            ActivityCompat.requestPermissions(\n"
                      "                act, new String[] {Manifest.permission.POST_NOTIFICATIONS}, 4403);\n"
                      "            try { Thread.sleep(900); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n"
                      "          }\n"
                      "        }\n"
                      "      } catch (Exception permEx) {\n"
                      "        Log.w(TAG, \"notification permission request skipped\", permEx);\n"
                      "      }\n"
                      "      ScreenCaptureService.resetReady();"
                  )
                  if marker in t:
                      t = t.replace(marker, notif, 1)

              assert "Could not start screen monitoring service" in t or "third startForegroundService" in t
              assert "getMediaProjection" in t
              p.write_text(t)
              print("hardened plugin", path, len(t))

          harden_plugin("native-android/app/src/main/java/com/d4exam/app/ScreenSharePlugin.java")
          harden_plugin("android/app/src/main/java/com/d4exam/app/ScreenSharePlugin.java")

          # Ensure build-android.yml re-applies ScreenCaptureService AFTER cap sync
          bw = Path(".github/workflows/build-android.yml")
          bt = bw.read_text()
          marker = "      - name: Build debug APK"
          inject = '''      - name: Re-apply ScreenCaptureService after cap sync
        run: |
          set -euo pipefail
          MAN="android/app/src/main/AndroidManifest.xml"
          test -f "$MAN"
          if ! grep -q 'ScreenCaptureService' "$MAN"; then
            sed -i 's|</application>|        <service android:name=".ScreenCaptureService" android:exported="false" android:foregroundServiceType="mediaProjection" />\n    </application>|' "$MAN"
            echo "ScreenCaptureService re-added after cap sync"
          fi
          if ! grep -q 'FOREGROUND_SERVICE_MEDIA_PROJECTION' "$MAN"; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />\n</manifest>|' "$MAN" || true
          fi
          if ! grep -q 'POST_NOTIFICATIONS' "$MAN"; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>|' "$MAN" || true
          fi
          grep -q 'ScreenCaptureService' "$MAN"
          grep -q 'FOREGROUND_SERVICE_MEDIA_PROJECTION' "$MAN"
          grep -q 'mediaProjection' "$MAN"
          echo "OK: mediaProjection FGS declared in final manifest"
          grep -n 'ScreenCaptureService\\|mediaProjection\\|FOREGROUND_SERVICE' "$MAN" || true

'''
          if "Re-apply ScreenCaptureService after cap sync" not in bt:
              if marker not in bt:
                  raise SystemExit("build-android marker missing")
              bt = bt.replace(marker, inject + marker, 1)
              bw.write_text(bt)
              print("patched build-android.yml")
          else:
              print("build-android already has re-apply step")

          print("ALL DONE")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-android/app/src/main/java/com/d4exam/app/ScreenCaptureService.java \
                  native-android/app/src/main/java/com/d4exam/app/ScreenSharePlugin.java \
                  android/app/src/main/java/com/d4exam/app/ScreenCaptureService.java \
                  android/app/src/main/java/com/d4exam/app/ScreenSharePlugin.java \
                  .github/workflows/build-android.yml
          git commit -m "fix(android): require typed mediaProjection FGS before getMediaProjection" || echo "no changes"
          git push origin HEAD:main
