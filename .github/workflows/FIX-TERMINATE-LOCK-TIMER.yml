name: FIX-TERMINATE-LOCK-TIMER
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/FIX-TERMINATE-LOCK-TIMER.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply full exam fixes v2
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path

          p = Path("src/components/cbt/CbtExamSession.impl.tsx")
          t = p.read_text()
          assert len(t) > 40000, f"Cbt too small: {len(t)}"

          if "doneForceSubmit" not in t:
              t = t.replace(
                  "const [doneTerminated, setDoneTerminated] = useState(false);",
                  "const [doneTerminated, setDoneTerminated] = useState(false);\n  const [doneForceSubmit, setDoneForceSubmit] = useState(false);",
              )
              print("doneForceSubmit")

          if "answersRef" not in t:
              t = t.replace(
                  'const [answers, setAnswers] = useState<Record<string, number>>({});',
                  'const [answers, setAnswers] = useState<Record<string, number>>({});\n  const answersRef = useRef<Record<string, number>>({});\n  answersRef.current = answers;',
              )
              print("answersRef")

          if "lockedAnswerIds" not in t:
              t = t.replace(
                  'const resumeIndexRef = useRef<number | null>(null);',
                  'const resumeIndexRef = useRef<number | null>(null);\n  /** Lock answers only after leave+continue (not while continuously writing). */\n  const [lockedAnswerIds, setLockedAnswerIds] = useState<Set<string>>(() => new Set());',
              )
              print("lockedAnswerIds state")

          if "setLockedAnswerIds(lockedIds)" not in t:
              old = "            const prev = existingFull.answers as Record<string, number>;\n            setAnswers(prev);"
              new = "            const prev = existingFull.answers as Record<string, number>;\n            setAnswers(prev);\n            const lockedIds = new Set(Object.keys(prev).filter((k) => prev[k] !== undefined && prev[k] !== null));\n            setLockedAnswerIds(lockedIds);"
              if old in t:
                  t = t.replace(old, new)
                  print("locked on resume")

          # Unlock while writing: use lockedAnswerIds only
          t = t.replace("if (!q || answers[q.id] != null) return;", "if (!q || lockedAnswerIds.has(q.id)) return;")
          t = t.replace("const locked = q ? answers[q.id] != null : false", "const locked = q ? lockedAnswerIds.has(q.id) : false")

          needle = 'selected ? "border-primary bg-primary/5 ring-2 ring-primary/20" : "border-slate-200 hover:border-primary/40"'
          repl = 'locked ? "border-slate-200 bg-slate-50 opacity-50 cursor-not-allowed line-through" : selected ? "border-primary bg-primary/5 ring-2 ring-primary/20" : "border-slate-200 hover:border-primary/40"'
          if needle in t and "opacity-50 cursor-not-allowed" not in t:
              t = t.replace(needle, repl)
              print("grey styles")

          # Timer restore from ends_at OR started_at+duration
          old_restore = '''        // Restore absolute end clock from attempt (do not reset timer on Continue)
        try {
          const ea = (existingFull as { ends_at?: string | null }).ends_at;
          if (ea) {
            const ends = new Date(String(ea)).getTime();
            if (!Number.isNaN(ends) && ends > Date.now()) {
              endsAtRef.current = ends;
              setSeconds(Math.max(0, Math.ceil((ends - Date.now()) / 1000)));
            }
          }
        } catch { /* ignore */ }'''
          new_restore = '''        // Restore absolute end clock from attempt (do not reset timer on Continue)
        try {
          const ea = (existingFull as { ends_at?: string | null } | null)?.ends_at;
          const sa = (existingFull as { started_at?: string | null } | null)?.started_at;
          let endsMs: number | null = null;
          if (ea) {
            const ends = new Date(String(ea)).getTime();
            if (!Number.isNaN(ends)) endsMs = ends;
          }
          if (endsMs == null && sa) {
            const startMs = new Date(String(sa)).getTime();
            const mins = Math.max(1, Number(examQ.data?.duration_minutes ?? 60));
            if (!Number.isNaN(startMs)) endsMs = startMs + mins * 60_000;
          }
          if (endsMs != null) {
            endsAtRef.current = endsMs;
            setSeconds(Math.max(0, Math.ceil((endsMs - Date.now()) / 1000)));
            if (!ea && attemptIdRef.current) {
              void supabase.from("exam_attempts").update({
                ends_at: new Date(endsMs).toISOString(),
              } as never).eq("id", attemptIdRef.current);
            }
          }
        } catch { /* ignore */ }'''
          if old_restore in t:
              t = t.replace(old_restore, new_restore)
              print("timer restore")

          t = t.replace(
              "if (endsAtRef.current != null && endsAtRef.current > now)",
              "if (endsAtRef.current != null)",
          )

          # visibility recalculate on timer
          if "Absolute end clock" in t and "visibilitychange" not in t[t.find("Absolute end clock"):t.find("Absolute end clock")+550]:
              old_ret = "    const t = window.setInterval(tick, 1000);\n    return () => window.clearInterval(t);\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [started, done]);"
              new_ret = "    const t = window.setInterval(tick, 1000);\n    const onVis = () => { if (document.visibilityState === \"visible\") tick(); };\n    document.addEventListener(\"visibilitychange\", onVis);\n    window.addEventListener(\"focus\", onVis);\n    return () => { window.clearInterval(t); document.removeEventListener(\"visibilitychange\", onVis); window.removeEventListener(\"focus\", onVis); };\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [started, done]);"
              if old_ret in t:
                  t = t.replace(old_ret, new_ret, 1)
                  print("timer visibility")

          t = t.replace(", 1200)", ", 300)")
          t = t.replace(", 400)", ", 300)")
          if "answersRef" in t:
              t = t.replace("        answers,\n        ends_at:", "        answers: answersRef.current,\n        ends_at:")

          old_term = '''      } else if (cmd === "terminate") {
        setDoneTerminated(true);
        setPaused(false);
        try { haptic("officer_submit"); } catch { /* ignore */ }
        void finishAttempt(true);
      } else if (cmd === "submit") {
        setDoneTerminated(false);
        setPaused(false);
        try { haptic("officer_submit"); } catch { /* ignore */ }
        void finishAttempt(false);
      }'''
          new_term = '''      } else if (cmd === "terminate") {
        setDoneTerminated(true);
        setDoneForceSubmit(false);
        setPaused(false);
        try { haptic("officer_submit"); } catch { /* ignore */ }
        void finishAttempt(true);
      } else if (cmd === "submit") {
        setDoneTerminated(false);
        setDoneForceSubmit(true);
        setPaused(false);
        try { haptic("officer_submit"); } catch { /* ignore */ }
        void finishAttempt(false);
      }'''
          if old_term in t:
              t = t.replace(old_term, new_term)
              print("officer flags")

          t = t.replace(
              '''        if (st === "submitted" || st === "flagged") {
          setDoneTerminated(false);
          void finishAttempt(false);''',
              '''        if (st === "submitted" || st === "flagged") {
          setDoneTerminated(false);
          if (meta.officer_force_submit) setDoneForceSubmit(true);
          void finishAttempt(false);''',
          )
          t = t.replace("void poll(), 4000)", "void poll(), 1500)")
          t = t.replace("setInterval(() => void poll(), 4000)", "setInterval(() => void poll(), 1500)")

          old_finish = '''        const schoolId = String(examQ.data.school_id ?? student.schoolId ?? "");
        const saved = await saveCbtResult({
          examId: id, studentId: student.studentId, schoolId, attemptId,
          questions: questions.map((qq) => ({
            id: qq.id, marks: qq.marks ?? 1, correct_answer: qq.correct_answer,
            options: qq.options ?? [],
            originalOptions: (qq as { originalOptions?: string[] }).originalOptions ?? [],
            correctOptionText: (qq as { correctOptionText?: string | null }).correctOptionText ?? null,
          })),
          answers, terminated: auto, resultVisibility: security.resultVisibility,
        });
        if (saved.error) toast.error(saved.error.message);
        else {
          let rid = saved.resultId ?? null;
          if (!rid) {
            const { data: res } = await supabase.from("results").select("id").eq("exam_id", id).eq("student_id", student.studentId).maybeSingle();
            rid = (res?.id as string) ?? null;
          }
          if (rid) { setResultId(rid); resultIdRef.current = rid; }
          toast.success(saved.published ? "Examination submitted — result is available now" : "Examination submitted successfully");
        }'''
          new_finish = '''        const schoolId = String(examQ.data.school_id ?? student.schoolId ?? "");
        if (doneTerminated) {
          await supabase.from("exam_attempts").update({
            status: "terminated",
            answers: answersRef.current,
            submitted_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
            ends_at: endsAtRef.current ? new Date(endsAtRef.current).toISOString() : undefined,
          } as never).eq("id", attemptId);
          toast.message("Examination terminated by officer — no result recorded");
        } else {
          const saved = await saveCbtResult({
            examId: id, studentId: student.studentId, schoolId, attemptId,
            questions: questions.map((qq) => ({
              id: qq.id, marks: qq.marks ?? 1, correct_answer: qq.correct_answer,
              options: qq.options ?? [],
              originalOptions: (qq as { originalOptions?: string[] }).originalOptions ?? [],
              correctOptionText: (qq as { correctOptionText?: string | null }).correctOptionText ?? null,
            })),
            answers: answersRef.current, terminated: false, resultVisibility: security.resultVisibility,
          });
          if (saved.error) toast.error(saved.error.message);
          else {
            let rid = saved.resultId ?? null;
            if (!rid) {
              const { data: res } = await supabase.from("results").select("id").eq("exam_id", id).eq("student_id", student.studentId).maybeSingle();
              rid = (res?.id as string) ?? null;
            }
            if (rid) { setResultId(rid); resultIdRef.current = rid; }
            if (doneForceSubmit) toast.success("Examination auto-submitted by the examination officer");
            else toast.success(saved.published ? "Examination submitted — result is available now" : "Examination submitted successfully");
          }
        }'''
          if old_finish in t:
              t = t.replace(old_finish, new_finish)
              print("finishAttempt terminate no-result")

          t = t.replace(
              "Your examination has been terminated by the examination officer. This examination can no longer be continued.",
              "Your examination has been terminated by the examination officer for an examination violation. No result was recorded for this attempt.",
          )
          if "doneForceSubmit" in t and "auto-submitted by the examination officer for examination validation" not in t:
              t = t.replace(
                  '"Your examination has been terminated by the examination officer for an examination violation. No result was recorded for this attempt."\n                : "Your examination has been submitted. Your examination is no longer active."',
                  '"Your examination has been terminated by the examination officer for an examination violation. No result was recorded for this attempt."\n                : doneForceSubmit\n                  ? "Your examination has been auto-submitted by the examination officer for examination validation. Your answers have been saved."\n                  : "Your examination has been submitted. Your examination is no longer active."',
              )
              print("done messages")

          t = t.replace("{resultId && (", "{resultId && !doneTerminated && (")

          p.write_text(t)
          print("Cbt", len(t))

          # Officer terminate harden
          op = Path("src/routes/officer.live-monitor.tsx")
          ot = op.read_text()
          if len(ot) > 20000:
              old_t = '''      } else if (cmd === "terminate") {
        const { error } = await supabase.from("exam_attempts").update({ status: "terminated", terminated_at: nowIso, submitted_at: nowIso, security_review_status: "terminated", updated_at: nowIso } as never).eq("id", attemptId).eq("school_id", schoolId);
        if (error) throw error;
        await logSecurityEvent({ schoolId, examId, attemptId, studentId, eventType: "OFFICER_TERMINATE", severity: "high", description: "Examination terminated by officer", extra: { source: "officer_live_monitor", officer_user_id: user?.userId ?? null } });
        await broadcastOfficerCommand("terminate", attemptId, studentId, examId);
        toast.success(`Terminated ${selected.name}`);
        setSelectedId(null);'''
              new_t = '''      } else if (cmd === "terminate") {
        let { error } = await supabase.from("exam_attempts").update({ status: "terminated", terminated_at: nowIso, submitted_at: nowIso, security_review_status: "terminated", updated_at: nowIso, metadata: { ...(selected.a.metadata || {}), officer_terminated: true, officer_terminated_at: nowIso } } as never).eq("id", attemptId).eq("school_id", schoolId);
        if (error) {
          const r2 = await supabase.from("exam_attempts").update({ status: "terminated", updated_at: nowIso, metadata: { ...(selected.a.metadata || {}), officer_terminated: true, officer_terminated_at: nowIso } } as never).eq("id", attemptId);
          error = r2.error;
          if (error) throw error;
        }
        await logSecurityEvent({ schoolId, examId, attemptId, studentId, eventType: "OFFICER_TERMINATE", severity: "high", description: "Examination terminated by officer for examination violation", extra: { source: "officer_live_monitor", officer_user_id: user?.userId ?? null } });
        await broadcastOfficerCommand("terminate", attemptId, studentId, examId);
        window.setTimeout(() => { void broadcastOfficerCommand("terminate", attemptId, studentId, examId); }, 500);
        window.setTimeout(() => { void broadcastOfficerCommand("terminate", attemptId, studentId, examId); }, 1500);
        toast.success(`Terminated ${selected.name}`);
        setSelectedId(null);'''
              if old_t in ot:
                  ot = ot.replace(old_t, new_t)
                  print("officer terminate")
              op.write_text(ot)

          # saveCbtResult skip result when terminated
          sp = Path("src/lib/cbt-save-result.ts")
          st = sp.read_text()
          needle = "  const scored = scoreObjectiveAnswers(questionsForScore, input.answers);"
          if needle in st and "if (input.terminated)" not in st:
              insert = '''  if (input.terminated) {
    if (input.attemptId) {
      await supabase.from("exam_attempts").update({
        status: "terminated",
        answers: input.answers,
        submitted_at: new Date().toISOString(),
        updated_at: new Date().toISOString(),
      } as never).eq("id", input.attemptId);
    }
    return {
      scored: { totalScore: 0, maxMarks: 0, percentage: 0, grade: "—", passFail: "—", correct: 0, wrong: 0, unanswered: 0 },
      error: null,
      resultId: undefined,
      status: "terminated",
      published: false,
    };
  }

  const scored = scoreObjectiveAnswers(questionsForScore, input.answers);'''
              st = st.replace(needle, insert)
              sp.write_text(st)
              print("saveCbtResult terminated guard")

          print("DONE v2")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx src/lib/cbt-save-result.ts
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "fix(cbt+officer): terminate no-result + violation msg; lock only on resume; absolute timer; force-submit msg; fast poll"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
