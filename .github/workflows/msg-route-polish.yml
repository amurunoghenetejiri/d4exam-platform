name: msg-route-polish
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/msg-route-polish.yml
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student + officer routes
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          def patch_student(p: Path):
              t = p.read_text()
              t = t.replace(
                  'const [replyTo, setReplyTo] = useState<{ id: string; text: string } | null>(null);',
                  'const [replyTo, setReplyTo] = useState<{ id: string; text: string; fromSelf?: boolean } | null>(null);',
              )
              t = t.replace(
                  '<Mic className="h-7 w-7 stroke-[2.5]" />',
                  '<Mic className="h-5 w-5 stroke-[2.5]" />',
              )
              # setReplyTo with fromSelf on swipe
              if 'fromSelf: m.side' not in t:
                  t = t.replace(
                      'setReplyTo({\n                      id: m.reportId,\n                      text: (m.text && m.text !== "(attachment)" ? m.text : m.attachment_type || "Attachment").slice(0, 120),\n                    });',
                      'setReplyTo({\n                      id: m.reportId,\n                      text: (m.text && m.text !== "(attachment)" ? m.text : attachmentLabel(m.attachment_type, m.attachment_url)).slice(0, 120),\n                      fromSelf: m.side === "out",\n                    });',
                  )
                  # alternate formatting
                  t = re.sub(
                      r'setReplyTo\(\{\s*id: m\.reportId,\s*text: \(m\.text && m\.text !== "\(attachment\)" \? m\.text : m\.attachment_type \|\| "Attachment"\)\.slice\(0, 120\),\s*\}\);',
                      'setReplyTo({\n                      id: m.reportId,\n                      text: (m.text && m.text !== "(attachment)" ? m.text : attachmentLabel(m.attachment_type, m.attachment_url)).slice(0, 120),\n                      fromSelf: m.side === "out",\n                    });',
                      t,
                      count=1,
                  )
              # reply preview header
              if 'replyTo.fromSelf' not in t:
                  # common patterns for reply bar title
                  t = t.replace(
                      '{officerNickname}</p>',
                      '{replyTo?.fromSelf ? "You" : officerNickname}</p>',
                      1,
                  )
                  # more specific if reply bar exists
                  t = re.sub(
                      r'(replyTo \?[\s\S]{0,400}?<p className="text-\[11px\] font-bold text-blue-800">)\{?officerNickname\}?\s*</p>',
                      r'\1{replyTo.fromSelf ? "You" : officerNickname}</p>',
                      t,
                      count=1,
                  )
              p.write_text(t)
              print('student patched', 'fromSelf' in t, 'h-5 w-5 stroke' in t)

          def patch_officer(p: Path):
              if not p.exists():
                  return
              t = p.read_text()
              t = t.replace(
                  '<Mic className="h-7 w-7 stroke-[2.5]" />',
                  '<Mic className="h-5 w-5 stroke-[2.5]" />',
              )
              p.write_text(t)
              print('officer patched')

          patch_student(Path('src/routes/student.contact-officer.tsx'))
          patch_officer(Path('src/routes/officer.reports.tsx'))
          PY
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          git diff --cached --quiet || git commit -m "fix(messaging): smaller mic + reply You label"
          git push
