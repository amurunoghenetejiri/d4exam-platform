name: ENSURE-RETAIN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ENSURE-RETAIN.yml
      - scripts/ensure_build_android_retain.py
      - DEPLOY_TRIGGER.txt
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ensure_build_android_retain.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-android.yml
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(ci): stopWithTask + alwaysRetainTaskState for MediaProjection"
            git push
          fi
