name: APPLY-MAP-TRIAL-COMPLETE
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/APPLY-MAP-TRIAL-COMPLETE.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write files
        run: |
          python3 << 'ENDPY'
          import base64, gzip, pathlib
          files = {
            "src/routes/school-application.tsx": open("/home/workdir/artifacts/APPLY-MAP-TRIAL-COMPLETE.yml").read() and None,
          }
          ENDPY
