name: Restore pages safe
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-pages-safe.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and harden pages
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-platform/33ff16792de8c1f87d2039bfbcf8f4eb9feef164/src/routes/officer.live-monitor.tsx" -o src/routes/officer.live-monitor.tsx
          curl -fsSL "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-platform/33ff16792de8c1f87d2039bfbcf8f4eb9feef164/src/components/officer/OfficerResultsPage.tsx" -o src/components/officer/OfficerResultsPage.tsx
          python3 <<'PY'
          from pathlib import Path
          # Harden live-monitor exams query
          p = Path("src/routes/officer.live-monitor.tsx")
          t = p.read_text()
          assert "PLACEHOLDER" not in t and len(t) > 10000
          t = t.replace(
          """      if (error) throw error;\n      return data ?? [];\n    },\n  });\n\n  const attemptsQ = useQuery({""",
          """      if (error) {\n        console.warn(\"[live-monitor] exams query\", error);\n        return [];\n      }\n      return data ?? [];\n    },\n  });\n\n  const attemptsQ = useQuery({""",
          )
          t = t.replace(
          """      if (lastError) throw lastError;\n      return [];""",
          """      if (lastError) console.warn(\"[live-monitor] attempts query\", lastError);\n      return [];""",
          )
          p.write_text(t)
          # Harden OfficerResultsPage query throws
          p2 = Path("src/components/officer/OfficerResultsPage.tsx")
          t2 = p2.read_text()
          assert len(t2) > 5000
          t2 = t2.replace(
          """      if (error) throw error;\n      return (data ?? []) as ExamRow[];""",
          """      if (error) {\n        console.warn(\"[officer-results] exams\", error);\n        return [] as ExamRow[];\n      }\n      return (data ?? []) as ExamRow[];""",
          )
          t2 = t2.replace(
          """      if (error) throw error;\n      const map: Record<string, { total: number; finished: number }> = {};""",
          """      if (error) {\n        console.warn(\"[officer-results] attempts\", error);\n        return {} as Record<string, { total: number; finished: number }>;\n      }\n      const map: Record<string, { total: number; finished: number }> = {};""",
          )
          t2 = t2.replace(
          """      if (error) throw error;\n      const map: Record<string, { total: number; held: number; published: number }> = {};""",
          """      if (error) {\n        console.warn(\"[officer-results] counts\", error);\n        return {} as Record<string, { total: number; held: number; published: number }>;\n      }\n      const map: Record<string, { total: number; held: number; published: number }> = {};""",
          )
          # Results detail select fallback
          old = """      const { data, error } = await supabase\n        .from(\"results\")\n        .select(`id, exam_id, student_id, attempt_id, total_score, max_score, percentage, grade, pass_fail,\n           correct_count, wrong_count, unanswered_count, status, security_review_status, released_at, created_at,\n           students(matric_number, student_id, profiles(full_name))`)\n        .eq(\"school_id\", schoolId).eq(\"exam_id\", selectedExamId).order(\"created_at\", { ascending: false }).limit(200);\n      if (error) throw error;\n      return (data ?? []) as unknown as ResultRow[];"""
          new = """      const selects = [\n        `id, exam_id, student_id, attempt_id, total_score, max_score, percentage, grade, pass_fail,\n           correct_count, wrong_count, unanswered_count, status, security_review_status, released_at, created_at,\n           students(matric_number, student_id, profiles(full_name))`,\n        `id, exam_id, student_id, attempt_id, total_score, max_score, percentage, grade, pass_fail,\n           correct_count, wrong_count, unanswered_count, status, security_review_status, released_at, created_at,\n           students(matric_number, student_id)`,\n        `id, exam_id, student_id, attempt_id, total_score, max_score, percentage, grade, pass_fail,\n           correct_count, wrong_count, unanswered_count, status, security_review_status, released_at, created_at`,\n      ];\n      for (const sel of selects) {\n        const { data, error } = await supabase\n          .from(\"results\")\n          .select(sel)\n          .eq(\"school_id\", schoolId).eq(\"exam_id\", selectedExamId).order(\"created_at\", { ascending: false }).limit(200);\n        if (!error) return (data ?? []) as unknown as ResultRow[];\n        console.warn(\"[officer-results] exam results select failed\", error);\n      }\n      return [] as ResultRow[];"""
          if old in t2:
            t2 = t2.replace(old, new)
          p2.write_text(t2)
          print("patched ok", p.stat().st_size, p2.stat().st_size)
          PY
          git config user.email "bot@d4exam.local"
          git config user.name "restore-bot"
          git add src/routes/officer.live-monitor.tsx src/components/officer/OfficerResultsPage.tsx
          git commit -m "fix: restore officer live-monitor + results (safe queryFn)" || echo nochange
          git push
