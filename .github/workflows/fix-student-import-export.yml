name: fix-student-import-export
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-student-import-export.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix importStudents import with Python
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/routes/admin.student-import.tsx")
          t = p.read_text()
          old = 'import { createSchoolUser, importStudents } from "@/lib/auth.school-admin.functions";'
          new = 'import { createSchoolUser, importStudentsBulk as importStudents } from "@/lib/auth.school-admin.functions";'
          if old not in t and new in t:
              print("already fixed")
          elif old in t:
              p.write_text(t.replace(old, new, 1))
              print("fixed")
          else:
              print("pattern not found")
              for i, ln in enumerate(t.splitlines()[:15], 1):
                  if "auth.school-admin" in ln:
                      print(i, repr(ln))
              raise SystemExit(1)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/admin.student-import.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(build): import importStudentsBulk as importStudents"
            git push
          fi
