name: Fix live monitor online status and warnings
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-live-monitor.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Surgical patches
        run: |
          python3 << 'PY'
          from pathlib import Path

          lv = Path("src/lib/live-video.ts")
          t = lv.read_text()
          t = t.replace("export const LIVE_CAM_STALE_MS = 5_000;", "export const LIVE_CAM_STALE_MS = 12_000;")
          t = t.replace("export const LIVE_CAM_STALE_MS = 5000;", "export const LIVE_CAM_STALE_MS = 12_000;")
          if "answeredCount?: number;" not in t:
              t = t.replace(
                  "  cameraActive?: boolean;\n};",
                  "  cameraActive?: boolean;\n  answeredCount?: number;\n  totalQuestions?: number;\n  timeRemainingSec?: number | null;\n};",
              )
          if "answeredCount: typeof meta.answeredCount" not in t:
              t = t.replace(
                  "        cameraActive: meta.cameraActive !== false,\n      };",
                  "        cameraActive: meta.cameraActive !== false,\n        answeredCount: typeof meta.answeredCount === \"number\" ? meta.answeredCount : undefined,\n        totalQuestions: typeof meta.totalQuestions === \"number\" ? meta.totalQuestions : undefined,\n        timeRemainingSec: typeof meta.timeRemainingSec === \"number\" ? meta.timeRemainingSec : null,\n      };",
              )
          t = t.replace(
              "getFaceMeta?: () => { faceStatus?: string; cameraActive?: boolean };",
              "getFaceMeta?: () => { faceStatus?: string; cameraActive?: boolean; answeredCount?: number; totalQuestions?: number; timeRemainingSec?: number | null };",
          )
          lv.write_text(t)
          print("live-video")

          up = Path("src/lib/use-live-cam-publish.ts")
          u = up.read_text()
          if "getAnsweredCount" not in u:
              u = u.replace(
                  "  getFaceStatus?: () => string;\n}) {",
                  "  getFaceStatus?: () => string;\n  getAnsweredCount?: () => number;\n  getTotalQuestions?: () => number;\n  getTimeRemainingSec?: () => number | null;\n}) {",
              )
              u = u.replace(
                  """      getFaceMeta: () => ({\n        faceStatus: opts.getFaceStatus?.() || \"ok\",\n        cameraActive: true,\n      }),""",
                  """      getFaceMeta: () => ({\n        faceStatus: opts.getFaceStatus?.() || \"ok\",\n        cameraActive: true,\n        answeredCount: opts.getAnsweredCount?.(),\n        totalQuestions: opts.getTotalQuestions?.(),\n        timeRemainingSec: opts.getTimeRemainingSec?.() ?? null,\n      }),""",
              )
              up.write_text(u)
              print("publisher")

          nt = Path("src/lib/notify.ts")
          n = nt.read_text()
          if "studentId?: string | null;" not in n[n.find("notifyStudentOfficerWarning"):n.find("notifyStudentOfficerWarning")+600]:
              old = """export async function notifyStudentOfficerWarning(opts: {\n  studentUserId: string;\n  schoolId?: string | null;\n  examId?: string | null;\n  message?: string | null;\n}): Promise<void> {\n  try {\n    await notifyUser({\n      recipientUserId: opts.studentUserId,"""
              new = """export async function notifyStudentOfficerWarning(opts: {\n  studentUserId?: string | null;\n  studentId?: string | null;\n  schoolId?: string | null;\n  examId?: string | null;\n  examTitle?: string | null;\n  message?: string | null;\n}): Promise<void> {\n  try {\n    let uid = (opts.studentUserId || \"\").trim();\n    if (!uid && opts.studentId) {\n      const ids = await studentIdsToAuthUserIds([opts.studentId]);\n      uid = ids[0] || \"\";\n    }\n    if (!uid) {\n      console.warn(\"[notify] notifyStudentOfficerWarning: no auth user\", opts.studentId);\n      return;\n    }\n    await notifyUser({\n      recipientUserId: uid,"""
              if old not in n:
                  raise SystemExit("notify warning signature not found")
              n = n.replace(old, new, 1)
              nt.write_text(n)
              print("notify")

          se = Path("src/components/cbt/CbtExamSession.impl.tsx")
          s = se.read_text()
          if "answeredCountRef" not in s:
              s = s.replace(
                  '  const faceStatusRef = useRef<string>("starting");',
                  '  const faceStatusRef = useRef<string>("starting");\n  const answeredCountRef = useRef(0);\n  const totalQuestionsRef = useRef(0);\n  const timeRemainingRef = useRef<number | null>(null);',
                  1,
              )
          if "getAnsweredCount:" not in s:
              s = s.replace(
                  """    getFaceStatus: () => faceStatusRef.current,\n  });""",
                  """    getFaceStatus: () => faceStatusRef.current,\n    getAnsweredCount: () => answeredCountRef.current,\n    getTotalQuestions: () => totalQuestionsRef.current,\n    getTimeRemainingSec: () => timeRemainingRef.current,\n  });\n\n  useEffect(() => {\n    if (!started || done || previewMode) return;\n    const tick = () => {\n      const aid = attemptIdRef.current;\n      if (!aid) return;\n      const meta = {\n        lastSeenAt: new Date().toISOString(),\n        cameraActive: Boolean(mediaStreamRef.current || liveStream),\n        faceStatus: faceStatusRef.current || \"ok\",\n        answeredCount: answeredCountRef.current,\n        totalQuestions: totalQuestionsRef.current,\n        timeRemainingSec: timeRemainingRef.current,\n        fullscreen: typeof document !== \"undefined\" ? Boolean(document.fullscreenElement) : false,\n        studentName: session?.fullName || student?.fullName || undefined,\n      };\n      void supabase.from(\"exam_attempts\").update({ metadata: meta, updated_at: new Date().toISOString() } as never).eq(\"id\", aid);\n    };\n    tick();\n    const t = window.setInterval(tick, 8000);\n    return () => window.clearInterval(t);\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [started, done, previewMode, liveStream, session?.fullName, student?.fullName]);""",
                  1,
              )
          if "answeredCountRef.current = answeredCount" not in s:
              s = s.replace(
                  "  const answeredCount = Object.keys(answers).length;",
                  "  const answeredCount = Object.keys(answers).length;\n  answeredCountRef.current = answeredCount;\n  totalQuestionsRef.current = questions.length;\n  timeRemainingRef.current = seconds;",
                  1,
              )
          se.write_text(s)
          print("session")

          om = Path("src/routes/officer.live-monitor.tsx")
          o = om.read_text()

          if "Prefer live Realtime frame" not in o:
              old_map = """        const presence = parsePresence(a.metadata);\n        const st = String(a.status || \"\").toLowerCase();\n        const isDone = [\"submitted\", \"terminated\", \"flagged\", \"completed\"].includes(st);\n        const sev: MonitorSeverity = isDone ? \"completed\" : severityFromPresence(a.status, presence, now);\n        const name = studentDisplayName(a);\n        const matric = a.students?.matric_number || a.students?.student_id || \"—\";\n        const _c = a.examinations?.courses as unknown;\n        const course = Array.isArray(_c)\n          ? ((_c[0] as { code?: string } | undefined)?.code || \"—\")\n          : ((_c as { code?: string } | null | undefined)?.code || \"—\");\n        const title = a.examinations?.title || \"Exam\";\n        const frame = frames[a.id];\n        const hasLiveVideo = !isDone && Boolean(frame && isLiveCamFrameFresh(frame.ts, now));\n        const bars = isDone ? 0 : signalBars(frame?.ts, presence.lastSeenAt, now);\n        const activity = lastActivityMs(presence.lastSeenAt, a);\n        let videoStatus: \"live\" | \"reconnecting\" | \"offline\" | \"done\" = \"offline\";\n        if (isDone) videoStatus = \"done\";\n        else if (hasLiveVideo) videoStatus = \"live\";\n        else if (isOnline(presence.lastSeenAt, now) || presence.cameraActive) videoStatus = \"reconnecting\";\n        else videoStatus = \"offline\";\n        return { a, presence, sev, name, matric, course, title, frame, hasLiveVideo, bars, isDone, activity, videoStatus };"""
              new_map = """        const basePresence = parsePresence(a.metadata);\n        const frame = frames[a.id];\n        const st = String(a.status || \"\").toLowerCase();\n        const isDone = [\"submitted\", \"terminated\", \"flagged\", \"completed\"].includes(st);\n        const hasLiveVideo = !isDone && Boolean(frame && isLiveCamFrameFresh(frame.ts, now));\n        // Prefer live Realtime frame for online/camera/face so officers never see Offline while video is live\n        const presence = { ...basePresence };\n        if (hasLiveVideo && frame) {\n          presence.lastSeenAt = new Date(frame.ts).toISOString();\n          presence.cameraActive = frame.cameraActive !== false;\n          if (frame.faceStatus) {\n            const fs = String(frame.faceStatus).toLowerCase();\n            if (fs === \"ok\" || fs === \"none\" || fs === \"multi\" || fs === \"unclear\" || fs === \"unavailable\") {\n              presence.faceStatus = fs as typeof presence.faceStatus;\n            }\n          }\n          if (typeof frame.answeredCount === \"number\") presence.answeredCount = frame.answeredCount;\n          if (typeof frame.totalQuestions === \"number\") presence.totalQuestions = frame.totalQuestions;\n          if (typeof frame.timeRemainingSec === \"number\") presence.timeRemainingSec = frame.timeRemainingSec;\n        } else if (frame?.ts && !presence.lastSeenAt) {\n          presence.lastSeenAt = new Date(frame.ts).toISOString();\n        }\n        const sev: MonitorSeverity = isDone ? \"completed\" : severityFromPresence(a.status, presence, now);\n        const name = studentDisplayName(a);\n        const matric = String(a.students?.matric_number || a.students?.student_id || \"—\").trim() || \"—\";\n        const _c = a.examinations?.courses as unknown;\n        const course = Array.isArray(_c)\n          ? ((_c[0] as { code?: string } | undefined)?.code || \"—\")\n          : ((_c as { code?: string } | null | undefined)?.code || \"—\");\n        const title = a.examinations?.title || \"Exam\";\n        const bars = isDone ? 0 : signalBars(frame?.ts, presence.lastSeenAt, now);\n        const activity = lastActivityMs(presence.lastSeenAt, a) ?? (frame?.ts ?? null);\n        let videoStatus: \"live\" | \"reconnecting\" | \"offline\" | \"done\" = \"offline\";\n        if (isDone) videoStatus = \"done\";\n        else if (hasLiveVideo) videoStatus = \"live\";\n        else if (isOnline(presence.lastSeenAt, now) || presence.cameraActive) videoStatus = \"reconnecting\";\n        else videoStatus = \"offline\";\n        return { a, presence, sev, name, matric, course, title, frame, hasLiveVideo, bars, isDone, activity, videoStatus };"""
              if old_map not in o:
                  raise SystemExit("cards map not found")
              o = o.replace(old_map, new_map, 1)
              print("cards")

          if "faceStatus?: string;" not in o.split("type FrameEntry")[1][:300]:
              o = o.replace(
                  "type FrameEntry = { src: string; ts: number };",
                  "type FrameEntry = { src: string; ts: number; faceStatus?: string; cameraActive?: boolean; answeredCount?: number; totalQuestions?: number; timeRemainingSec?: number | null };",
              )
              o = o.replace(
                  "[attemptId]: { src: p.frame, ts: p.ts || Date.now() },",
                  "[attemptId]: { src: p.frame, ts: p.ts || Date.now(), faceStatus: p.faceStatus, cameraActive: p.cameraActive !== false, answeredCount: p.answeredCount, totalQuestions: p.totalQuestions, timeRemainingSec: p.timeRemainingSec },",
              )
              print("frames")

          o = o.replace(
              '<Info label="Connection" value={isOnline(selected.presence.lastSeenAt) ? "Online" : "Offline"} />',
              '<Info label="Connection" value={selected.hasLiveVideo || isOnline(selected.presence.lastSeenAt) ? "Online" : "Offline"} />',
          )

          o = o.replace(
              """        <p className=\"truncate text-[11px] font-bold leading-tight text-slate-900 sm:text-xs sm:text-sm\">{name}</p>\n        <p className=\"truncate text-[9px] leading-tight text-slate-500 sm:text-[10px]\">\n          {matric} · {course}\n        </p>""",
              """        <p className=\"truncate text-[11px] font-bold leading-tight text-slate-900 sm:text-xs sm:text-sm\">{name}</p>\n        <p className=\"truncate text-[9px] leading-tight text-slate-500 sm:text-[10px]\">\n          {matric}\n        </p>\n        <p className=\"truncate text-[9px] leading-tight text-slate-400 sm:text-[10px]\">\n          {course}\n        </p>""",
          )

          o = o.replace(
              'className="flex h-full w-full max-w-md flex-col overflow-y-auto bg-white shadow-2xl sm:max-w-lg"',
              'className="flex h-full w-full max-w-md flex-col overflow-hidden bg-white shadow-2xl sm:max-w-lg"',
          )
          o = o.replace(
              '<div className="sticky top-0 z-10 border-b border-slate-200 bg-white shadow-sm"><div className="relative w-full bg-slate-900" style={{ height: "min(420px, 70vw)" }}>',
              '<div className="relative w-full shrink-0 bg-slate-900 aspect-[4/3] max-h-[min(420px,50dvh)]">',
          )
          o = o.replace(
              """            </div></div>\n            <div className=\"grid grid-cols-2 gap-2 border-b border-slate-100 p-3 text-sm sm:p-4\">""",
              """            </div>\n            <div className=\"min-h-0 flex-1 overflow-y-auto overscroll-contain\">\n            <div className=\"grid grid-cols-2 gap-2 border-b border-slate-100 p-3 text-sm sm:p-4\">""",
          )

          om.write_text(o)
          print("officer done")
          assert "Prefer live Realtime frame" in o or "hasLiveVideo && frame" in o
          print("OK")
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add -A
          git status
          git commit -m "fix(monitor): online from live frames; warnings reach students; labels + scrollable detail" || echo no-changes
          git pull --rebase origin main || true
          git push origin main
