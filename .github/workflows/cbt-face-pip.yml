name: cbt-face-pip
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cbt-face-pip.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch ExamCameraPip
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/components/cbt/ExamCameraPip.tsx')
          t = p.read_text()

          # Faster tick
          t = t.replace('const FACE_TICK_MS = 900;', 'const FACE_TICK_MS = 550;')
          t = t.replace('const FACE_TICK_MS = 800;', 'const FACE_TICK_MS = 550;')
          t = t.replace('const ENGINE_TIMEOUT_MS = 4000;', 'const ENGINE_TIMEOUT_MS = 8000;')

          # Vibration: only none + multi (not unclear / camera_blocked)
          import re
          t2, n = re.subn(
              r'function haptic\(kind: SecurityAlertKind\) \{[\s\S]*?fireHaptic\(map\[kind\]\);\n\}',
              '''function haptic(kind: SecurityAlertKind) {
  // Vibration only for: no face, multiple faces (start exam + officer warning are elsewhere)
  if (kind === "unclear" || kind === "camera_blocked") return;
  const map: Record<"none" | "multi", HapticKind> = {
    none: "none",
    multi: "multi",
  };
  if (kind === "none" || kind === "multi") fireHaptic(map[kind]);
}''',
              t,
              count=1,
          )
          print('haptic rewrite', n)
          t = t2 if n else t

          # Improve tick: null streak before unclear; ok on first good frame
          if 'nullStreak' not in t:
              old = '''        const n = await engine.count(video);
        if (cancelled) return;
        engineReady = true;
        if (n == null) {
          applyState("unclear", null);
        } else if (n <= 0) {
          applyState("none", 0);
        } else if (n > 1) {
          applyState("multi", n);
        } else {
          applyState("ok", 1);
        }
      } catch {
        if (!cancelled) applyState("unclear", null);
      }'''
              new = '''        const n = await engine.count(video);
        if (cancelled) return;
        engineReady = true;
        if (n == null) {
          nullStreak += 1;
          if (nullStreak >= 3) applyState("unclear", null);
        } else if (n <= 0) {
          nullStreak = 0;
          applyState("none", 0);
        } else if (n > 1) {
          nullStreak = 0;
          applyState("multi", n);
        } else {
          nullStreak = 0;
          applyState("ok", 1);
        }
      } catch {
        nullStreak += 1;
        if (!cancelled && nullStreak >= 3) applyState("unclear", null);
      }'''
              if old in t:
                  t = t.replace(old, new)
                  # declare nullStreak near engineReady
                  t = t.replace(
                      'let engineReady = false;',
                      'let engineReady = false;\n    let nullStreak = 0;',
                  )
                  print('nullStreak logic added')
              else:
                  print('tick block pattern miss')

          # Skip toast spam for unclear in applyState
          t = t.replace(
              'else if (next === "unclear") fireAlert("unclear", faceCount);\n      else if (next === "unavailable") {\n        fireAlert("unclear", faceCount);\n      }',
              '// unclear/unavailable: update label only, no toast/haptic spam',
          )

          p.write_text(t)
          print('ExamCameraPip bytes', p.stat().st_size)
          assert 'PLACEHOLDER' not in t
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/cbt/ExamCameraPip.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m 'fix(cbt): face detection stabilisation + vibrate only none/multi'
            git push
          fi
