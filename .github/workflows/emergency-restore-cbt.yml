name: Emergency restore CBT session
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/emergency-restore-cbt.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download good file and patch
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-platform/4bb14611c6d0beceb6f0f2d63ef65fc36c47573d/src/components/cbt/CbtExamSession.impl.tsx" -o src/components/cbt/CbtExamSession.impl.tsx
          wc -c src/components/cbt/CbtExamSession.impl.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/components/cbt/CbtExamSession.impl.tsx")
          t = p.read_text()
          assert len(t) > 10000, len(t)
          assert "PLACEHOLDER" not in t
          a = 'import { hapticOfficerWarning, haptic as fireHaptic, primeHaptics, refreshHapticUnlock } from "@/lib/haptic";'
          b = 'import { hapticOfficerWarning, haptic as fireHaptic, primeHaptics, refreshHapticUnlock, startHapticKeepAlive, stopHapticKeepAlive } from "@/lib/haptic";'
          t = t.replace(a, b, 1)
          t = t.replace("faceDetection={Boolean(security.faceDetection)}", "faceDetection={Boolean(security.faceDetection || security.requireCamera)}", 1)
          t = t.replace("try { primeHaptics(); } catch { /* ignore */ }", "try { primeHaptics(); startHapticKeepAlive(); } catch { /* ignore */ }", 1)
          old = """  const shutdownMedia = useCallback(() => {
    stopLiveCamStream();
    stopMediaStream(mediaStreamRef.current);
    mediaStreamRef.current = null;
    setLiveStream(null);
  }, [stopLiveCamStream]);"""
          new = """  const shutdownMedia = useCallback(() => {
    try { stopHapticKeepAlive(); } catch { /* ignore */ }
    stopLiveCamStream();
    stopMediaStream(mediaStreamRef.current);
    mediaStreamRef.current = null;
    setLiveStream(null);
  }, [stopLiveCamStream]);"""
          t = t.replace(old, new, 1)
          assert "startHapticKeepAlive" in t
          p.write_text(t)
          print("patched", len(t))
          PY
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx
          git commit -m "fix(cbt): restore session + vibration keepalive + faceDetection" || echo "nothing"
          git push || echo "push failed"
