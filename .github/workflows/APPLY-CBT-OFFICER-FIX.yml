name: APPLY-CBT-OFFICER-FIX
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/payloads/cbt.impl.part*.b64"
      - "scripts/payloads/officer.live.part*.b64"
      - ".github/workflows/APPLY-CBT-OFFICER-FIX.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and write files
        run: |
          set -e
          python3 << 'PY'
          import base64, pathlib
          def assemble(prefix, dest):
              parts = sorted(pathlib.Path("scripts/payloads").glob(f"{prefix}.part*.b64"))
              if not parts:
                  print("no parts for", prefix)
                  return False
              b64 = "".join(p.read_text().strip() for p in parts)
              data = base64.b64decode(b64)
              pathlib.Path(dest).write_bytes(data)
              print(dest, "wrote", len(data), "from", len(parts), "parts")
              return True
          ok1 = assemble("cbt.impl", "src/components/cbt/CbtExamSession.impl.tsx")
          ok2 = assemble("officer.live", "src/routes/officer.live-monitor.tsx")
          if not (ok1 or ok2):
              raise SystemExit("nothing to apply")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(cbt+officer): answers persist on leave, grey lock on resume, live timer, officer pause/resume/terminate/submit"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
