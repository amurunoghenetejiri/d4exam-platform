name: Apply identity tab quality
on:
  push:
    paths:
      - scripts/apply_identity_tab_quality.py
      - .github/workflows/apply-identity-tab-quality.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_identity_tab_quality.py
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          if git diff --staged --quiet; then echo No changes; else git commit -m "fix(officer-live): real name/matric, live tab count, smoother video"; git push; fi
