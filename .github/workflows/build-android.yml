name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "public/**"
      - "scripts/generate-capacitor-index.mjs"
      - "src/lib/push.ts"
      - "src/lib/offline-*.ts"
      - "src/lib/require-online.ts"
      - "src/native/**"
      - "src/components/OfflineBootstrap.tsx"
      - "src/components/NetworkBanner.tsx"
      - ".github/workflows/build-android.yml"
      - "DEPLOY_TRIGGER.txt"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build D4EXAM Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit

      - name: Build web application
        run: |
          set -euo pipefail
          npm run build

      - name: Prepare Capacitor dist/ with REAL SPA index (not stub)
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ ! -d .output/public ]; then
            echo "ERROR: .output/public missing after build"
            exit 1
          fi
          cp -a .output/public/. dist/
          cp -f public/offline.html dist/offline.html
          cp -f public/firebase-messaging-sw.js dist/firebase-messaging-sw.js 2>/dev/null || true
          node scripts/generate-capacitor-index.mjs
          test -f dist/index.html
          grep -q 'type="module"' dist/index.html || { echo "FATAL: index.html has no module script"; exit 1; }
          grep -q 'assets/index-' dist/index.html || { echo "FATAL: index.html missing entry chunk"; exit 1; }
          echo "=== index.html (first 30 lines) ==="
          head -30 dist/index.html
          echo "=== dist top ==="
          ls -la dist/ | head -25

      - name: Ensure complete Android platform
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Apply D4EXAM permissions, version 2.1.0, branding, immersive
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for perm in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.CAMERA android.permission.RECORD_AUDIO android.permission.POST_NOTIFICATIONS android.permission.VIBRATE android.permission.RECEIVE_BOOT_COMPLETED; do
            if ! grep -q "$perm" "$MANIFEST"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$perm\" />\n</manifest>|" "$MANIFEST"
            fi
          done
          mkdir -p android/app/src/main/res/values
          rm -f android/app/src/main/res/values/ic_launcher_background.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' \
            '    <color name="colorPrimary">#0b1b3a</color>' \
            '    <color name="colorPrimaryDark">#0b1b3a</color>' \
            '    <color name="colorAccent">#3B82F6</color>' \
            '    <color name="splash_background">#0b1b3a</color>' \
            '    <color name="ic_launcher_background">#00000000</color>' \
            '</resources>' > android/app/src/main/res/values/colors.xml
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">D4EXAM<\/string>/' android/app/src/main/res/values/strings.xml || true
          sed -i 's/versionCode [0-9]*/versionCode 21/' android/app/build.gradle || true
          sed -i 's/versionName "[^"]*"/versionName "2.1.0"/' android/app/build.gradle || true
          mkdir -p android/app/src/main/java/com/d4exam/app
          printf '%s\n' \
            'package com.d4exam.app;' \
            '' \
            'import android.os.Bundle;' \
            'import android.view.WindowManager;' \
            'import com.getcapacitor.BridgeActivity;' \
            '' \
            'public class MainActivity extends BridgeActivity {' \
            '  @Override' \
            '  public void onCreate(Bundle savedInstanceState) {' \
            '    super.onCreate(savedInstanceState);' \
            '    getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);' \
            '  }' \
            '}' \
            > android/app/src/main/java/com/d4exam/app/MainActivity.java

      - name: Optional google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "No FIREBASE_GOOGLE_SERVICES_JSON secret"
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: VERIFY local shell (no server.url + real index)
        run: |
          set -euo pipefail
          CFG="android/app/src/main/assets/capacitor.config.json"
          PUB="android/app/src/main/assets/public"
          test -f "$CFG"
          echo "=== capacitor.config.json ==="
          cat "$CFG"
          python3 - <<'PY'
          import json, sys
          c = json.load(open("android/app/src/main/assets/capacitor.config.json"))
          s = c.get("server") or {}
          if s.get("url"):
              print("FATAL: server.url set to", s["url"])
              sys.exit(1)
          print("OK: no server.url")
          PY
          test -f "$PUB/index.html"
          grep -q 'type="module"' "$PUB/index.html"
          grep -q 'assets/index-' "$PUB/index.html"
          test -d "$PUB/assets"
          ls "$PUB/assets"/index-*.js | head -1
          echo "VERIFY PASSED — real SPA index bundled"

      - name: Generate D4EXAM icons + splash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick fonts-dejavu-core
          SRC=""
          if [ -f public/logo.png ]; then SRC=public/logo.png
          elif [ -f public/icon-512.png ]; then SRC=public/icon-512.png
          else echo "WARNING: no logo"; exit 0; fi
          for density_size in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${density_size%%:*}; size=${density_size##*:}
            dir="android/app/src/main/res/mipmap-${density}"; mkdir -p "$dir"
            convert "$SRC" -resize "${size}x${size}" -background none -gravity center -extent "${size}x${size}" PNG32:"$dir/ic_launcher.png"
            convert "$SRC" -resize "${size}x${size}" -background none -gravity center -extent "${size}x${size}" PNG32:"$dir/ic_launcher_round.png"
            fsize=$((size * 2)); safe=$((fsize * 66 / 100))
            convert "$SRC" -resize "${safe}x${safe}" -background none -gravity center -extent "${fsize}x${fsize}" PNG32:"$dir/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/drawable
          convert "$SRC" -resize 128x128 -background none -gravity center -extent 128x128 PNG32:android/app/src/main/res/drawable/ic_stat_d4exam.png || true
          find android/app/src/main/res -type f \( -name 'splash*' -o -name 'splash_dark*' \) -delete || true
          convert -size 1080x1920 xc:"#0b1b3a" \
            \( "$SRC" -resize 480x480 \) -gravity center -geometry +0-120 -compose over -composite \
            -gravity south -fill white -font DejaVu-Sans-Bold -pointsize 42 -annotate +0+280 "D4EXAM" \
            -gravity south -fill "#93c5fd" -font DejaVu-Sans -pointsize 28 -annotate +0+210 "Smart. Secure. Seamless." \
            -gravity south -fill "#cbd5e1" -font DejaVu-Sans -pointsize 22 -annotate +0+150 "Works offline" \
            PNG32:android/app/src/main/res/drawable/d4_splash.png 2>/dev/null || \
          convert -size 1080x1920 xc:"#0b1b3a" \( "$SRC" -resize 480x480 \) -gravity center -compose over -composite PNG32:android/app/src/main/res/drawable/d4_splash.png
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '    <background android:drawable="@color/ic_launcher_background"/>' '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' '</adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          if [ -f android/app/src/main/res/values/styles.xml ]; then
            sed -i 's|android:windowBackground">@[^<]*|android:windowBackground">@drawable/d4_splash|' android/app/src/main/res/values/styles.xml || true
          fi
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<bitmap xmlns:android="http://schemas.android.com/apk/res/android"' '    android:src="@drawable/d4_splash"' '    android:gravity="fill" />' > android/app/src/main/res/drawable/splash.xml

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p artifacts && cp "$APK" artifacts/D4EXAM-debug.apk
          unzip -l "$APK" | grep -E 'assets/public/(index\.html|assets/index-)' | head -10 || true

      - name: Upload D4EXAM Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4EXAM-Android-APK
          path: artifacts/D4EXAM-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### D4EXAM Android APK v2.1.0 — SPA index + offline shell" >> "$GITHUB_STEP_SUMMARY"
          echo "- Real client index.html (no stuck Loading stub)" >> "$GITHUB_STEP_SUMMARY"
          echo "- No server.url — local assets; Uninstall old app before install" >> "$GITHUB_STEP_SUMMARY"
