name: Build Android APK (local SPA)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "native-android/**"
      - "capacitor.config.*"
      - "scripts/prepare-capacitor-dist.mjs"
      - "vite.capacitor.config.ts"
      - "src/capacitor-main.tsx"
      - "src/lib/haptic.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-android.yml"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build D4EXAM Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: Build local Capacitor SPA (no Vercel)
        run: bun run build:app
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify local SPA
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          if grep -E 'url:\s*["'\'']https?://' capacitor.config.ts 2>/dev/null; then
            echo "ERROR: server.url must not point at a remote URL"
            exit 1
          fi
          echo "OK: local SPA ready"

      # Proven approach: regenerate a complete Android project (includes gradlew + resources)
      - name: Generate fresh Android platform
        run: |
          set -euo pipefail
          rm -rf android
          bunx cap add android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Overlay native plugins (screen share + immersive/vibrate)
        run: |
          set -euo pipefail
          test -d native-android
          cp -a native-android/. android/
          echo "Native overlay applied:"
          find android/app/src/main/java -type f | sort
          MAN="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'ScreenCaptureService' "$MAN"; then
            sed -i 's|</application>|        <service android:name=".ScreenCaptureService" android:exported="false" android:foregroundServiceType="mediaProjection" />\n    </application>|' "$MAN"
          fi
          for perm in \
            android.permission.CAMERA \
            android.permission.RECORD_AUDIO \
            android.permission.MODIFY_AUDIO_SETTINGS \
            android.permission.POST_NOTIFICATIONS \
            android.permission.VIBRATE \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION; do
            if ! grep -q "$perm" "$MAN"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$perm\" />\n</manifest>|" "$MAN"
            fi
          done
          grep -q 'ExamImmersivePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'ScreenSharePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'android.permission.VIBRATE' "$MAN"
          echo "OK: plugins + VIBRATE permission"

      - name: Capacitor sync
        run: |
          set -euo pipefail
          bunx cap sync android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 platforms;android-34 build-tools;35.0.0 build-tools;34.0.0

      - name: Accept licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d4exam-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
