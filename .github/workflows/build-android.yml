name: Build Android APK (local SPA)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "capacitor.config.*"
      - "scripts/prepare-capacitor-dist.mjs"
      - "vite.capacitor.config.ts"
      - "src/capacitor-main.tsx"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: Build local Capacitor SPA (no Vercel)
        run: bun run build:app
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify local SPA (no server.url)
        run: |
          set -e
          test -f dist/index.html
          test -d dist/assets
          if grep -q '"url"' capacitor.config.json 2>/dev/null; then
            echo "ERROR: server.url must not be set"
            exit 1
          fi
          echo "OK: local SPA present"
          ls -la dist/assets/ | head -20

      - name: Capacitor sync
        run: |
          set -e
          bunx cap sync android
          echo "--- capacitor.settings.gradle ---"
          cat android/capacitor.settings.gradle || true
          echo "--- settings.gradle ---"
          cat android/settings.gradle || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt 2>&1 || true
          # Platform 36 required by variables.gradle; build-tools 35 is widely available
          sdkmanager "platforms;android-36" "platforms;android-35" \
            "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools" || true
          sdkmanager --list_installed | head -50

      - name: Bootstrap Gradle wrapper if missing
        working-directory: android
        run: |
          set -e
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle 8.14.3 wrapper…"
            curl -sL -o /tmp/gradle-8.14.3-bin.zip \
              "https://services.gradle.org/distributions/gradle-8.14.3-bin.zip"
            unzip -q -o /tmp/gradle-8.14.3-bin.zip -d /tmp
            /tmp/gradle-8.14.3/bin/gradle wrapper \
              --gradle-version 8.14.3 \
              --distribution-type all
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          # Capture full log so we can debug without signed-in log access
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/gradle-assemble.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "Gradle exit code: $STATUS"
          if [ "$STATUS" -ne 0 ]; then
            echo "===== GRADLE FAILURE (last 120 lines) ====="
            tail -n 120 /tmp/gradle-assemble.log
            exit $STATUS
          fi

      - name: Upload Gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d4exam-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
