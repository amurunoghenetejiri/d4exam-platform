name: Build Android APK (local SPA)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "native-android/**"
      - "capacitor.config.*"
      - "scripts/prepare-capacitor-dist.mjs"
      - "vite.capacitor.config.ts"
      - "src/capacitor-main.tsx"
      - "src/lib/haptic.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-android.yml"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build D4EXAM Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun install

      - name: Build local Capacitor SPA (no Vercel)
        run: |
          set -euo pipefail
          bun run build:app
          test -f dist/index.html
          test -d dist/assets
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify no remote server.url
        run: |
          set -euo pipefail
          if grep -E 'url:\s*["'\'']https?://' capacitor.config.ts 2>/dev/null; then
            echo "ERROR: server.url must not point at a remote URL"
            exit 1
          fi
          echo "OK: local SPA, no remote server.url"

      # Capacitor 8 requires compileSdk/targetSdk 36 — regenerate platform every run
      - name: Ensure complete Android platform
        run: |
          set -euo pipefail
          rm -rf android
          bunx cap add android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Overlay native plugins (vibrate + screen share)
        run: |
          set -euo pipefail
          test -d native-android
          mkdir -p android/app/src/main/java/com/d4exam/app
          cp -a native-android/app/src/main/java/com/d4exam/app/. \
            android/app/src/main/java/com/d4exam/app/

          DRAW="android/app/src/main/res/drawable"
          mkdir -p "$DRAW"
          if [ -d native-android/app/src/main/res/drawable ]; then
            cp -a native-android/app/src/main/res/drawable/. "$DRAW/" || true
          fi

          # Cap generates splash.png; our overlay may add splash.xml — same resource name = build fail.
          # Prefer solid-color splash.xml (branded navy) and drop any splash bitmap.
          if [ -f "$DRAW/splash.xml" ]; then
            rm -f "$DRAW"/splash.png "$DRAW"/splash.jpg "$DRAW"/splash.webp "$DRAW"/splash.gif
            echo "OK: kept splash.xml, removed splash bitmap duplicates"
          fi
          # Also drop any other basename collisions (foo.xml + foo.png)
          for xml in "$DRAW"/*.xml; do
            [ -f "$xml" ] || continue
            base="$(basename "$xml" .xml)"
            for ext in png jpg jpeg webp gif; do
              if [ -f "$DRAW/${base}.${ext}" ]; then
                echo "Removing duplicate drawable: ${base}.${ext}"
                rm -f "$DRAW/${base}.${ext}"
              fi
            done
          done

          if [ -d native-android/app/src/main/res/values ]; then
            mkdir -p android/app/src/main/res/values
            cp -f native-android/app/src/main/res/values/colors.xml android/app/src/main/res/values/ 2>/dev/null || true
          fi

          MAN="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'ScreenCaptureService' "$MAN"; then
            sed -i 's|</application>|        <service android:name=".ScreenCaptureService" android:exported="false" android:foregroundServiceType="mediaProjection" />\n    </application>|' "$MAN"
          fi
          for perm in \
            android.permission.CAMERA \
            android.permission.RECORD_AUDIO \
            android.permission.MODIFY_AUDIO_SETTINGS \
            android.permission.POST_NOTIFICATIONS \
            android.permission.VIBRATE \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION; do
            if ! grep -q "$perm" "$MAN"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$perm\" />\n</manifest>|" "$MAN"
            fi
          done

          test -f android/app/src/main/java/com/d4exam/app/ExamImmersivePlugin.java
          test -f android/app/src/main/java/com/d4exam/app/ScreenSharePlugin.java
          test -f android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'ExamImmersivePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'ScreenSharePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'android.permission.VIBRATE' "$MAN"
          echo "OK: native plugins + VIBRATE"
          ls -la "$DRAW" || true

      # Capacitor 8 official minimums: compileSdk 36 / targetSdk 36
      - name: Pin compileSdk 36 (Capacitor 8 requirement)
        run: |
          set -euo pipefail
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion *= *[0-9]*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/targetSdkVersion *= *[0-9]*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/minSdkVersion *= *[0-9]*/minSdkVersion = 24/' android/variables.gradle
            cat android/variables.gradle
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Accept Android licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Capacitor sync Android
        run: |
          set -euo pipefail
          bunx cap sync android
          # Re-pin after sync (cap may rewrite variables)
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion *= *[0-9]*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/targetSdkVersion *= *[0-9]*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/minSdkVersion *= *[0-9]*/minSdkVersion = 24/' android/variables.gradle
            cat android/variables.gradle
          fi
          # cap sync can restore splash.png — de-dupe again
          DRAW="android/app/src/main/res/drawable"
          if [ -f "$DRAW/splash.xml" ]; then
            rm -f "$DRAW"/splash.png "$DRAW"/splash.jpg "$DRAW"/splash.webp "$DRAW"/splash.gif
          fi
          for xml in "$DRAW"/*.xml; do
            [ -f "$xml" ] || continue
            base="$(basename "$xml" .xml)"
            for ext in png jpg jpeg webp gif; do
              rm -f "$DRAW/${base}.${ext}"
            done
          done
          # Re-apply overlay colors if present
          if [ -f native-android/app/src/main/res/values/colors.xml ]; then
            mkdir -p android/app/src/main/res/values
            cp -f native-android/app/src/main/res/values/colors.xml android/app/src/main/res/values/
          fi
          chmod +x android/gradlew
          grep -q 'ExamImmersivePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml
          echo "OK: sync complete (compileSdk 36, splash de-duped)"
          ls -la "$DRAW" || true

      - name: Build debug APK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${ANDROID_SDK_ROOT}" ]; then
            for candidate in "$HOME/Android/Sdk" /usr/local/lib/android/sdk "$ANDROID_HOME"; do
              if [ -n "$candidate" ] && [ -d "$candidate" ]; then
                export ANDROID_SDK_ROOT="$candidate"
                break
              fi
            done
          fi
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          test -d "$ANDROID_HOME/platforms/android-36" || {
            echo "Installing android-36 platform..."
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
          }
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          echo "===== variables.gradle ====="
          cat variables.gradle || true
          echo "===== drawable dir ====="
          ls -la app/src/main/res/drawable/ || true
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-assemble.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "===== GRADLE FAILURE (last 250 lines) ====="
            tail -n 250 /tmp/gradle-assemble.log
            exit "$STATUS"
          fi
          ls -la app/build/outputs/apk/debug/ || true

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: d4exam-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
