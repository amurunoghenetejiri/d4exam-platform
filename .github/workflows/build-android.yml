name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "public/**"
      - "src/lib/push.ts"
      - "src/native/**"
      - "scripts/prepare-capacitor-dist.mjs"
      - "scripts/generate-capacitor-index.mjs"
      - ".github/workflows/build-android.yml"
      - "DEPLOY_TRIGGER.txt"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build D4EXAM Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit

      - name: Build web application
        run: |
          set -euo pipefail
          npm run build

      - name: Prepare Capacitor dist (fallback assets; shell is Vercel URL)
        run: |
          set -euo pipefail
          # Keep dist populated for Capacitor webDir even though server.url points at Vercel
          if [ -f scripts/prepare-capacitor-dist.mjs ]; then
            node scripts/prepare-capacitor-dist.mjs || true
          fi
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            if [ -d .output/public ]; then
              cp -R .output/public/. dist/
            elif [ -d public ]; then
              cp -R public/. dist/
            fi
          fi
          if [ ! -f dist/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"/><title>D4EXAM</title></head><body><p>Loading…</p></body></html>' > dist/index.html
          fi
          echo "dist ready (runtime shell = https://d4exam-platform.vercel.app)"
          ls -la dist/index.html || true

      - name: Ensure complete Android platform
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Verify capacitor uses Vercel shell URL
        run: |
          set -euo pipefail
          CFG="capacitor.config.ts"
          grep -q 'd4exam-platform.vercel.app' "$CFG"
          echo "OK: Capacitor server.url points at Vercel production"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Capacitor sync Android
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4EXAM-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
