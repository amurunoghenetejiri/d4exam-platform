name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "public/**"
      - "src/lib/push.ts"
      - "src/lib/push-send.functions.ts"
      - "src/native/**"
      - "scripts/prepare-capacitor-dist.mjs"
      - "scripts/generate-capacitor-index.mjs"
      - ".github/workflows/build-android.yml"
      - "DEPLOY_TRIGGER.txt"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build D4EXAM Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit

      - name: Build web application
        run: |
          set -euo pipefail
          npm run build

      - name: Prepare Capacitor dist (fallback assets; shell is Vercel URL)
        run: |
          set -euo pipefail
          if [ -f scripts/prepare-capacitor-dist.mjs ]; then
            node scripts/prepare-capacitor-dist.mjs || true
          fi
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            if [ -d .output/public ]; then
              cp -R .output/public/. dist/
            elif [ -d public ]; then
              cp -R public/. dist/
            fi
          fi
          if [ ! -f dist/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"/><title>D4EXAM</title></head><body><p>Loading…</p></body></html>' > dist/index.html
          fi
          if [ -f public/logo.png ]; then cp -f public/logo.png dist/logo.png; fi
          echo "dist ready (runtime shell = https://d4exam-platform.vercel.app)"

      - name: Ensure complete Android platform
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Ensure Android permissions (camera, mic, notifications)
        run: |
          set -euo pipefail
          MAN="android/app/src/main/AndroidManifest.xml"
          test -f "$MAN"
          if ! grep -q 'android.permission.CAMERA' "$MAN"; then
            sed -i 's|android.permission.INTERNET" />|android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />|' "$MAN" || true
          fi
          if ! grep -q 'RECORD_AUDIO' "$MAN"; then
            sed -i 's|android.permission.CAMERA" />|android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MAN" || true
          fi
          if ! grep -q 'POST_NOTIFICATIONS' "$MAN"; then
            sed -i 's|android.permission.INTERNET" />|android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />|' "$MAN" || true
          fi
          if ! grep -q 'FOREGROUND_SERVICE_MEDIA_PROJECTION' "$MAN"; then
            sed -i 's|android.permission.RECORD_AUDIO" />|android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />|' "$MAN" || true
          fi
          if ! grep -q 'android.hardware.camera' "$MAN"; then
            sed -i 's|</manifest>|    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.front" android:required="false" />\n</manifest>|' "$MAN" || true
          fi
          echo "Manifest permissions:"
          grep 'uses-permission' "$MAN" || true

      - name: Install ImageMagick for launcher icons
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Apply launcher + monochrome notification icons
        run: |
          set -euo pipefail
          LOGO="public/logo.png"
          test -f "$LOGO"
          RES="android/app/src/main/res"

          find "$RES" -type f \( -name 'ic_launcher.xml' -o -name 'ic_launcher_round.xml' -o -name 'ic_launcher_foreground.xml' -o -name 'ic_launcher_foreground.png' \) -delete || true
          rm -rf "$RES/mipmap-anydpi-v26" || true

          make_icon() {
            local size="$1" dest="$2"
            local inner
            inner=$(awk "BEGIN {printf \"%d\", $size * 0.72}")
            convert "$LOGO" -background none -gravity center -resize "${inner}x${inner}" \
              -extent "${size}x${size}" PNG32:"$dest"
          }

          for dens in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${dens%%:*}"
            px="${dens##*:}"
            mkdir -p "$RES/mipmap-$name"
            rm -f "$RES/mipmap-$name/ic_launcher.png" \
                  "$RES/mipmap-$name/ic_launcher_round.png" \
                  "$RES/mipmap-$name/ic_launcher.xml" \
                  "$RES/mipmap-$name/ic_launcher_round.xml" || true
            make_icon "$px" "$RES/mipmap-$name/ic_launcher.png"
            make_icon "$px" "$RES/mipmap-$name/ic_launcher_round.png"
          done

          make_stat_icon() {
            local size="$1" dest="$2"
            local inner
            inner=$(awk "BEGIN {printf \"%d\", $size * 0.90}")
            convert "$LOGO" -background none -gravity center -resize "${inner}x${inner}" \
              -extent "${size}x${size}" \
              -channel RGB -evaluate set 100% \
              PNG32:"$dest"
          }
          for dens in mdpi:24 hdpi:36 xhdpi:48 xxhdpi:72 xxxhdpi:96; do
            name="${dens%%:*}"
            px="${dens##*:}"
            mkdir -p "$RES/drawable-$name"
            mkdir -p "$RES/drawable"
            make_stat_icon "$px" "$RES/drawable-$name/ic_stat_d4exam.png"
          done
          make_stat_icon 48 "$RES/drawable/ic_stat_d4exam.png"

          echo "Icons: launcher PNG + white monochrome ic_stat_d4exam"
          find "$RES" -name 'ic_stat_d4exam.png' | sort

      - name: Optional google-services.json for FCM (native push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Wrote google-services.json from secret"
          elif [ -f android/app/google-services.json ]; then
            echo "Using committed google-services.json"
          else
            echo "WARNING: No google-services.json — Allow will not crash; FCM token may not register until secret is set"
          fi

      - name: Verify capacitor uses Vercel shell URL
        run: |
          set -euo pipefail
          CFG="capacitor.config.ts"
          grep -q 'd4exam-platform.vercel.app' "$CFG"
          echo "OK: Capacitor server.url points at Vercel production"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do NOT install emulator — unused for assembleDebug and often fails (ZipFile errors).
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest

      - name: Accept Android licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Capacitor sync Android
        run: |
          set -euo pipefail
          npx cap sync android
          MAN="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.CAMERA' "$MAN"
          grep -q 'android.permission.RECORD_AUDIO' "$MAN"
          echo "OK: CAMERA and RECORD_AUDIO present in AndroidManifest"

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4EXAM-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
