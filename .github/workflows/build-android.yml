name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "public/logo.png"
      - "public/icon-512.png"
      - "src/lib/push.ts"
      - "src/native/**"
      - ".github/workflows/build-android.yml"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build D4EXAM Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit
          npm ls @capacitor/core @capacitor/cli @capacitor/android @capacitor/push-notifications @capacitor/camera --depth=0 || true

      - name: Build web application
        run: |
          set -euo pipefail
          npm run build
          ls -la .output/public 2>/dev/null || ls -la .output 2>/dev/null || true

      - name: Prepare Capacitor dist/ from .output/public
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -d .output/public ]; then
            cp -a .output/public/. dist/
          else
            echo "ERROR: .output/public missing"; exit 1
          fi
          if [ ! -f dist/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>D4EXAM</title></head><body style="background:#0b1b3a;color:#fff">Loading D4EXAM…</body></html>' > dist/index.html
          fi
          if [ -f public/offline.html ]; then cp public/offline.html dist/offline.html; fi
          test -f dist/index.html

      - name: Ensure complete Android platform
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          test -f android/gradlew
          grep -q 'com.d4exam.app' android/app/build.gradle
          chmod +x android/gradlew

      - name: Apply D4EXAM permissions, version, branding
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for perm in \
            android.permission.INTERNET \
            android.permission.ACCESS_NETWORK_STATE \
            android.permission.CAMERA \
            android.permission.RECORD_AUDIO \
            android.permission.POST_NOTIFICATIONS \
            android.permission.VIBRATE \
            android.permission.RECEIVE_BOOT_COMPLETED
          do
            if ! grep -q "$perm" "$MANIFEST"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$perm\" />\n</manifest>|" "$MANIFEST"
            fi
          done
          if ! grep -q 'android.hardware.camera' "$MANIFEST"; then
            sed -i 's|</manifest>|    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.front" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n</manifest>|' "$MANIFEST"
          fi
          mkdir -p android/app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <color name="colorPrimary">#0b1b3a</color>' '    <color name="colorPrimaryDark">#0b1b3a</color>' '    <color name="colorAccent">#3B82F6</color>' '</resources>' > android/app/src/main/res/values/colors.xml
          if [ -f android/app/src/main/res/values/ic_launcher_background.xml ]; then
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <color name="ic_launcher_background">#0b1b3a</color>' '</resources>' > android/app/src/main/res/values/ic_launcher_background.xml
          fi
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">D4EXAM<\/string>/' android/app/src/main/res/values/strings.xml || true
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">D4EXAM<\/string>/' android/app/src/main/res/values/strings.xml || true
          sed -i 's/versionCode [0-9]*/versionCode 4/' android/app/build.gradle || true
          sed -i 's/versionName "[^"]*"/versionName "1.3.0"/' android/app/build.gradle || true
          grep -E 'versionCode|versionName|applicationId' android/app/build.gradle || true

      - name: Generate D4EXAM launcher icons from official logo
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          SRC=""
          if [ -f public/icon-512.png ]; then SRC=public/icon-512.png
          elif [ -f public/logo.png ]; then SRC=public/logo.png
          else echo "WARNING: no logo"; exit 0; fi
          echo "Using $SRC"
          for density_size in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${density_size%%:*}
            size=${density_size##*:}
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert "$SRC" -resize "${size}x${size}" -background "#0b1b3a" -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
            convert "$SRC" -resize "${size}x${size}" -background "#0b1b3a" -gravity center -extent "${size}x${size}" "$dir/ic_launcher_round.png"
            fsize=$((size * 2))
            convert "$SRC" -resize "${size}x${size}" -background none -gravity center -extent "${fsize}x${fsize}" "$dir/ic_launcher_foreground.png" 2>/dev/null || convert "$SRC" -resize "${size}x${size}" "$dir/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/drawable
          convert "$SRC" -resize 96x96 -colorspace Gray -threshold 40% -negate -transparent white android/app/src/main/res/drawable/ic_stat_d4exam.png 2>/dev/null || convert "$SRC" -resize 96x96 android/app/src/main/res/drawable/ic_stat_d4exam.png
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '    <background android:drawable="@color/ic_launcher_background"/>' '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' '</adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Optional google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "No FIREBASE_GOOGLE_SERVICES_JSON secret — add from Firebase Console for full native FCM"
          fi

      - name: Capacitor sync
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          set -euo pipefail
          java -version
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: find_apk
        run: |
          set -euo pipefail
          APK=""
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK=$(find android -name "*-debug.apk" -type f | head -1 || true)
          fi
          test -n "$APK" && test -f "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/D4EXAM-debug.apk
          ls -la artifacts/

      - name: Upload D4EXAM Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4EXAM-Android-APK
          path: artifacts/D4EXAM-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### D4EXAM Android Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App ID:** com.d4exam.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** 1.3.0 (versionCode 4)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** D4EXAM-Android-APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Icon:** from public D4EXAM logo" >> "$GITHUB_STEP_SUMMARY"
