name: Build Android APK (local SPA)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "native-android/**"
      - "capacitor.config.*"
      - "scripts/prepare-capacitor-dist.mjs"
      - "vite.capacitor.config.ts"
      - "src/capacitor-main.tsx"
      - "src/lib/haptic.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-android.yml"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build D4EXAM Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: Build local Capacitor SPA (no Vercel)
        run: bun run build:app
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify local SPA
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          if grep -E 'url:\s*["'\'']https?://' capacitor.config.ts 2>/dev/null; then
            echo "ERROR: server.url must not point at a remote URL"
            exit 1
          fi
          echo "OK: local SPA ready"

      - name: Generate fresh Android platform
        run: |
          set -euo pipefail
          rm -rf android
          bunx cap add android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Overlay native plugins (screen share + immersive/vibrate)
        run: |
          set -euo pipefail
          test -d native-android
          # Only overlay Java + res we own — do not wipe Capacitor-generated gradle/resources
          mkdir -p android/app/src/main/java/com/d4exam/app
          cp -a native-android/app/src/main/java/com/d4exam/app/. \
            android/app/src/main/java/com/d4exam/app/
          if [ -d native-android/app/src/main/res ]; then
            cp -a native-android/app/src/main/res/. android/app/src/main/res/
          fi

          MAN="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'ScreenCaptureService' "$MAN"; then
            sed -i 's|</application>|        <service android:name=".ScreenCaptureService" android:exported="false" android:foregroundServiceType="mediaProjection" />\n    </application>|' "$MAN"
          fi
          for perm in \
            android.permission.CAMERA \
            android.permission.RECORD_AUDIO \
            android.permission.MODIFY_AUDIO_SETTINGS \
            android.permission.POST_NOTIFICATIONS \
            android.permission.VIBRATE \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION; do
            if ! grep -q "$perm" "$MAN"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$perm\" />\n</manifest>|" "$MAN"
            fi
          done

          # Force SDK levels that CI installs (avoid compileSdk 36 without platform)
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' android/variables.gradle
          fi

          grep -q 'ExamImmersivePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'ScreenSharePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'android.permission.VIBRATE' "$MAN"
          echo "OK: plugins + VIBRATE + compileSdk 35"
          cat android/variables.gradle || true

      - name: Capacitor sync
        run: |
          set -euo pipefail
          bunx cap sync android
          # Re-apply SDK pin after sync (cap can rewrite variables)
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' android/variables.gradle
          fi
          chmod +x android/gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages + licenses
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"
          sdkmanager --list_installed | head -40

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          cat variables.gradle || true
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-assemble.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "===== GRADLE FAILURE (last 150 lines) ====="
            tail -n 150 /tmp/gradle-assemble.log
            exit "$STATUS"
          fi

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d4exam-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
