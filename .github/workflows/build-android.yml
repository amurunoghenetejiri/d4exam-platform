name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "native-android/**"
      - "src/lib/screen-share.ts"
      - "capacitor.config.ts"
      - "package.json"
      - "public/**"
      - "src/lib/push.ts"
      - "src/lib/push-send.functions.ts"
      - "src/native/**"
      - "scripts/prepare-capacitor-dist.mjs"
      - "scripts/generate-capacitor-index.mjs"
      - "scripts/generate-android-splash.py"
      - "scripts/assets/**"
      - ".github/workflows/build-android.yml"
      - "DEPLOY_TRIGGER.txt"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build D4EXAM Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit

      - name: Build web application
        run: |
          set -euo pipefail
          npm run build

      - name: Prepare Capacitor dist (fallback assets; shell is Vercel URL)
        run: |
          set -euo pipefail
          if [ -f scripts/prepare-capacitor-dist.mjs ]; then
            node scripts/prepare-capacitor-dist.mjs || true
          fi
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            if [ -d .output/public ]; then
              cp -R .output/public/. dist/
            elif [ -d public ]; then
              cp -R public/. dist/
            fi
          fi
          if [ ! -f dist/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"/><title>D4EXAM</title></head><body><p>Loading…</p></body></html>' > dist/index.html
          fi
          if [ -f public/logo.png ]; then cp -f public/logo.png dist/logo.png; fi
          if [ -f public/offline.html ]; then cp -f public/offline.html dist/offline.html; fi
          echo "dist ready (runtime shell = https://d4exam-platform.vercel.app)"

      - name: Ensure complete Android platform
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Overlay native screen-share + immersive plugins
        run: |
          set -euo pipefail
          if [ -d native-android ]; then
            cp -a native-android/. android/
            echo "Native overlay applied:"
            find android/app/src/main/java -type f | sort
          else
            echo "WARNING: native-android overlay missing"
            exit 1
          fi
          MAN="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'ScreenCaptureService' "$MAN"; then
            sed -i 's|</application>|        <service android:name=".ScreenCaptureService" android:exported="false" android:foregroundServiceType="mediaProjection" />\n    </application>|' "$MAN"
            echo "ScreenCaptureService added to manifest"
          fi
          test -f android/app/src/main/java/com/d4exam/app/ScreenSharePlugin.java
          test -f android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'ScreenSharePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java

      - name: Ensure Android permissions (camera, mic, notifications)
        run: |
          set -euo pipefail
          MAN="android/app/src/main/AndroidManifest.xml"
          test -f "$MAN"
          if ! grep -q 'android.permission.CAMERA' "$MAN"; then
            sed -i 's|android.permission.INTERNET" />|android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />|' "$MAN" || true
          fi
          if ! grep -q 'RECORD_AUDIO' "$MAN"; then
            sed -i 's|android.permission.CAMERA" />|android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MAN" || true
          fi
          if ! grep -q 'POST_NOTIFICATIONS' "$MAN"; then
            sed -i 's|android.permission.INTERNET" />|android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />|' "$MAN" || true
          fi
          if ! grep -q 'FOREGROUND_SERVICE_MEDIA_PROJECTION' "$MAN"; then
            sed -i 's|android.permission.RECORD_AUDIO" />|android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />|' "$MAN" || true
          fi
          if ! grep -q 'android.hardware.camera' "$MAN"; then
            sed -i 's|</manifest>|    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.front" android:required="false" />\n</manifest>|' "$MAN" || true
          fi
          echo "Manifest permissions:"
          grep 'uses-permission' "$MAN" || true

      - name: Install Pillow for launcher + notification icons
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow

      - name: Apply launcher + bold monochrome notification icons
        run: |
          set -euo pipefail
          LOGO="public/logo.png"
          test -f "$LOGO"
          RES="android/app/src/main/res"

          find "$RES" -type f \( -name 'ic_launcher.xml' -o -name 'ic_launcher_round.xml' -o -name 'ic_launcher_foreground.xml' -o -name 'ic_launcher_foreground.png' \) -delete || true
          rm -rf "$RES/mipmap-anydpi-v26" || true

          python3 << 'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          logo = Image.open("public/logo.png").convert("RGBA")
          res = Path("android/app/src/main/res")

          def make_launcher(size: int, dest: Path) -> None:
              inner = max(1, int(size * 0.90))
              scaled = logo.copy()
              scaled.thumbnail((inner, inner), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              ox = (size - scaled.width) // 2
              oy = (size - scaled.height) // 2
              canvas.paste(scaled, (ox, oy), scaled)
              dest.parent.mkdir(parents=True, exist_ok=True)
              canvas.save(dest, format="PNG")

          def make_stat(size: int, dest: Path) -> None:
              inner = max(1, int(size * 0.95))
              scaled = logo.copy()
              scaled.thumbnail((inner, inner), Image.Resampling.LANCZOS)
              alpha = scaled.split()[3]
              alpha = alpha.point(lambda p: 255 if p > 40 else 0)
              for _ in range(2):
                  alpha = alpha.filter(ImageFilter.MaxFilter(3))
              white = Image.new("RGBA", scaled.size, (255, 255, 255, 0))
              white.putalpha(alpha)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              ox = (size - white.width) // 2
              oy = (size - white.height) // 2
              canvas.paste(white, (ox, oy), white)
              dest.parent.mkdir(parents=True, exist_ok=True)
              canvas.save(dest, format="PNG")

          for name, px in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              d = res / f"mipmap-{name}"
              make_launcher(px, d / "ic_launcher.png")
              make_launcher(px, d / "ic_launcher_round.png")

          for name, px in [("mdpi", 24), ("hdpi", 36), ("xhdpi", 48), ("xxhdpi", 72), ("xxxhdpi", 96)]:
              make_stat(px, res / f"drawable-{name}" / "ic_stat_d4exam.png")
          make_stat(48, res / "drawable" / "ic_stat_d4exam.png")
          print("Icons generated: large launcher + bold white ic_stat_d4exam")
          PY

          echo "Generated icons:"
          find "$RES" -name 'ic_stat_d4exam.png' -o -name 'ic_launcher.png' | sort

      - name: Generate branded D4EXAM splash drawables
        run: |
          set -euo pipefail
          python3 scripts/generate-android-splash.py
          echo "Splash assets:"
          find android/app/src/main/res -name 'splash*.png' -o -name 'splash*.xml' 2>/dev/null | sort || true

      - name: Optional google-services.json for FCM (native push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Wrote google-services.json from secret"
          elif [ -f android/app/google-services.json ]; then
            echo "Using committed google-services.json"
          else
            echo "WARNING: No google-services.json — Allow will not crash; FCM token may not register until secret is set"
          fi

      - name: Verify capacitor uses Vercel shell URL
        run: |
          set -euo pipefail
          CFG="capacitor.config.ts"
          if ! grep -F 'd4exam-platform.vercel.app' "$CFG"; then
            echo "FATAL: capacitor.config.ts must point at Vercel production (TanStack Start needs live server functions)"
            exit 1
          fi
          echo "OK: Capacitor server.url points at Vercel production"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept Android licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Capacitor sync Android
        run: |
          set -euo pipefail
          npx cap sync android
          MAN="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.CAMERA' "$MAN"
          grep -q 'android.permission.RECORD_AUDIO' "$MAN"
          grep -q 'ScreenSharePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          echo "OK: CAMERA, RECORD_AUDIO, and ScreenSharePlugin present"

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4EXAM-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
