name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "public/**"
      - "src/lib/push.ts"
      - "src/native/**"
      - "scripts/prepare-capacitor-dist.mjs"
      - "scripts/generate-capacitor-index.mjs"
      - ".github/workflows/build-android.yml"
      - "DEPLOY_TRIGGER.txt"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build D4EXAM Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit

      - name: Build web application
        run: |
          set -euo pipefail
          npm run build

      - name: Prepare Capacitor dist (local shell — no Vercel)
        run: |
          set -euo pipefail
          node scripts/prepare-capacitor-dist.mjs
          test -f dist/index.html
          test -d dist/assets
          if grep -R "d4exam-platform.vercel.app" dist/index.html dist/offline.html 2>/dev/null; then
            echo "FATAL: Vercel URL leaked into bundled shell"
            exit 1
          fi
          ls -la dist/index.html dist/offline.html dist/assets | head -30

      - name: Ensure complete Android platform
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Verify capacitor config has no Vercel shell URL
        run: |
          set -euo pipefail
          CFG="capacitor.config.ts"
          if grep -q 'server.url' "$CFG" && grep -q 'd4exam-platform.vercel.app' "$CFG"; then
            echo "FATAL: server.url still points at Vercel — local shell required"
            exit 1
          fi
          echo "OK: capacitor.config has no Vercel server.url"

      - name: Apply D4EXAM permissions and branding
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for perm in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.CAMERA android.permission.RECORD_AUDIO android.permission.POST_NOTIFICATIONS android.permission.VIBRATE android.permission.RECEIVE_BOOT_COMPLETED; do
            if ! grep -q "$perm" "$MANIFEST"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$perm\" />\n</manifest>|" "$MANIFEST"
            fi
          done
          if [ -f android/app/build.gradle ]; then
            sed -i 's/versionCode .*/versionCode 10/' android/app/build.gradle || true
            sed -i 's/versionName .*/versionName "3.0.0"/' android/app/build.gradle || true
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p artifacts && cp "$APK" artifacts/D4EXAM-debug.apk

      - name: Upload D4EXAM Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4EXAM-Android-APK
          path: artifacts/D4EXAM-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### D4EXAM Android APK — local bundled shell" >> "$GITHUB_STEP_SUMMARY"
          echo "- No server.url (does not load Vercel as app shell)" >> "$GITHUB_STEP_SUMMARY"
          echo "- webDir=dist with generated index.html + assets" >> "$GITHUB_STEP_SUMMARY"
          echo "- Supabase used online for auth/sync when network available" >> "$GITHUB_STEP_SUMMARY"
