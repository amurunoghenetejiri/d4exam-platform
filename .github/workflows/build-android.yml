name: Build Android APK (local SPA)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "capacitor.config.*"
      - "scripts/prepare-capacitor-dist.mjs"
      - "vite.capacitor.config.ts"
      - "src/capacitor-main.tsx"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: Build local Capacitor SPA (no Vercel)
        run: bun run build:app
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify local SPA (no server.url)
        run: |
          set -e
          test -f dist/index.html
          test -d dist/assets
          if grep -q '"url"' capacitor.config.json 2>/dev/null; then
            echo "ERROR: server.url must not be set in capacitor.config.json"
            cat capacitor.config.json
            exit 1
          fi
          if grep -E 'url:\s*["'\'']https?://' capacitor.config.ts 2>/dev/null; then
            echo "ERROR: server.url must not point at a remote URL"
            exit 1
          fi
          echo "OK: local SPA present, no remote server.url"
          ls -la dist/
          ls -la dist/assets/ | head -20

      - name: Capacitor sync
        run: bunx cap sync android

      # Capacitor 8 / AGP 8.13 require Java 21 (see capacitor.build.gradle)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36 + build-tools + accept licenses
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdkmanager --list_installed | head -40

      - name: Bootstrap Gradle wrapper if missing
        working-directory: android
        run: |
          set -e
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle 8.14.3 wrapper…"
            curl -sL -o /tmp/gradle-8.14.3-bin.zip \
              "https://services.gradle.org/distributions/gradle-8.14.3-bin.zip"
            unzip -q -o /tmp/gradle-8.14.3-bin.zip -d /tmp
            /tmp/gradle-8.14.3/bin/gradle wrapper \
              --gradle-version 8.14.3 \
              --distribution-type all
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Assemble debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -e
          # Point Gradle at the SDK if local.properties is absent
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d4exam-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
