name: Restore live-monitor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-live-monitor.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore officer live-monitor from good commit
        run: |
          set -e
          GOOD=0c3987c
          git show "$GOOD:src/routes/officer.live-monitor.tsx" > src/routes/officer.live-monitor.tsx
          wc -l src/routes/officer.live-monitor.tsx
          head -3 src/routes/officer.live-monitor.tsx
          # Ensure not PLACEHOLDER
          if grep -q '^SEE_FILE\|^PLACEHOLDER' src/routes/officer.live-monitor.tsx; then
            echo "Restore failed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/officer.live-monitor.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(officer): restore full live-monitor after PLACEHOLDER wipe"
            git push
          fi
