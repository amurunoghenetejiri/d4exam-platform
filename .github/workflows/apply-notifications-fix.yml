name: Apply notifications fix patch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-notifications-fix.yml"
      - "patches/notif_part_aa.b64"
      - "patches/notif_part_ab.b64"
      - "patches/notif_part_ac.b64"
      - "patches/notif_part_ad.b64"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and apply patch
        run: |
          set -e
          python3 << 'PY2'
          import base64, pathlib
          parts = ["patches/notif_part_aa.b64", "patches/notif_part_ab.b64", "patches/notif_part_ac.b64", "patches/notif_part_ad.b64"]
          data = b""
          for p in parts:
            data += base64.b64decode(pathlib.Path(p).read_text().strip())
          pathlib.Path("/tmp/notif.patch").write_bytes(data)
          print("patch bytes", len(data))
          PY2
          git apply --whitespace=nowarn /tmp/notif.patch || git apply --3way --whitespace=nowarn /tmp/notif.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(notifications): settings persist + delivery for all roles"
            git push
          fi
