name: Restore officer pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore from last good commit and harden
        run: |
          set -e
          # Last known-good app commit before PLACEHOLDER overwrite
          GOOD=d1c7a9198f0b0b72cfa00ea2fc7d33bfd0ee490e
          git checkout "$GOOD" -- src/routes/officer.approvals.tsx src/routes/officer.live-monitor.tsx
          python3 <<'PY'
          from pathlib import Path

          # --- approvals ---
          p = Path("src/routes/officer.approvals.tsx")
          t = p.read_text()
          assert "PLACEHOLDER" not in t and "createFileRoute" in t

          helper = '''
          function courseCode(item: { courses?: unknown }): string {
            const c = item.courses;
            if (!c) return "—";
            if (Array.isArray(c)) {
              const first = c[0] as { code?: string; name?: string } | undefined;
              return first?.code ?? "—";
            }
            if (typeof c === "object") {
              return String((c as { code?: string }).code ?? "—");
            }
            return "—";
          }

          function courseName(item: { courses?: unknown }): string {
            const c = item.courses;
            if (!c) return "Course";
            if (Array.isArray(c)) {
              const first = c[0] as { code?: string; name?: string } | undefined;
              return first?.name ?? "Course";
            }
            if (typeof c === "object") {
              return String((c as { name?: string }).name ?? "Course");
            }
            return "Course";
          }

          '''

          if "function courseCode(" not in t:
              t = t.replace(
                  "  courses: { code: string; name: string } | null;\n};\n\nfunction toLocalInput",
                  "  courses: { code: string; name: string } | { code: string; name: string }[] | null;\n};\n\n" + helper + "function toLocalInput",
                  1,
              )

          t = t.replace('{item.courses?.code ?? "—"} · {item.courses?.name ?? "Course"}', '{courseCode(item)} · {courseName(item)}')
          t = t.replace('{item.courses?.code ?? "—"}', '{courseCode(item)}')
          t = t.replace('{selected?.title} · {selected?.courses?.code} · {selected?.duration_minutes} min', '{selected?.title} · {selected ? courseCode(selected) : "—"} · {selected?.duration_minutes} min')

          old_throw = "      if (error) throw error;"
          new_throw = """      if (error) {
                  console.warn("[officer.approvals] update exam", error);
                  toast.error(error.message || "Could not update examination. Try again.");
                  return;
                }"""
          if old_throw in t:
              t = t.replace(old_throw, new_throw, 1)

          if 'console.warn("[officer-approvals] qcounts"' not in t:
              t = t.replace(
                  """      const { data } = await supabase
                  .from("questions")
                  .select("course_id")
                  .eq("school_id", schoolId)
                  .eq("status", "active")
                  .in("course_id", courseIds);
                const map: Record<string, number> = {};
                for (const q of data ?? []) {
                  const c = (q as { course_id: string }).course_id;
                  map[c] = (map[c] ?? 0) + 1;
                }
                return map;""",
                  """      const { data, error } = await supabase
                  .from("questions")
                  .select("course_id")
                  .eq("school_id", schoolId)
                  .eq("status", "active")
                  .in("course_id", courseIds);
                if (error) {
                  console.warn("[officer-approvals] qcounts", error);
                  return {} as Record<string, number>;
                }
                const map: Record<string, number> = {};
                for (const q of data ?? []) {
                  const c = (q as { course_id: string }).course_id;
                  map[c] = (map[c] ?? 0) + 1;
                }
                return map;""",
              )

          p.write_text(t)
          print("approvals ok", len(t))

          # --- live-monitor ---
          p2 = Path("src/routes/officer.live-monitor.tsx")
          t2 = p2.read_text()
          assert "PLACEHOLDER" not in t2 and "createFileRoute" in t2

          t2 = t2.replace(
              "type IntegrityEvent = {\n  id: string;\n  event_type: string;\n  severity: string | null;",
              "type IntegrityEvent = {\n  id: string;\n  event_type: string | null;\n  severity: string | null;",
          )

          t2 = t2.replace(
              "examinations: { title: string; status: string; courses: { code: string; name?: string } | null } | null;\n  students: {\n    full_name?: string | null;\n    matric_number: string | null;\n    student_id: string | null;\n    profiles?: { full_name: string | null } | null;\n  } | null;",
              "examinations: { title: string; status: string; courses: { code: string; name?: string } | { code: string; name?: string }[] | null } | null;\n  students: {\n    full_name?: string | null;\n    matric_number: string | null;\n    student_id: string | null;\n    profiles?: { full_name: string | null } | { full_name: string | null }[] | null;\n  } | null;",
          )

          old_name = '''function studentDisplayName(a: AttemptRow): string {
    const fromMeta = nameFromMetadata(a.metadata);
    if (fromMeta) return fromMeta;
    const fromStudent = String(a.students?.full_name || "").trim();
    if (fromStudent) return fromStudent;
    const fromProfile = String(a.students?.profiles?.full_name || "").trim();
    if (fromProfile) return fromProfile;
    return a.students?.matric_number || a.students?.student_id || "Student";
  }'''

          new_name = '''function profileFullName(profiles: unknown): string {
    if (!profiles) return "";
    if (Array.isArray(profiles)) {
      const first = profiles[0] as { full_name?: string | null } | undefined;
      return String(first?.full_name || "").trim();
    }
    if (typeof profiles === "object") {
      return String((profiles as { full_name?: string | null }).full_name || "").trim();
    }
    return "";
  }

  function courseCodeFromExam(courses: unknown): string {
    if (!courses) return "—";
    if (Array.isArray(courses)) {
      const first = courses[0] as { code?: string } | undefined;
      return first?.code || "—";
    }
    if (typeof courses === "object") {
      return String((courses as { code?: string }).code || "—");
    }
    return "—";
  }

  function studentDisplayName(a: AttemptRow): string {
    const fromMeta = nameFromMetadata(a.metadata);
    if (fromMeta) return fromMeta;
    const fromStudent = String(a.students?.full_name || "").trim();
    if (fromStudent) return fromStudent;
    const fromProfile = profileFullName(a.students?.profiles);
    if (fromProfile) return fromProfile;
    return a.students?.matric_number || a.students?.student_id || "Student";
  }'''

          if "function profileFullName" not in t2:
              t2 = t2.replace(old_name, new_name)

          t2 = t2.replace(
              'const course = a.examinations?.courses?.code || "—";',
              'const course = courseCodeFromExam(a.examinations?.courses);',
          )
          t2 = t2.replace(
              '`${(liveExams[0].courses as { code?: string } | null)?.code ?? ""} · ${liveExams[0].title}`',
              '`${courseCodeFromExam(liveExams[0].courses)} · ${liveExams[0].title}`',
          )

          p2.write_text(t2)
          print("live-monitor ok", len(t2))
          assert "PLACEHOLDER" not in t2
          PY
          git config user.name "restore-bot"
          git config user.email "bot@d4exam.local"
          git add src/routes/officer.approvals.tsx src/routes/officer.live-monitor.tsx
          git status
          git commit -m "fix: restore + harden officer live-monitor and approvals (null-safe)" || echo "no change"
          git push
