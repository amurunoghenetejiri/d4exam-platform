name: CBT fullscreen + scrollable layout
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch CBT session, statusBar, styles
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          # ---- statusBar.ts ----
          Path("src/native/statusBar.ts").write_text('''/**\n * Android status bar theming for Capacitor.\n * During CBT exams, enterExamImmersive() hides status + navigation bars.\n */\nimport { isNativeShell } from \"@/native/platform\";\n\nexport const D4EXAM_STATUS_BAR = \"#0b1b3a\";\n\nfunction setImmersiveCss(on: boolean) {\n  if (typeof document === \"undefined\") return;\n  try {\n    document.documentElement.classList.toggle(\"d4-exam-immersive\", on);\n    document.body.classList.toggle(\"d4-exam-immersive\", on);\n  } catch {\n    /* ignore */\n  }\n}\n\nexport async function applyNativeStatusBar(): Promise<void> {\n  if (!isNativeShell()) return;\n  try {\n    const { StatusBar, Style } = await import(\"@capacitor/status-bar\");\n    await StatusBar.setOverlaysWebView({ overlay: false });\n    await StatusBar.setBackgroundColor({ color: D4EXAM_STATUS_BAR });\n    await StatusBar.setStyle({ style: Style.Dark });\n    await StatusBar.show();\n  } catch (e) {\n    console.warn(\"[D4EXAM] StatusBar plugin unavailable\", e);\n  }\n}\n\n/** Hide system chrome during a locked CBT session (status bar + best-effort nav). */\nexport async function enterExamImmersive(): Promise<void> {\n  setImmersiveCss(true);\n\n  if (isNativeShell()) {\n    try {\n      const { StatusBar } = await import(\"@capacitor/status-bar\");\n      try {\n        await StatusBar.setOverlaysWebView({ overlay: true });\n      } catch {\n        /* older plugin */\n      }\n      await StatusBar.hide();\n    } catch (e) {\n      console.warn(\"[D4EXAM] enterExamImmersive StatusBar\", e);\n    }\n  }\n\n  try {\n    const el = document.documentElement as HTMLElement & {\n      requestFullscreen?: () => Promise<void>;\n      webkitRequestFullscreen?: () => void;\n    };\n    if (!document.fullscreenElement) {\n      if (el.requestFullscreen) await el.requestFullscreen();\n      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();\n    }\n  } catch {\n    /* blocked by policy */\n  }\n}\n\n/** Restore normal status bar after exam ends or is left. */\nexport async function exitExamImmersive(): Promise<void> {\n  setImmersiveCss(false);\n  try {\n    if (document.fullscreenElement) await document.exitFullscreen?.();\n  } catch {\n    /* ignore */\n  }\n  if (!isNativeShell()) return;\n  try {\n    const { StatusBar, Style } = await import(\"@capacitor/status-bar\");\n    try {\n      await StatusBar.setOverlaysWebView({ overlay: false });\n    } catch {\n      /* older plugin */\n    }\n    await StatusBar.setBackgroundColor({ color: D4EXAM_STATUS_BAR });\n    await StatusBar.setStyle({ style: Style.Dark });\n    await StatusBar.show();\n  } catch (e) {\n    console.warn(\"[D4EXAM] exitExamImmersive\", e);\n  }\n}\n\nexport async function hideSplashSafely(): Promise<void> {\n  if (!isNativeShell()) return;\n  try {\n    const { SplashScreen } = await import(\"@capacitor/splash-screen\");\n    await SplashScreen.hide({ fadeOutDuration: 200 });\n  } catch {\n    /* ignore */\n  }\n}\n''')

          p = Path("src/components/cbt/CbtExamSession.impl.tsx")
          c = p.read_text()

          old_fs = '''      if (security.fullscreen) {\n        const ok = await requestExamFullscreen();\n        if (!ok) { toast.message("Please allow fullscreen to continue the exam"); setFsGate(true); }\n      }'''
          new_fs = '''      // Always immersive during active CBT: hide phone status + system chrome.\n      {\n        const ok = await requestExamFullscreen();\n        if (security.fullscreen && !ok) {\n          toast.message("Please allow fullscreen to continue the exam");\n          setFsGate(true);\n        }\n      }'''
          if old_fs in c:
              c = c.replace(old_fs, new_fs)
              print("fullscreen block patched")
          else:
              print("WARN: fullscreen block missing")

          marker = '''  useEffect(() => {\n    if (done) {\n      shutdownMedia();\n      setFsGate(false);\n      setPaused(false);\n      void leaveExamFullscreen();\n    }\n  }, [done, shutdownMedia]);'''
          inject = marker + '''\n\n  // Re-assert immersive chrome while the exam is active.\n  useEffect(() => {\n    if (!started || done) return;\n    void enterExamImmersive();\n    const t = window.setInterval(() => {\n      void enterExamImmersive();\n    }, 8000);\n    return () => window.clearInterval(t);\n  }, [started, done]);'''
          if "Re-assert immersive chrome" not in c and marker in c:
              c = c.replace(marker, inject)
              print("immersive reassert patched")
          else:
              print("immersive reassert skip")

          old_root = '<div className="flex min-h-dvh flex-col bg-slate-50 select-none">'
          new_root = '<div className="d4-cbt-exam fixed inset-0 z-[100] flex h-[100dvh] max-h-[100dvh] flex-col overflow-hidden bg-slate-50 select-none">'
          if old_root in c:
              c = c.replace(old_root, new_root, 1)
              print("root shell patched")

          c = c.replace(
              '<div className="bg-amber-500 px-3 py-1.5 text-center text-xs font-bold text-white">',
              '<div className="shrink-0 bg-amber-500 px-3 py-1.5 text-center text-xs font-bold text-white">',
              1,
          )

          old_header = '<header className="fixed inset-x-0 top-0 z-40 border-b border-slate-200 bg-[#0b1b3a] text-white">'
          new_header = '<header className="d4-cbt-header relative z-40 shrink-0 border-b border-slate-200 bg-[#0b1b3a] text-white">'
          if old_header in c:
              c = c.replace(old_header, new_header, 1)
              print("header patched")

          c = c.replace(
              'className="mx-auto flex h-16 max-w-[1200px] items-center justify-between gap-3 px-3 sm:px-6"',
              'className="mx-auto flex h-14 max-w-[1200px] items-center justify-between gap-3 px-3 sm:h-16 sm:px-6"',
              1,
          )

          old_grid = '<div className="mx-auto grid w-full max-w-[1200px] flex-1 grid-cols-1 gap-4 p-3 pt-[calc(4rem+0.75rem)] sm:p-6 sm:pt-[calc(4rem+1.5rem)] lg:grid-cols-[220px_1fr]">'
          new_grid = '''<div className="min-h-0 flex-1 overflow-y-auto overscroll-contain [-webkit-overflow-scrolling:touch]">\n      <div className="mx-auto grid w-full max-w-[1200px] grid-cols-1 gap-4 p-3 pb-8 sm:p-6 lg:grid-cols-[220px_1fr]">'''
          if old_grid in c:
              c = c.replace(old_grid, new_grid, 1)
              print("scroll grid patched")

          old_close = '''        </section>\n      </div>\n      {started && !done && security.requireCamera && ('''
          new_close = '''        </section>\n      </div>\n      </div>\n      {started && !done && security.requireCamera && ('''
          if old_close in c and new_close not in c:
              c = c.replace(old_close, new_close, 1)
              print("scroll wrapper closed")

          c = c.replace(
              'className="fixed inset-x-0 top-16 z-[150] flex justify-center px-3 pointer-events-none"',
              'className="fixed inset-x-0 top-14 z-[150] flex justify-center px-3 pointer-events-none sm:top-16"',
              1,
          )

          p.write_text(c)
          print("CbtExamSession.impl.tsx written", len(c.splitlines()), "lines")

          css = Path("src/styles.css").read_text()
          block = '''/* CBT exam: full viewport; body locked; content scrolls inside .d4-cbt-exam */\nhtml.d4-exam-immersive,\nbody.d4-exam-immersive {\n  overscroll-behavior: none;\n  height: 100%;\n  max-height: 100dvh;\n  overflow: hidden !important;\n}\nhtml.d4-exam-immersive .d4-cbt-exam {\n  height: 100dvh;\n  max-height: 100dvh;\n  width: 100%;\n}\nhtml.d4-exam-immersive .d4-cbt-header,\nhtml.d4-exam-immersive header.d4-cbt-header {\n  padding-top: 0 !important;\n  background-color: #0b1b3a !important;\n}\n'''
          old = "html.d4-exam-immersive, body.d4-exam-immersive { overscroll-behavior: none; min-height: 100dvh; }"
          if old in css:
              css = css.replace(old, block)
          elif "html.d4-exam-immersive .d4-cbt-exam" not in css:
              css += "\n" + block
          css = css.replace(
              "html.d4-exam-immersive header.fixed {\n  background-color: #0b1b3a !important;\n}",
              "html.d4-exam-immersive header.fixed,\nhtml.d4-exam-immersive .d4-cbt-header {\n  background-color: #0b1b3a !important;\n  padding-top: 0 !important;\n}",
          )
          Path("src/styles.css").write_text(css)
          Path("DEPLOY_TRIGGER.txt").write_text("cbt-fullscreen-scroll-2026-08-25\n")
          print("styles + trigger done")
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.app"
          git add src/components/cbt/CbtExamSession.impl.tsx src/native/statusBar.ts src/styles.css DEPLOY_TRIGGER.txt
          git diff --cached --stat
          git commit -m "fix(cbt): full-screen immersive exam + scrollable content" || echo "no changes"
          git push
