name: Apply CBT engine fix

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-cbt-fix.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire immersive fullscreen into exam session
        run: |
          set -eux
          f=src/components/cbt/CbtExamSession.impl.tsx
          if ! grep -q enterExamImmersive "$f"; then
            # add import after statusBar-related imports or near other native imports
            if grep -q 'from "@/native/statusBar"' "$f"; then
              echo 'import already present path'
            else
              sed -i '1a import { enterExamImmersive, exitExamImmersive } from "@/native/statusBar";' "$f"
            fi
            # enhance requestExamFullscreen body
            python3 << 'PY'
from pathlib import Path
p = Path("src/components/cbt/CbtExamSession.impl.tsx")
c = p.read_text()
if "enterExamImmersive" not in c:
    # insert import after first import block line with lucide or react
    lines = c.splitlines(True)
    out = []
    inserted = False
    for line in lines:
        out.append(line)
        if (not inserted) and line.startswith("import ") and "statusBar" not in line and "lucide" in line:
            out.append('import { enterExamImmersive, exitExamImmersive } from "@/native/statusBar";\n')
            inserted = True
    if not inserted:
        out.insert(0, 'import { enterExamImmersive, exitExamImmersive } from "@/native/statusBar";\n')
    c = "".join(out)

# Patch requestExamFullscreen to call enterExamImmersive
old = """async function requestExamFullscreen(): Promise<boolean> {
  if (typeof document === "undefined") return false;
  if (document.fullscreenElement) return true;
  try {
    await document.documentElement.requestFullscreen?.();
  } catch { /* blocked */ }
  return Boolean(document.fullscreenElement);
}"""
new = """async function requestExamFullscreen(): Promise<boolean> {
  if (typeof document === "undefined") return false;
  try { await enterExamImmersive(); } catch { /* ignore */ }
  if (document.fullscreenElement) return true;
  try {
    await document.documentElement.requestFullscreen?.();
  } catch { /* blocked */ }
  return Boolean(document.fullscreenElement);
}"""
if old in c:
    c = c.replace(old, new)
    print("patched requestExamFullscreen")
else:
    print("requestExamFullscreen pattern not exact — skip body patch")

# On finish / done paths, call exitExamImmersive when exiting fullscreen
if "exitExamImmersive" in c and "await exitExamImmersive" not in c:
    c = c.replace(
        "if (document.fullscreenElement) void document.exitFullscreen?.().catch(() => {});",
        "void exitExamImmersive().catch(() => {});\n    if (document.fullscreenElement) void document.exitFullscreen?.().catch(() => {});",
    )
    print("patched exit paths")

p.write_text(c)
print("session markers", "enterExamImmersive" in c, "exitExamImmersive" in c)
PY
          fi
          date -u +'redeploy %Y%m%d%H%M%S cbt-immersive-wire' > DEPLOY_TRIGGER.txt
          git config user.name d4exam-bot
          git config user.email bot@d4exam.app
          git add -A
          git commit -m 'fix(cbt): wire enterExamImmersive/exitExamImmersive in session' || exit 0
          git push origin HEAD:main
