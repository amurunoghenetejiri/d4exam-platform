name: Apply CBT engine fix

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run"
        required: false
        default: "restore"

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore styles + immersive
        run: |
          set -e
          git show 0c3a012b7149f970cf40c0f2f18545a62b2d580f:src/styles.css > src/styles.css
          if ! grep -q d4-exam-immersive src/styles.css; then
            printf '\n/* CBT immersive */\nhtml.d4-exam-immersive,\nbody.d4-exam-immersive {\n  overscroll-behavior: none;\n  min-height: 100dvh;\n}\n' >> src/styles.css
          fi
          wc -c src/styles.css

      - name: Restore and shrink ExamCameraPip
        run: |
          set -e
          git show 0c3a012b7149f970cf40c0f2f18545a62b2d580f:src/components/cbt/ExamCameraPip.tsx > src/components/cbt/ExamCameraPip.tsx
          python3 -c "
from pathlib import Path
p = Path('src/components/cbt/ExamCameraPip.tsx')
c = p.read_text()
c = c.replace('w-[132px]', 'w-[72px]').replace('sm:w-[150px]', 'sm:w-[88px]')
c = c.replace('rounded-xl border border-white/20', 'rounded-lg border border-white/25')
c = c.replace('shadow-xl', 'shadow-lg')
c = c.replace('aspect-[3/4]', 'aspect-[4/5]')
c = c.replace('Camera active', 'Cam')
p.write_text(c)
assert 'w-[72px]' in c and 'PLACEHOLDER' not in c
print('pip ok', len(c))
"

      - name: Teacher maxQuestions
        run: |
          python3 -c "
from pathlib import Path
p = Path('src/routes/teacher.examinations.tsx')
c = p.read_text()
old = 'maxQuestions: null,'
if old not in c:
  print('skip teacher')
else:
  c = c.replace(old, 'maxQuestions: questionsToAnswer > 0 ? questionsToAnswer : null,', 1)
  c = c.replace(old, 'maxQuestions: (meta.questionsToAnswer and meta.questionsToAnswer > 0) and meta.questionsToAnswer or None,'.replace('and', '&&').replace('or None', ': null').replace('meta.questionsToAnswer && meta.questionsToAnswer > 0 && meta.questionsToAnswer', '(meta.questionsToAnswer && meta.questionsToAnswer > 0) ? meta.questionsToAnswer'))
"

      - name: Teacher maxQuestions v2
        run: |
          python3 << 'PY'
from pathlib import Path
p = Path("src/routes/teacher.examinations.tsx")
c = p.read_text()
old = "maxQuestions: null,"
if old not in c:
    print("skip")
else:
    c = c.replace(old, "maxQuestions: questionsToAnswer > 0 ? questionsToAnswer : null,", 1)
    c = c.replace(old, "maxQuestions: (meta.questionsToAnswer && meta.questionsToAnswer > 0) ? meta.questionsToAnswer : null,")
    p.write_text(c)
    print("teacher ok")
PY

      - name: Deploy trigger
        run: echo "redeploy $(date -u +%Y%m%d%H%M%S) cbt-fix-workflow" > DEPLOY_TRIGGER.txt

      - name: Commit and push
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.app"
          git add -A
          git status
          git commit -m "fix(cbt): restore styles+PiP, shrink camera, teacher maxQuestions" || exit 0
          git push origin HEAD:main
