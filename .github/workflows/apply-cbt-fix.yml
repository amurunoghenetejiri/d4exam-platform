name: Apply CBT engine fix

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-cbt-fix.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore files
        run: |
          set -eux
          git show 0c3a012b7149f970cf40c0f2f18545a62b2d580f:src/styles.css > src/styles.css
          echo '' >> src/styles.css
          echo 'html.d4-exam-immersive, body.d4-exam-immersive { overscroll-behavior: none; min-height: 100dvh; }' >> src/styles.css
          git show 0c3a012b7149f970cf40c0f2f18545a62b2d580f:src/components/cbt/ExamCameraPip.tsx > src/components/cbt/ExamCameraPip.tsx
          sed -i 's/w-\[132px\]/w-[72px]/g' src/components/cbt/ExamCameraPip.tsx
          sed -i 's/sm:w-\[150px\]/sm:w-[88px]/g' src/components/cbt/ExamCameraPip.tsx
          sed -i 's/aspect-\[3\/4\]/aspect-[4\/5]/g' src/components/cbt/ExamCameraPip.tsx
          grep -q 'w-\[72px\]' src/components/cbt/ExamCameraPip.tsx
          ! grep -q PLACEHOLDER src/components/cbt/ExamCameraPip.tsx
          sed -i '0,/maxQuestions: null,/s//maxQuestions: questionsToAnswer > 0 ? questionsToAnswer : null,/' src/routes/teacher.examinations.tsx || true
          sed -i 's/maxQuestions: null,/maxQuestions: (meta.questionsToAnswer \&\& meta.questionsToAnswer > 0) ? meta.questionsToAnswer : null,/' src/routes/teacher.examinations.tsx || true
          date -u +'redeploy %Y%m%d%H%M%S cbt-fix-workflow' > DEPLOY_TRIGGER.txt
          git config user.name d4exam-bot
          git config user.email bot@d4exam.app
          git add -A
          git commit -m 'fix(cbt): restore styles+PiP, shrink camera, teacher maxQuestions' || exit 0
          git push origin HEAD:main
