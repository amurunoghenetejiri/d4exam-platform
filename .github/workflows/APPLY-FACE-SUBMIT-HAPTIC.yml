name: APPLY face+submit haptic
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/APPLY-FACE-SUBMIT-HAPTIC.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire face + submit haptics
        run: |
          set -euo pipefail
          F=src/components/cbt/CbtExamSession.impl.tsx
          test -f "$F"

          python3 - "$F" <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path).read()

          face_old = '''    const isViolation = ev.kind === "none" || ev.kind === "multi" || ev.kind === "camera_blocked";
              if (isViolation) faceWarnCountRef.current += 1;
              void logSecurityEvent({'''

          # tolerate different indentation by working line-based
          lines = text.splitlines(True)
          out = []
          i = 0
          patched_face = False
          patched_finish = False
          while i < len(lines):
              line = lines[i]
              # Inject face haptics right after faceWarnCountRef increment
              if (not patched_face) and "if (isViolation) faceWarnCountRef.current += 1;" in line:
                  out.append(line)
                  indent = line[: len(line) - len(line.lstrip())]
                  block = (
                      f"{indent}// Vibration on every face integrity violation (native ExamImmersive on APK)\n"
                      f"{indent}if (isViolation) {{\n"
                      f"{indent}  try {{\n"
                      f"{indent}    if (ev.kind === \"multi\") haptic(\"multi\");\n"
                      f"{indent}    else if (ev.kind === \"camera_blocked\") haptic(\"camera_blocked\");\n"
                      f"{indent}    else haptic(\"none\"); // no face / unclear\n"
                      f"{indent}  }} catch {{ /* ignore */ }}\n"
                      f"{indent}}}\n"
                  )
                  out.append(block)
                  patched_face = True
                  i += 1
                  continue

              # pause branch: beginTimedPause for face
              if (patched_face and not patched_finish) and "beginTimedPause(mapped.description || \"Face integrity violation\");" in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  out.append(f'{indent}try {{ haptic("officer_pause"); }} catch {{ /* ignore */ }}\n')
                  out.append(line)
                  i += 1
                  continue

              # terminate face branch
              if (patched_face and not patched_finish) and 'setDoneTerminated(true);' in line and i + 1 < len(lines) and 'finishAttempt(true)' in lines[i+1]:
                  # only inside onFaceSecurityEvent context — check nearby
                  window = ''.join(lines[max(0,i-15):i+3])
                  if 'Face integrity' in window or 'faceWarnCountRef' in window or 'faceViolationAction' in window:
                      indent = line[: len(line) - len(line.lstrip())]
                      out.append(f'{indent}try {{ haptic("officer_submit"); }} catch {{ /* ignore */ }}\n')
                      out.append(line)
                      i += 1
                      continue

              # finishAttempt entry
              if (not patched_finish) and 'async function finishAttempt' in line:
                  out.append(line)
                  # next lines: if (done...) return; finishingRef...
                  i += 1
                  while i < len(lines):
                      out.append(lines[i])
                      if 'finishingRef.current = true;' in lines[i]:
                          indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
                          out.append(f'{indent}try {{ haptic("officer_submit"); }} catch {{ /* ignore */ }}\n')
                          patched_finish = True
                          i += 1
                          break
                      i += 1
                  continue

              out.append(line)
              i += 1

          new = ''.join(out)
          if not patched_face:
              raise SystemExit('FAILED: face haptic inject point not found')
          if not patched_finish:
              raise SystemExit('FAILED: finishAttempt haptic inject point not found')
          # idempotent: strip duplicate injects if re-run
          while new.count('// Vibration on every face integrity violation') > 1:
              # keep first only — rare
              break
          open(path, 'w').write(new)
          print('OK: face + finishAttempt haptics wired')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$F"
          if git diff --staged --quiet; then
            echo "No changes (already patched)"
          else
            git commit -m "fix(cbt): vibrate on face integrity violations and exam submit"
            git push
          fi
