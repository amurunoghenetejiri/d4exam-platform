name: run-screen-share-patch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/patch_screen_share.py
      - .github/workflows/run-screen-share-patch.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch script
        run: python3 scripts/patch_screen_share.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/live-video.ts src/components/cbt/ExamSecurityGate.tsx src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "feat(screen-share): CBT share, pause on stop, officer face+screen view"
            git push
          fi
