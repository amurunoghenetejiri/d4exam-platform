name: Restore safe integrity
on:
  push:
    paths:
      - scripts/restore_and_safe_integrity.py
      - .github/workflows/restore-safe-integrity.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_and_safe_integrity.py
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          if git diff --staged --quiet; then echo No changes; else git commit -m "fix: restore pages load + keep safe pause/timer integrity"; git push; fi
