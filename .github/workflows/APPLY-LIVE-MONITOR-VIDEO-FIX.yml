name: APPLY-LIVE-MONITOR-VIDEO-FIX
on:
  push:
    paths:
      - "scripts/fixed_parts_live_video/**"
      - "scripts/apply_live_monitor_video_fix.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply live monitor video fix
        run: python3 scripts/apply_live_monitor_video_fix.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx || true
          git diff --staged --quiet || git commit -m "apply: live monitor video + CBT attemptId heartbeat"
          git push || true
