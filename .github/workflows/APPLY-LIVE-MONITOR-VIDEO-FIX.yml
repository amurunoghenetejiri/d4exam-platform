name: APPLY-LIVE-MONITOR-VIDEO-FIX
on:
  push:
    paths:
      - "scripts/patch_cbt_attemptid.py"
      - "scripts/patch_live_monitor_video.py"
      - ".github/workflows/APPLY-LIVE-MONITOR-VIDEO-FIX.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply surgical patches
        run: |
          python3 scripts/patch_cbt_attemptid.py
          python3 scripts/patch_live_monitor_video.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx || true
          git diff --staged --quiet || git commit -m "apply: live monitor video discovery + CBT attemptId"
          git push || true
