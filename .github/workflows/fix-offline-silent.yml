name: fix-offline-silent
on:
  workflow_dispatch:
  push:
    paths: ["scripts/fix-offline-silent.py"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-offline-silent.py
      - run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          if git diff --staged --quiet; then echo ok; else git commit -m "fix: silent offline send (no internet toast)" && git push; fi
