name: FIX-SCREEN-HOLD
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/FIX-SCREEN-HOLD.yml
      - scripts/patch_build_android_manifest.py
      - scripts/patch_ss_hold.py
      - scripts/patch_switch_active_guard.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/patch_build_android_manifest.py
          python3 scripts/patch_ss_hold.py
          python3 scripts/patch_switch_active_guard.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-android.yml src/lib/screen-share.ts src/components/settings/SwitchAccountCard.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix: retain task on screen share + switch active guard"
            git push
          fi
