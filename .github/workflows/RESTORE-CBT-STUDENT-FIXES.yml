name: RESTORE-CBT-STUDENT-FIXES
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/RESTORE-CBT-STUDENT-FIXES.yml
      - scripts/apply_student_cbt_fix.py
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply student + CBT fixes
        run: python3 scripts/apply_student_cbt_fix.py
      - name: Verify
        run: |
          set -euo pipefail
          ! grep -q PLACEHOLDER src/routes/student.examinations.tsx
          ! grep -q PLACEHOLDER src/routes/student.index.tsx
          grep -q isExamAttemptFinished src/routes/student.index.tsx
          grep -q isExamAttemptFinished src/routes/student.examinations.tsx
          grep -q holdExamScreenShare src/components/cbt/CbtExamSession.impl.tsx
          grep -q priorAttemptQ src/components/cbt/CbtExamSession.impl.tsx
          grep -q alreadyFinished src/components/cbt/CbtExamSession.impl.tsx
          echo verify ok
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "D4EXAM Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/student.index.tsx src/routes/student.examinations.tsx src/components/cbt/CbtExamSession.impl.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(cbt): restore student availability, retake guard, screen-share hold, exam scroll"
            git push
          fi
