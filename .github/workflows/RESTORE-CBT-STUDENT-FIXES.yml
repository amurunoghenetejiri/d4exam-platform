name: RESTORE-CBT-STUDENT-FIXES
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/RESTORE-CBT-STUDENT-FIXES.yml
      - scripts/exam_part*.b64
      - scripts/index_part*.b64
      - scripts/cbt_part*.b64
      - scripts/exam_assemble.py
      - scripts/index_assemble.py
      - scripts/cbt_assemble.py
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore fixed sources
        run: |
          python3 scripts/exam_assemble.py
          python3 scripts/index_assemble.py
          python3 scripts/cbt_assemble.py
      - name: Verify markers
        run: |
          set -euo pipefail
          grep -q isExamAttemptFinished src/routes/student.index.tsx
          grep -q isExamAttemptFinished src/routes/student.examinations.tsx
          grep -q holdExamScreenShare src/components/cbt/CbtExamSession.impl.tsx
          grep -q priorAttemptQ src/components/cbt/CbtExamSession.impl.tsx
          grep -q alreadyFinished src/components/cbt/CbtExamSession.impl.tsx
          grep -q 'min-h-0 flex-1 overflow-y-auto' src/components/cbt/CbtExamSession.impl.tsx
          echo markers ok
      - name: Commit restored sources
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/student.index.tsx src/routes/student.examinations.tsx src/components/cbt/CbtExamSession.impl.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(cbt): retake guard, screen-share hold, student availability counts, exam scroll"
            git push
          fi
