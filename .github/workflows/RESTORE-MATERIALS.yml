name: RESTORE-MATERIALS
on:
  push:
    paths:
      - "scripts/mat-payload/**"
      - ".github/workflows/RESTORE-MATERIALS.yml"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit materials components
        run: |
          set -e
          cat scripts/mat-payload/p[0-9]* > /tmp/p.gz.b64
          cat scripts/mat-payload/v[0-9]* > /tmp/v.gz.b64
          base64 -d /tmp/p.gz.b64 | gunzip > src/components/materials/CourseMaterialsPanel.tsx
          base64 -d /tmp/v.gz.b64 | gunzip > src/components/materials/MaterialViewer.tsx
          head -c 50 src/components/materials/CourseMaterialsPanel.tsx; echo
          grep -q "hideFromMyList" src/components/materials/CourseMaterialsPanel.tsx
          grep -q "createPortal" src/components/materials/MaterialViewer.tsx
          grep -q "100dvh" src/components/materials/MaterialViewer.tsx
          wc -c src/components/materials/CourseMaterialsPanel.tsx src/components/materials/MaterialViewer.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/materials/CourseMaterialsPanel.tsx src/components/materials/MaterialViewer.tsx
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fix: compact mobile material cards, black full-screen reader, student Remove"
          git push
