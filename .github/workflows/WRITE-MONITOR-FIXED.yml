name: WRITE-MONITOR-FIXED
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/WRITE-MONITOR-FIXED.yml
      - scripts/write_monitor_from_parts.py
      - scripts/monitor_b64_a.txt
      - scripts/monitor_b64_b.txt
jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write fixed monitor file
        run: |
          set -euo pipefail
          python3 scripts/write_monitor_from_parts.py
          grep -q 'function AlertsPanel' src/routes/officer.live-monitor.tsx
          grep -q 'function StudentCard' src/routes/officer.live-monitor.tsx
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/officer.live-monitor.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(build): restored officer.live-monitor.tsx (JSX valid)"
            git push
          fi
