name: Apply screen compress
on:
  push:
    paths:
      - scripts/apply_screen_compress.py
      - .github/workflows/apply-screen-compress.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_screen_compress.py
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          if git diff --staged --quiet; then
            echo No changes
          else
            git commit -m "fix(live-screen): compress frames before Realtime broadcast; enrich exam/course/matric"
            git push
          fi
