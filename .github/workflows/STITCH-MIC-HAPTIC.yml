name: STITCH-MIC-HAPTIC
on:
  workflow_dispatch:
  push:
    paths:
      - ".d4exam-payload/mic/**"
      - ".github/workflows/STITCH-MIC-HAPTIC.yml"
jobs:
  stitch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and commit
        run: |
          set -e
          python3 << 'PY'
          import gzip, base64, pathlib
          root = pathlib.Path(".d4exam-payload/mic")
          def assemble(prefix, dest):
              parts = sorted(root.glob(prefix + ".*.b64"))
              if not parts:
                  print("skip", prefix)
                  return False
              b64 = "".join(p.read_text().strip() for p in parts)
              data = gzip.decompress(base64.b64decode(b64))
              pathlib.Path(dest).write_bytes(data)
              print("wrote", dest, len(data))
              return True
          changed = False
          changed |= assemble("cbt", "src/components/cbt/CbtExamSession.impl.tsx")
          changed |= assemble("olm", "src/routes/officer.live-monitor.tsx")
          if not changed:
              print("nothing to write")
              raise SystemExit(0)
          PY
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat: live student mic publish + officer mute/focus listen"
            git push
          fi
