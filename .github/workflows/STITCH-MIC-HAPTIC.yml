name: STITCH-MIC-HAPTIC
on:
  workflow_dispatch:
  push:
    paths:
      - ".d4exam-payload/mic/**"
      - ".github/workflows/STITCH-MIC-HAPTIC.yml"
jobs:
  stitch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble payloads
        run: |
          set -e
          python3 << 'PY'
          import gzip, base64, pathlib
          root = pathlib.Path(".d4exam-payload/mic")
          def assemble(prefix, dest):
              parts = sorted(root.glob(prefix + ".*.b64"))
              if not parts:
                  print("skip", prefix)
                  return
              b64 = "".join(p.read_text().strip() for p in parts)
              data = gzip.decompress(base64.b64decode(b64))
              pathlib.Path(dest).write_bytes(data)
              print("wrote", dest, len(data))
          assemble("live-audio", "src/lib/live-audio.ts")
          assemble("use-mic", "src/lib/use-live-mic-publish.ts")
          assemble("haptic", "src/lib/haptic.ts")
          assemble("ecp", "src/components/cbt/ExamCameraPip.tsx")
          assemble("cbt", "src/components/cbt/CbtExamSession.impl.tsx")
          assemble("olm", "src/routes/officer.live-monitor.tsx")
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add src/lib/live-audio.ts src/lib/use-live-mic-publish.ts src/lib/haptic.ts src/components/cbt/ExamCameraPip.tsx src/components/cbt/CbtExamSession.impl.tsx src/routes/officer.live-monitor.tsx || true
          git diff --cached --quiet || git commit -m "feat: live officer mic listen + CBT mic publish + vibration fix"
          git push
