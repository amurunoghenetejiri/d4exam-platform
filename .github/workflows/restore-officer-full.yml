name: Restore full officer monitor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-officer-full.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full working officer pages from abe8387
        run: |
          set -e
          GOOD=abe8387
          echo "Restoring officer pages from $GOOD (full camera + violations UI)"
          git show "$GOOD:src/routes/officer.live-monitor.tsx" > src/routes/officer.live-monitor.tsx
          git show "$GOOD:src/routes/officer.approvals.tsx" > src/routes/officer.approvals.tsx
          # Keep supporting libs if present in that commit
          git show "$GOOD:src/lib/live-video.ts" > src/lib/live-video.ts || true
          git show "$GOOD:src/lib/live-monitor.ts" > src/lib/live-monitor.ts || true
          # Sanity: must be large real files
          for f in src/routes/officer.live-monitor.tsx src/routes/officer.approvals.tsx; do
            bytes=$(wc -c < "$f")
            echo "$f = $bytes bytes"
            if [ "$bytes" -lt 5000 ]; then
              echo "ERROR: $f too small"
              exit 1
            fi
            if grep -q 'PLACEHOLDER' "$f"; then
              echo "ERROR: $f still PLACEHOLDER"
              exit 1
            fi
          done
          grep -q 'startLiveCamSubscriber' src/routes/officer.live-monitor.tsx
          grep -q 'StudentCard' src/routes/officer.live-monitor.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/officer.live-monitor.tsx src/routes/officer.approvals.tsx src/lib/live-video.ts src/lib/live-monitor.ts
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix: restore full officer live-monitor + approvals (cameras, violations) from abe8387'
            git push
          fi
