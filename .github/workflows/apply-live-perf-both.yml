name: Apply live perf both
on:
  push:
    paths:
      - scripts/apply_live_perf_both.py
      - .github/workflows/apply-live-perf-both.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_live_perf_both.py
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          if git diff --staged --quiet; then echo No changes; else git commit -m "fix(officer-live): faster frames, BOTH dual cards, signal bars, identity"; git push; fi
