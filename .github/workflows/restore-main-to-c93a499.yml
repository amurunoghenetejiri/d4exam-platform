name: Restore main to c93a499 (Vercel shell)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-main-hard
  cancel-in-progress: false

jobs:
  restore:
    name: Hard-reset main to c93a499
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset main to c93a499 and force-push
        run: |
          set -euo pipefail
          TARGET=c93a499237cfc86533209caa6d318f86e95f3299
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "$TARGET"
          git checkout main
          git reset --hard "$TARGET"

          # Confirm Capacitor still points at Vercel at this commit
          grep -q 'd4exam-platform.vercel.app' capacitor.config.ts
          echo "OK: capacitor.config has Vercel server.url"
          git log -1 --oneline

          git push --force origin main
          echo "main is now exactly at $TARGET"
