name: CBT integrity face tab fix
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re

          # ---------- types/index.ts ----------
          t = Path("src/types/index.ts").read_text()
          t = t.replace(
              'export type FaceViolationAction = "warn" | "flag" | "pause" | "terminate";',
              'export type FaceViolationAction = "warn" | "flag" | "pause" | "terminate";\nexport type TabViolationAction = "warn" | "flag" | "pause" | "terminate" | "auto_submit";',
          )
          old_sec = '''  faceViolationAction: FaceViolationAction;
  thresholdAction: "flag" | "terminate" | "warn";
  resultVisibility: ResultVisibility;
  questionsToAnswer?: number | null;
}'''
          new_sec = '''  faceViolationAction: FaceViolationAction;
  /** Tab-violation consequence when max tab switches is reached */
  thresholdAction: TabViolationAction;
  /** Pause duration in seconds when thresholdAction is pause */
  pauseDurationSeconds: number;
  resultVisibility: ResultVisibility;
  questionsToAnswer?: number | null;
}'''
          if old_sec in t:
              t = t.replace(old_sec, new_sec)
              print("types updated")
          else:
              print("WARN types pattern miss")
          Path("src/types/index.ts").write_text(t)

          # ---------- exam-security.ts ----------
          es = Path("src/lib/exam-security.ts").read_text()
          if "pauseDurationSeconds" not in es:
              es = es.replace(
                  '  thresholdAction: "flag",\n  resultVisibility:',
                  '  thresholdAction: "flag",\n  pauseDurationSeconds: 300,\n  resultVisibility:',
              )
          # toExamSettingsRow — keep threshold_action; pause lives in JSON description primarily
          if "pause_duration_seconds" not in es:
              es = es.replace(
                  "    threshold_action: n.thresholdAction,",
                  "    threshold_action: n.thresholdAction,\n    pause_duration_seconds: n.pauseDurationSeconds ?? 300,",
              )
          if "pause_duration_seconds?:" not in es:
              es = es.replace(
                  "  threshold_action?: string | null;",
                  "  threshold_action?: string | null;\n  pause_duration_seconds?: number | null;",
              )
          if "pause_duration_seconds != null" not in es:
              es = es.replace(
                  "    if (row.threshold_action != null) {\n      fromRow.thresholdAction = row.threshold_action as ExamSecuritySettings[\"thresholdAction\"];\n    }",
                  "    if (row.threshold_action != null) {\n      fromRow.thresholdAction = row.threshold_action as ExamSecuritySettings[\"thresholdAction\"];\n    }\n    if (row.pause_duration_seconds != null) {\n      fromRow.pauseDurationSeconds = Number(row.pause_duration_seconds);\n    }",
              )
          # summary lines — Tab Violation wording
          es = es.replace(
              "`Tab monitoring: ${n.tabMonitoring ? `On (max ${n.maxTabSwitches})` : \"Off\"}`,\n    `On threshold: ${n.thresholdAction}`,",
              "`TAB VIOLATION monitoring: ${n.tabMonitoring ? `On (max ${n.maxTabSwitches})` : \"Off\"}`,\n    `Tab violation consequence: ${n.thresholdAction}${n.thresholdAction === \"pause\" ? ` (${n.pauseDurationSeconds ?? 300}s)` : \"\"}`,",
          )
          Path("src/lib/exam-security.ts").write_text(es)
          print("exam-security updated")

          # ---------- ExamCameraPip.tsx ----------
          pip = Path("src/components/cbt/ExamCameraPip.tsx").read_text()
          pip = pip.replace("const FACE_TICK_MS = 500;", "const FACE_TICK_MS = 200;")
          pip = pip.replace("const STABILITY_MS = 500;", "const STABILITY_MS = 200;")
          pip = pip.replace(
              '/** Production: process frames ~every 500ms */',
              '/** Production: process frames ~every 200ms */',
          )
          pip = pip.replace(
              '/** Brief face loss grace (~0.5s) before AMBER */',
              '/** Brief face loss grace (~0.2s) before AMBER */',
          )
          # Labels
          pip = pip.replace('? "Multiple Faces Detected"', '? "Multiple faces detected"')
          pip = pip.replace('? "Face Not Detected"', '? "No face detected"')
          pip = pip.replace('? "1 Face Detected — Monitoring"', '? "1 face monitoring"')
          pip = pip.replace('? "Detecting…"', '? "Detecting face"')
          Path("src/components/cbt/ExamCameraPip.tsx").write_text(pip)
          print("ExamCameraPip updated")

          # ---------- teacher.exam-security.tsx ----------
          tes = Path("src/routes/teacher.exam-security.tsx").read_text()
          tes = tes.replace(
              '<Label className="font-semibold">Max tab switches before action</Label>',
              '<Label className="font-semibold">TAB VIOLATION — max switches</Label>',
          )
          tes = tes.replace(
              '<Label className="font-semibold">When threshold is reached</Label>',
              '<Label className="font-semibold">TAB VIOLATION — consequence</Label>',
          )
          old_sel = '''                <SelectContent>
                  <SelectItem value="warn">Warn candidate</SelectItem>
                  <SelectItem value="flag">Flag for review</SelectItem>
                  <SelectItem value="terminate">Terminate attempt</SelectItem>
                </SelectContent>'''
          new_sel = '''                <SelectContent>
                  <SelectItem value="warn">Warning only</SelectItem>
                  <SelectItem value="flag">Flag for review</SelectItem>
                  <SelectItem value="pause">Pause exam</SelectItem>
                  <SelectItem value="auto_submit">Auto-submit exam</SelectItem>
                  <SelectItem value="terminate">Terminate exam</SelectItem>
                </SelectContent>'''
          if old_sel in tes:
              tes = tes.replace(old_sel, new_sel)
          # Insert pause duration after the Select block for threshold
          if "pauseDurationSeconds" not in tes:
              insert_after = '''              </div>
            <Toggle
              label="Block copy / paste"'''
              pause_block = '''              </div>
            {settings.thresholdAction === "pause" && (
              <div className="space-y-2 rounded-xl border border-slate-200 px-4 py-3">
                <Label className="font-semibold">Pause duration (minutes)</Label>
                <Input
                  type="number"
                  min={1}
                  max={60}
                  value={Math.max(1, Math.round((settings.pauseDurationSeconds ?? 300) / 60))}
                  onChange={(e) =>
                    toggle("pauseDurationSeconds", Math.max(60, (Number(e.target.value) || 5) * 60))
                  }
                  disabled={!settings.tabMonitoring}
                />
                <p className="text-[11px] text-slate-500">Continue Exam stays disabled until this countdown ends.</p>
              </div>
            )}
            <Toggle
              label="Block copy / paste"'''
              if insert_after in tes:
                  tes = tes.replace(insert_after, pause_block, 1)
                  print("pause duration UI added")
          Path("src/routes/teacher.exam-security.tsx").write_text(tes)
          print("teacher.exam-security updated")

          # ---------- ExamSecurityGate.tsx — dynamic rules ----------
          gate = Path("src/components/cbt/ExamSecurityGate.tsx").read_text()
          # Replace static monitoring notice bullets with dynamic integrity rules
          old_notice = '''        <div className="mt-4 rounded-xl border border-slate-200 bg-slate-50 p-4">
          <p className="text-sm font-extrabold text-slate-900">Monitoring notice</p>
          <ul className="mt-2 space-y-1 text-xs leading-relaxed text-slate-600">
            {needCam && (
              <li>
                • Your camera stays on for the whole examination. Face checks run locally —{" "}
                <strong>no video is uploaded or recorded</strong>.
              </li>
            )}
            {needFace && <li>• Warnings are shown if no face or multiple faces are detected.</li>}
            {needMic && <li>• Your microphone is active for the duration of the examination.</li>}
            {shareMode !== "disabled" && <li>• Screen activity may be monitored while you write.</li>}
            {security.tabMonitoring && <li>• Leaving this tab is counted and recorded.</li>}
            <li>• Security events are stored for review.</li>
          </ul>
          <label className="mt-3 flex cursor-pointer items-start gap-2.5 text-xs text-slate-700">
            <Checkbox
              checked={acknowledgedNotice}
              onCheckedChange={(v) => setAcknowledgedNotice(v === true)}
              className="mt-0.5"
            />
            <span>I have read and accept the monitoring notice and the examination rules.</span>
          </label>
        </div>'''
          new_notice = '''        <div className="mt-4 rounded-xl border border-slate-200 bg-slate-50 p-4">
          <p className="text-sm font-extrabold text-slate-900">Integrity & security rules</p>
          <p className="mt-0.5 text-[11px] text-slate-500">From the approved exam configuration</p>
          <ul className="mt-2 space-y-1 text-xs leading-relaxed text-slate-600">
            {needCam && (
              <li>
                • Camera stays on for the whole examination. Face checks run locally —{" "}
                <strong>no video is uploaded or recorded</strong>.
              </li>
            )}
            {needFace && (
              <li>
                • Face monitoring is active. No face or multiple faces may trigger warnings
                {security.maxFaceWarnings ? ` (max ${security.maxFaceWarnings} face warnings)` : ""}.
              </li>
            )}
            {needMic && <li>• Your microphone is active for the duration of the examination.</li>}
            {shareMode !== "disabled" && <li>• Screen activity may be monitored while you write.</li>}
            {security.tabMonitoring && (
              <li>
                • <strong>TAB VIOLATION:</strong> Leaving the exam environment counts as a violation
                (max {security.maxTabSwitches ?? 5}). Consequence:{" "}
                <strong>
                  {security.thresholdAction === "terminate"
                    ? "terminate examination"
                    : security.thresholdAction === "auto_submit"
                      ? "auto-submit examination"
                      : security.thresholdAction === "pause"
                        ? `pause examination for ${Math.round((security.pauseDurationSeconds ?? 300) / 60)} min`
                        : security.thresholdAction === "flag"
                          ? "flag for review"
                          : "warning only"}
                </strong>
                .
              </li>
            )}
            {security.fullscreen && <li>• Fullscreen lockdown is required during the examination.</li>}
            <li>• Security events are stored for authorised review.</li>
          </ul>
          <label className="mt-3 flex cursor-pointer items-start gap-2.5 text-xs text-slate-700">
            <Checkbox
              checked={acknowledgedNotice}
              onCheckedChange={(v) => setAcknowledgedNotice(v === true)}
              className="mt-0.5"
            />
            <span>I have read and accept these integrity rules and the examination monitoring notice.</span>
          </label>
        </div>'''
          if old_notice in gate:
              gate = gate.replace(old_notice, new_notice)
              print("ExamSecurityGate rules updated")
          else:
              print("WARN gate notice pattern miss")
          Path("src/components/cbt/ExamSecurityGate.tsx").write_text(gate)

          # ---------- CbtExamSession.impl.tsx — tab consequences ----------
          cbt = Path("src/components/cbt/CbtExamSession.impl.tsx").read_text()

          # Add pause countdown state if missing
          if "pauseEndsAt" not in cbt:
              cbt = cbt.replace(
                  '  const [pauseReason, setPauseReason] = useState<string>("");\n  const [warnBanner, setWarnBanner] = useState<string | null>(null);',
                  '  const [pauseReason, setPauseReason] = useState<string>("");\n  const [pauseEndsAt, setPauseEndsAt] = useState<number | null>(null);\n  const [pauseRemainSec, setPauseRemainSec] = useState(0);\n  const [doneReason, setDoneReason] = useState<string | null>(null);\n  const [warnBanner, setWarnBanner] = useState<string | null>(null);\n  const submittingRef = useRef(false);',
              )

          # Pause countdown effect
          if "pauseEndsAt" in cbt and "setPauseRemainSec" in cbt and "Pause countdown tick" not in cbt:
              inject = '''
  // Pause countdown tick
  useEffect(() => {
    if (!paused || pauseEndsAt == null) return;
    const tick = () => {
      const left = Math.max(0, Math.ceil((pauseEndsAt - Date.now()) / 1000));
      setPauseRemainSec(left);
    };
    tick();
    const t = window.setInterval(tick, 250);
    return () => window.clearInterval(t);
  }, [paused, pauseEndsAt]);
'''
              marker = "  // Re-assert immersive chrome while the exam is active."
              if marker in cbt:
                  cbt = cbt.replace(marker, inject + marker)

          # Replace applyConsequence body for full actions
          old_apply = '''    const applyConsequence = async (eventType: string, description: string) => {
      const now = Date.now();
      if (now - lastViolationAtRef.current < DEBOUNCE_MS) return;
      lastViolationAtRef.current = now;
      const action = security.thresholdAction || "flag";
      void logSecurityEvent({
        schoolId, examId: id, attemptId: attemptIdRef.current, studentId,
        eventType, severity: action === "terminate" ? "high" : "medium",
        description, questionIndex: index,
        extra: {
          tab_switch_count: tabSwitchCountRef.current,
          fullscreen_exit_count: fullscreenExitCountRef.current,
          threshold_action: action,
        },
      });
      if (action === "warn" || action === "flag") {
        setWarnBanner(description);
        try { haptic("tab_switch"); } catch { /* ignore */ }
        window.setTimeout(() => setWarnBanner(null), 6000);
      } else if (action === "terminate") {
        setDoneTerminated(true);
        await finishAttempt(true);
      }
    };'''
          new_apply = '''    const applyConsequence = async (eventType: string, description: string) => {
      const now = Date.now();
      if (now - lastViolationAtRef.current < DEBOUNCE_MS) return;
      lastViolationAtRef.current = now;
      const action = security.thresholdAction || "flag";
      const max = security.maxTabSwitches ?? 5;
      const count = tabSwitchCountRef.current;
      void logSecurityEvent({
        schoolId, examId: id, attemptId: attemptIdRef.current, studentId,
        eventType, severity: action === "terminate" || action === "auto_submit" ? "high" : "medium",
        description, questionIndex: index,
        extra: {
          tab_switch_count: count,
          fullscreen_exit_count: fullscreenExitCountRef.current,
          threshold_action: action,
        },
      });
      if (action === "warn") {
        setWarnBanner(`Warning: You have left the examination environment. This is violation ${count} of ${max}.`);
        try { haptic("tab_switch"); } catch { /* ignore */ }
        window.setTimeout(() => setWarnBanner(null), 6000);
      } else if (action === "flag") {
        setWarnBanner(`Your examination has been flagged for review. Reason: Repeated tab violations (${count}/${max}).`);
        try { haptic("tab_switch"); } catch { /* ignore */ }
        window.setTimeout(() => setWarnBanner(null), 6000);
        if (attemptIdRef.current) {
          void supabase.from("exam_attempts").update({ status: "flagged" } as never).eq("id", attemptIdRef.current);
        }
      } else if (action === "pause") {
        const secs = Math.max(60, Number(security.pauseDurationSeconds ?? 300));
        setPauseReason(`Maximum tab violations reached (${count}/${max}).`);
        setPauseEndsAt(Date.now() + secs * 1000);
        setPauseRemainSec(secs);
        setPaused(true);
      } else if (action === "auto_submit") {
        setDoneReason("Maximum tab violations reached.");
        setDoneTerminated(true);
        await finishAttempt(true, "auto_submit");
      } else if (action === "terminate") {
        setDoneReason("Maximum tab violations reached.");
        setDoneTerminated(true);
        await finishAttempt(true, "terminated");
      }
    };'''
          if old_apply in cbt:
              cbt = cbt.replace(old_apply, new_apply)
              print("applyConsequence updated")
          else:
              print("WARN applyConsequence pattern miss")

          # Pre-threshold tab warning message
          cbt = cbt.replace(
              "setWarnBanner(`Stay on the exam screen. Switches: ${tabSwitchCountRef.current}/${max}`);",
              "setWarnBanner(`Warning: You have left the examination environment. This is violation ${tabSwitchCountRef.current} of ${max}.`);",
          )

          # finishAttempt signature to accept mode
          if "async function finishAttempt(auto = false)" in cbt:
              cbt = cbt.replace(
                  "async function finishAttempt(auto = false) {",
                  'async function finishAttempt(auto = false, mode: "manual" | "terminated" | "auto_submit" | "expired" = "manual") {',
              )
              cbt = cbt.replace(
                  "if (done || finishingRef.current) return;\n    finishingRef.current = true;\n    shutdownMedia();",
                  "if (done || finishingRef.current) return;\n    finishingRef.current = true;\n    submittingRef.current = true;\n    shutdownMedia();",
              )
              # Pass terminated correctly and status
              cbt = cbt.replace(
                  "answers, terminated: auto, resultVisibility: security.resultVisibility,",
                  "answers, terminated: auto && mode !== \"manual\", resultVisibility: security.resultVisibility,",
              )

          # requestSubmit — cleaner confirm + no face after
          old_sub = '''  async function requestSubmit() {
    if (done || finishingRef.current || previewMode) return;
    const unanswered = Math.max(0, TOTAL - answeredCount);
    const msg = unanswered > 0
      ? `You have ${unanswered} unanswered question${unanswered === 1 ? "" : "s"}. Submit this examination anyway?`
      : "Submit this examination now?";
    if (!window.confirm(msg)) return;
    await finishAttempt(false);
  }'''
          new_sub = '''  async function requestSubmit() {
    if (done || finishingRef.current || previewMode || submittingRef.current) return;
    const unanswered = Math.max(0, TOTAL - answeredCount);
    const msg = unanswered > 0
      ? `Confirm Your Submission\n\nAre you sure you want to submit your examination?\nYou have ${unanswered} unanswered question${unanswered === 1 ? "" : "s"}.`
      : "Confirm Your Submission\n\nAre you sure you want to submit your examination?";
    if (!window.confirm(msg)) return;
    submittingRef.current = true;
    await finishAttempt(false, "manual");
  }'''
          if old_sub in cbt:
              cbt = cbt.replace(old_sub, new_sub)

          # onFaceSecurityEvent — ignore when submitting/done
          cbt = cbt.replace(
              "if (previewMode || doneRef.current) return;",
              "if (previewMode || doneRef.current || submittingRef.current || finishingRef.current) return;",
          )

          # Pause UI with countdown
          old_pause_ui = '''      {paused && started && !done && (
        <div className="fixed inset-0 z-[190] flex items-center justify-center bg-slate-950/90 p-4 backdrop-blur-sm">
          <div className="w-full max-w-sm rounded-2xl border border-slate-700 bg-white p-6 text-center shadow-2xl">
            <h2 className="text-lg font-extrabold text-slate-900">EXAM PAUSED</h2>
            <p className="mt-2 text-sm text-slate-600">Your examination has been paused because an integrity violation was detected.</p>
            {pauseReason ? <p className="mt-3 text-xs font-semibold text-slate-800">Reason: {pauseReason}</p> : null}
            <Button className="mt-5 w-full font-semibold" onClick={() => void restoreFullscreenFromUser()}>Resume examination</Button>
          </div>
        </div>
      )}'''
          new_pause_ui = '''      {paused && started && !done && (
        <div className="fixed inset-0 z-[190] flex items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm">
          <div className="w-full max-w-sm rounded-2xl border border-slate-200 bg-slate-100 p-6 text-center shadow-2xl">
            <h2 className="text-lg font-extrabold text-slate-900">Your examination has been paused</h2>
            <p className="mt-2 text-sm text-slate-600">Reason: {pauseReason || "Maximum tab violations reached."}</p>
            {pauseRemainSec > 0 ? (
              <p className="mt-4 font-mono text-2xl font-bold tabular-nums text-slate-800">
                Resume available in: {String(Math.floor(pauseRemainSec / 60)).padStart(2, "0")}:{String(pauseRemainSec % 60).padStart(2, "0")}
              </p>
            ) : (
              <p className="mt-4 text-sm font-semibold text-emerald-700">You may continue the examination.</p>
            )}
            <Button
              className="mt-5 w-full font-semibold"
              disabled={pauseRemainSec > 0}
              onClick={() => {
                setPaused(false);
                setPauseEndsAt(null);
                setPauseRemainSec(0);
                void restoreFullscreenFromUser();
              }}
            >
              Continue Exam
            </Button>
          </div>
        </div>
      )}'''
          if old_pause_ui in cbt:
              cbt = cbt.replace(old_pause_ui, new_pause_ui)
              print("pause UI updated")
          else:
              print("WARN pause UI pattern miss")

          # Done screen messages for terminate / auto_submit
          cbt = cbt.replace(
              '{previewMode ? "Officer preview finished." : doneTerminated ? "Your attempt was closed." : "Your answers were submitted successfully."}',
              '{previewMode ? "Officer preview finished." : doneTerminated && doneReason ? (<>Your examination has been {doneReason.toLowerCase().includes("auto") ? "auto-submitted" : "terminated"}.<br />Reason: {doneReason}</>) : doneTerminated ? "Your examination has been terminated." : "Your answers were submitted successfully."}',
          )

          # settings select include pause_duration if column exists (safe optional)
          cbt = cbt.replace(
              '.select("exam_id, fullscreen, tab_monitoring, max_tab_switches, block_copy_paste, randomize_questions, randomize_options, require_camera, require_microphone, face_detection, max_face_warnings, require_screen_share, screen_share_mode, threshold_action, face_violation_action, total_marks, instructions, result_visibility, questions_to_answer")',
              '.select("exam_id, fullscreen, tab_monitoring, max_tab_switches, block_copy_paste, randomize_questions, randomize_options, require_camera, require_microphone, face_detection, max_face_warnings, require_screen_share, screen_share_mode, threshold_action, face_violation_action, total_marks, instructions, result_visibility, questions_to_answer")',
          )

          Path("src/components/cbt/CbtExamSession.impl.tsx").write_text(cbt)
          print("CbtExamSession updated", len(cbt.splitlines()), "lines")

          Path("DEPLOY_TRIGGER.txt").write_text("cbt-integrity-face-tab-2026-08-25\n")
          print("DONE")
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.app"
          git add -A
          git diff --cached --stat
          git commit -m "fix(cbt): face 200ms, TAB VIOLATION pause/auto-submit/terminate, dynamic rules" || echo "no changes"
          git push
