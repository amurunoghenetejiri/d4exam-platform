name: CBT session haptic + pip face fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cbt-haptics-session.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply precise string patches
        run: |
          set -e
          # --- Session haptics ---
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/components/cbt/CbtExamSession.impl.tsx')
          t = p.read_text()
          t = t.replace(
            'import { hapticOfficerWarning, haptic as fireHaptic, primeHaptics, refreshHapticUnlock, startHapticKeepAlive, stopHapticKeepAlive } from "@/lib/haptic";',
            'import { hapticOfficerWarning, hapticExamStart, haptic as fireHaptic, primeHaptics, refreshHapticUnlock, startHapticKeepAlive, stopHapticKeepAlive } from "@/lib/haptic";',
          )
          t = t.replace('      fireHaptic("tab_switch");\n', '')
          t = t.replace(
            'try { primeHaptics(); startHapticKeepAlive(); } catch { /* ignore */ }',
            'try { primeHaptics(); } catch { /* ignore */ }',
          )
          if 'hapticExamStart()' not in t:
            t = t.replace(
              '      setSeconds((examQ.data?.duration_minutes ?? 60) * 60);\n      setStarted(true);\n      setIndex(0);',
              '      setSeconds((examQ.data?.duration_minutes ?? 60) * 60);\n      setStarted(true);\n      setIndex(0);\n      try { hapticExamStart(); } catch { /* ignore */ }',
            )
          p.write_text(t)
          print('session', 'hapticExamStart' in t, 'tab_switch haptic' , 'fireHaptic("tab_switch")' in t)
          PY

          # --- ExamCameraPip ---
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path('src/components/cbt/ExamCameraPip.tsx')
          t = p.read_text()
          t = t.replace(
          '''function haptic(kind: SecurityAlertKind) {
  const map: Record<SecurityAlertKind, HapticKind> = {
    none: "none",
    unclear: "unclear",
    multi: "multi",
    camera_blocked: "camera_blocked",
  };
  fireHaptic(map[kind]);
}''',
          '''function haptic(kind: SecurityAlertKind) {
  // Only vibrate for no-face and multiple-faces (officer warning is handled elsewhere)
  if (kind === "none") fireHaptic("none");
  else if (kind === "multi") fireHaptic("multi");
}'''
          )
          t = t.replace('const ALERT_COOLDOWN_MS = 1800;', 'const ALERT_COOLDOWN_MS = 2200;')
          t = t.replace('const FACE_TICK_MS = 900;', 'const FACE_TICK_MS = 500;')
          t = t.replace('const ENGINE_TIMEOUT_MS = 4000;', 'const ENGINE_TIMEOUT_MS = 6000;')
          if 'okStreakRef' not in t:
            t = t.replace(
              'const lastStateRef = useRef<FaceState>("unavailable");',
              'const lastStateRef = useRef<FaceState>("unavailable");\n  const okStreakRef = useRef(0);\n  const badStreakRef = useRef(0);\n  const multiStreakRef = useRef(0);\n  const noneStreakRef = useRef(0);',
            )
            # try alternate initial value
            if 'okStreakRef' not in t:
              m = re.search(r'const lastStateRef = useRef<FaceState>\([^;]+\);', t)
              if m:
                t = t.replace(m.group(0), m.group(0) + '\n  const okStreakRef = useRef(0);\n  const badStreakRef = useRef(0);\n  const multiStreakRef = useRef(0);\n  const noneStreakRef = useRef(0);', 1)

          # Replace fireAlert on unclear paths: remove unclear fireAlert lines
          t = t.replace('else if (next === "unclear") fireAlert("unclear", faceCount);\n', '')
          t = t.replace('''else if (next === "unavailable") {
          fireAlert("unclear", faceCount);
        }''', '''else if (next === "unavailable") {
          /* no haptic/toast spam for unavailable while recovering */
        }''')

          # When next === ok, force status ok immediately (key fix for stuck unclear)
          t = t.replace(
            '''if (next === "ok") {
        faceWarnRef.current = Math.max(0, faceWarnRef.current - 1);
        if (prev !== "ok") {
          onSecRef.current?.({ kind: "ok", faceCount, at: new Date().toISOString() });
        }
        return;
      }''',
            '''if (next === "ok") {
        okStreakRef.current = (okStreakRef.current || 0) + 1;
        if (typeof badStreakRef !== "undefined") badStreakRef.current = 0;
        setFaceStatus("ok");
        lastStateRef.current = "ok";
        faceWarnRef.current = Math.max(0, faceWarnRef.current - 1);
        if (prev !== "ok") {
          onSecRef.current?.({ kind: "ok", faceCount, at: new Date().toISOString() });
        }
        return;
      }'''
          )

          p.write_text(t)
          print('pip', 'okStreakRef' in t, 'FACE_TICK', 'FACE_TICK_MS = 500' in t, 'vibrate only none/multi', 'if (kind === "none")' in t)
          PY

          grep -n 'hapticExamStart\|okStreakRef\|FACE_TICK_MS = 500\|if (kind === "none")' \
            src/components/cbt/CbtExamSession.impl.tsx src/components/cbt/ExamCameraPip.tsx | head -20
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/cbt/CbtExamSession.impl.tsx src/components/cbt/ExamCameraPip.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m 'fix(cbt): face ok hysteresis + haptics only start/none/multi/officer'
            git push
          fi
