name: Fix officer page crash
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-officer-crash.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply crash fixes with regex
        run: |
          set -e
          python3 <<'PY'
          import re
          from pathlib import Path

          # --- kit StatusBadge ---
          kit = Path("src/components/dashboard/kit.tsx")
          t = kit.read_text()
          t2, n = re.subn(
              r"export function StatusBadge\(\{ status, className \}: \{ status: string; className\?: string \}\) \{[\s\S]*?\n\}",
              '''export function StatusBadge({ status, className }: { status: string; className?: string }) {
            const safe = String(status ?? "");
            const key = safe.toLowerCase().split("_").join(" ");
            const style = STATUS_STYLES[key] ?? "bg-slate-100 text-slate-600 border-slate-200";
            return (
              <span
                className={cn(
                  "inline-flex items-center rounded-full border px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide sm:text-[11px]",
                  style,
                  className,
                )}
              >
                {safe.split("_").join(" ")}
              </span>
            );
          }''',
              t,
              count=1,
          )
          print("StatusBadge replacements", n)
          # brute force replaceAll in StatusBadge area
          t2 = t2.replace('status.toLowerCase().replaceAll("_", " ")', 'String(status ?? "").toLowerCase().split("_").join(" ")')
          t2 = t2.replace('{status.replaceAll("_", " ")}', '{String(status ?? "").split("_").join(" ")}')
          kit.write_text(t2)

          # --- live-monitor.ts ---
          lm = Path("src/lib/live-monitor.ts")
          t = lm.read_text()
          t = t.replace('.replaceAll("_", " ")', '.split("_").join(" ")')
          t = t.replace(".replaceAll('_', ' ')", ".split('_').join(' ')")
          lm.write_text(t)
          print("lm-lib replaceAll left", t.count("replaceAll"))

          # --- live-monitor route ---
          p = Path("src/routes/officer.live-monitor.tsx")
          t = p.read_text()
          assert "PLACEHOLDER" not in t and len(t) > 10000
          t = t.replace(
              'const course = a.examinations?.courses?.code || "—";',
              'const _c = a.examinations?.courses as unknown; const course = Array.isArray(_c) ? ((_c[0] as {code?:string}|undefined)?.code || "—") : ((_c as {code?:string}|null|undefined)?.code || "—");',
          )
          t = t.replace(
              'const fromProfile = String(a.students?.profiles?.full_name || "").trim();',
              'const _prof = a.students?.profiles as unknown; const fromProfile = String(Array.isArray(_prof) ? (_prof[0] as {full_name?:string|null}|undefined)?.full_name || "" : (_prof as {full_name?:string|null}|null|undefined)?.full_name || "").trim();',
          )
          t = t.replace(
              '`${(liveExams[0].courses as { code?: string } | null)?.code ?? ""} · ${liveExams[0].title}`',
              '`${(Array.isArray(liveExams[0].courses) ? (liveExams[0].courses as {code?:string}[])[0]?.code : (liveExams[0].courses as {code?:string}|null)?.code) ?? ""} · ${liveExams[0].title}`',
          )
          # also kill any remaining replaceAll in this file
          t = t.replace('.replaceAll("_", " ")', '.split("_").join(" ")')
          p.write_text(t)
          print("lm route ok", len(t))

          # --- approvals ---
          ap = Path("src/routes/officer.approvals.tsx")
          t = ap.read_text()
          assert "PLACEHOLDER" not in t and len(t) > 5000
          if "function courseCode(" not in t:
              helper = "\nfunction courseCode(item: { courses?: unknown }): string {\n  const c = item.courses;\n  if (!c) return \"—\";\n  if (Array.isArray(c)) return String((c[0] as { code?: string } | undefined)?.code ?? \"—\");\n  if (typeof c === \"object\") return String((c as { code?: string }).code ?? \"—\");\n  return \"—\";\n}\nfunction courseName(item: { courses?: unknown }): string {\n  const c = item.courses;\n  if (!c) return \"Course\";\n  if (Array.isArray(c)) return String((c[0] as { name?: string } | undefined)?.name ?? \"Course\");\n  if (typeof c === \"object\") return String((c as { name?: string }).name ?? \"Course\");\n  return \"Course\";\n}\n\n"
              t = t.replace("function toLocalInput(d: Date) {", helper + "function toLocalInput(d: Date) {", 1)
              t = t.replace('{item.courses?.code ?? "—"} · {item.courses?.name ?? "Course"}', '{courseCode(item)} · {courseName(item)}')
              t = t.replace('{item.courses?.code ?? "—"}', '{courseCode(item)}')
              t = t.replace('{selected?.title} · {selected?.courses?.code} · {selected?.duration_minutes} min', '{selected?.title} · {selected ? courseCode(selected) : "—"} · {selected?.duration_minutes} min')
          t = t.replace("if (error) throw error;", 'if (error) { console.warn("[officer.approvals] update", error); toast.error(error.message || "Could not update examination"); return; }')
          t = t.replace('.replaceAll("_", " ")', '.split("_").join(" ")')
          ap.write_text(t)
          print("approvals ok", len(t), "courseCode", "courseCode" in t)

          # summary
          for path in ["src/components/dashboard/kit.tsx", "src/lib/live-monitor.ts", "src/routes/officer.live-monitor.tsx", "src/routes/officer.approvals.tsx"]:
              text = Path(path).read_text()
              print(path, "replaceAll count", text.count("replaceAll"), "size", len(text))
          PY
          git config user.name "fix-bot"
          git config user.email "bot@d4exam.local"
          git add -A
          git status
          git diff --cached --stat
          git commit -m "fix: officer crash — StatusBadge null-safe, replaceAll removed, safe course/profile joins" || echo no-change
          git push
