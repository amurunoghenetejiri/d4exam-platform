name: Revert PLACEHOLDER CBT session
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/revert-placeholder-cbt.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 30
      - name: Restore file from history and patch
        run: |
          set -eux
          # Recover last non-placeholder version from git history
          for sha in 4bb14611c6d0beceb6f0f2d63ef65fc36c47573d 83eb7e0a998ff71c2c7f5cbcaa602594a97ea378 b8699b1; do
            if git cat-file -e ${sha}^{commit} 2>/dev/null; then
              if git show ${sha}:src/components/cbt/CbtExamSession.impl.tsx > /tmp/sess.tsx 2>/dev/null; then
                sz=$(wc -c < /tmp/sess.tsx)
                echo "try $sha size=$sz"
                if [ "$sz" -gt 10000 ]; then
                  cp /tmp/sess.tsx src/components/cbt/CbtExamSession.impl.tsx
                  break
                fi
              fi
            fi
          done
          # Fallback: download from raw github
          if [ "$(wc -c < src/components/cbt/CbtExamSession.impl.tsx)" -lt 10000 ]; then
            curl -fsSL "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-platform/4bb14611c6d0beceb6f0f2d63ef65fc36c47573d/src/components/cbt/CbtExamSession.impl.tsx" -o src/components/cbt/CbtExamSession.impl.tsx
          fi
          wc -c src/components/cbt/CbtExamSession.impl.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/components/cbt/CbtExamSession.impl.tsx")
          t = p.read_text()
          print("loaded", len(t))
          assert len(t) > 10000, "file too small"
          assert "PLACEHOLDER" not in t or len(t) > 100
          a = 'import { hapticOfficerWarning, haptic as fireHaptic, primeHaptics, refreshHapticUnlock } from "@/lib/haptic";'
          b = 'import { hapticOfficerWarning, haptic as fireHaptic, primeHaptics, refreshHapticUnlock, startHapticKeepAlive, stopHapticKeepAlive } from "@/lib/haptic";'
          if a in t:
              t = t.replace(a, b, 1)
          if "faceDetection={Boolean(security.faceDetection)}" in t:
              t = t.replace("faceDetection={Boolean(security.faceDetection)}", "faceDetection={Boolean(security.faceDetection || security.requireCamera)}", 1)
          if "try { primeHaptics(); } catch { /* ignore */ }" in t and "startHapticKeepAlive()" not in t:
              t = t.replace("try { primeHaptics(); } catch { /* ignore */ }", "try { primeHaptics(); startHapticKeepAlive(); } catch { /* ignore */ }", 1)
          old = """  const shutdownMedia = useCallback(() => {
    stopLiveCamStream();
    stopMediaStream(mediaStreamRef.current);
    mediaStreamRef.current = null;
    setLiveStream(null);
  }, [stopLiveCamStream]);"""
          new = """  const shutdownMedia = useCallback(() => {
    try { stopHapticKeepAlive(); } catch { /* ignore */ }
    stopLiveCamStream();
    stopMediaStream(mediaStreamRef.current);
    mediaStreamRef.current = null;
    setLiveStream(null);
  }, [stopLiveCamStream]);"""
          if "stopHapticKeepAlive()" not in t and old in t:
              t = t.replace(old, new, 1)
          p.write_text(t)
          print("final", len(t), "keepalive", "startHapticKeepAlive" in t)
          PY
      - name: Commit and push with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx
          git status
          git commit -m "fix(cbt): restore session + vibration keepalive + faceDetection" || exit 0
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main || true
            sleep 2
          done
