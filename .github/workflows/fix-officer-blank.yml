name: Fix officer blank crash
on:
  push:
    paths:
      - scripts/fix_officer_blank_crash.py
      - .github/workflows/fix-officer-blank.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_officer_blank_crash.py
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add src/routes/officer.live-monitor.tsx
          if git diff --staged --quiet; then echo No changes; else git commit -m "fix(officer-live): remove undefined metaMatric reference (blank page crash)"; git push; fi
