name: Assemble CBT session

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/assemble-cbt.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Fetch good CbtExamSession and patch studentName
        run: |
          set -eux
          # Known good full implementation (before PLACEHOLDER)
          git show 51e7e541902ce4ed77058fbaf3498c7283c4b06c:src/components/cbt/CbtExamSession.impl.tsx > /tmp/cbt.tsx
          wc -c /tmp/cbt.tsx
          python3 << 'PY'
          from pathlib import Path
          t = Path("/tmp/cbt.tsx").read_text(encoding="utf-8")
          assert "PLACEHOLDER" not in t and len(t) > 20000, len(t)
          old = "metadata: { cameraActive: needCam, lastSeenAt: new Date().toISOString(), videoStreaming: needCam },"
          new = """metadata: {
                      cameraActive: needCam,
                      lastSeenAt: new Date().toISOString(),
                      videoStreaming: needCam,
                      studentName: String(student.fullName || "").trim() || null,
                      matric: String(student.matric || "").trim() || null,
                    },"""
          if old in t:
              t = t.replace(old, new, 1)
              print("patched begin metadata")
          needle = "const payload = {\n        cameraActive:"
          insert = """const payload = {
                  studentName: String(student?.fullName || "").trim() || null,
                  matric: String(student?.matric || "").trim() || null,
                  cameraActive:"""
          if needle in t and "studentName: String(student?.fullName" not in t:
              t = t.replace(needle, insert, 1)
              print("patched presence")
          Path("src/components/cbt/CbtExamSession.impl.tsx").write_text(t, encoding="utf-8")
          print("written", len(t))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cbt/CbtExamSession.impl.tsx
          git status
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "fix: restore full CbtExamSession + studentName metadata (officer names + results)"
          git push
