name: Restore monitor approvals
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-monitor-approvals.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and harden
        run: |
          set -e
          # Restore full files from last good commit before PLACEHOLDER
          curl -fsSL "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-platform/afd7dac5926741afd00cf9633daccca6fa9f1942/src/lib/live-monitor.ts" -o src/lib/live-monitor.ts
          curl -fsSL "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-platform/afd7dac5926741afd00cf9633daccca6fa9f1942/src/routes/officer.approvals.tsx" -o src/routes/officer.approvals.tsx
          curl -fsSL "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-platform/afd7dac5926741afd00cf9633daccca6fa9f1942/src/routes/officer.live-monitor.tsx" -o src/routes/officer.live-monitor.tsx
          python3 <<'PY'
          from pathlib import Path

          # Harden live-monitor.ts
          lib = Path("src/lib/live-monitor.ts").read_text()
          assert "PLACEHOLDER" not in lib and len(lib) > 2000
          lib = lib.replace(
              "export function humanEventLabel(eventType: string, description?: string | null): string {\n  if (description?.trim()) return description.trim();\n  const t = eventType.toUpperCase();",
              "export function humanEventLabel(eventType: string | null | undefined, description?: string | null): string {\n  if (description?.trim()) return description.trim();\n  const t = String(eventType || \"\").toUpperCase();",
          )
          lib = lib.replace(
              "export function eventSeverity(eventType: string, severity?: string | null): \"low\" | \"medium\" | \"high\" {\n  if (severity === \"high\" || severity === \"medium\" || severity === \"low\") return severity;\n  const t = eventType.toUpperCase();",
              "export function eventSeverity(eventType: string | null | undefined, severity?: string | null): \"low\" | \"medium\" | \"high\" {\n  if (severity === \"high\" || severity === \"medium\" || severity === \"low\") return severity;\n  const t = String(eventType || \"\").toUpperCase();",
          )
          old_pp = """export function parsePresence(metadata: Record<string, unknown> | null | undefined): MonitorPresence {\n  const m = metadata ?? {};"""
          new_pp = """export function parsePresence(metadata: unknown): MonitorPresence {\n  let m: Record<string, unknown> = {};\n  if (metadata && typeof metadata === \"object\" && !Array.isArray(metadata)) {\n    m = metadata as Record<string, unknown>;\n  } else if (typeof metadata === \"string\" && metadata.trim().startsWith(\"{\")) {\n    try {\n      const parsed = JSON.parse(metadata) as unknown;\n      if (parsed && typeof parsed === \"object\" && !Array.isArray(parsed)) {\n        m = parsed as Record<string, unknown>;\n      }\n    } catch {\n      /* ignore */\n    }\n  }"""
          if old_pp in lib:
              lib = lib.replace(old_pp, new_pp, 1)
          Path("src/lib/live-monitor.ts").write_text(lib)

          # Harden approvals
          oa = Path("src/routes/officer.approvals.tsx").read_text()
          assert "PLACEHOLDER" not in oa and len(oa) > 5000
          oa = oa.replace(
              """      if (res.error) throw res.error;\n      return (res.data ?? []) as ExamRow[];""",
              """      if (res.error) {\n        console.warn(\"[officer-approvals] list\", res.error);\n        return [] as ExamRow[];\n      }\n      return (Array.isArray(res.data) ? res.data : []) as ExamRow[];""",
          )
          Path("src/routes/officer.approvals.tsx").write_text(oa)

          # Harden live-monitor page event_type
          lm = Path("src/routes/officer.live-monitor.tsx").read_text()
          assert "PLACEHOLDER" not in lm and len(lm) > 10000
          lm = lm.replace(
              "const t = e.event_type.toUpperCase();",
              "const t = String(e.event_type || \"\").toUpperCase();",
          )
          lm = lm.replace(
              "const events = eventsQ.data ?? [];",
              "const events = Array.isArray(eventsQ.data) ? eventsQ.data : [];",
          )
          Path("src/routes/officer.live-monitor.tsx").write_text(lm)
          print("All restored and hardened")
          PY
          git config user.name "restore-bot"
          git config user.email "bot@d4exam.local"
          git add src/lib/live-monitor.ts src/routes/officer.approvals.tsx src/routes/officer.live-monitor.tsx
          git status
          git commit -m "fix: restore + null-safe monitor/approvals (event_type, never-throw list)"
          git push
