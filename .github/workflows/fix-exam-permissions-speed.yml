  let timer: ReturnType<typeof setTimeout> | undefined;
  try {
    return await Promise.race([
      p,
      new Promise<T>((resolve) => {
        timer = setTimeout(() => resolve(fallback), ms);
      }),
    ]);
  } finally {
    if (timer) clearTimeout(timer);
  }
}

export async function loadExamQuestionBank(opts: {
  courseId: string;
  schoolId?: string | null;
  examId?: string | null;
}): Promise<RawQ[]> {
  const courseId = opts.courseId ? String(opts.courseId) : "";
  const schoolId = opts.schoolId ? String(opts.schoolId) : null;
  const examId = opts.examId ? String(opts.examId) : null;

  let rows: RawQ[] = [];

  if (examId) {
    const [rpcRows, linked] = await Promise.all([
      withTimeout(loadViaRpc(examId, courseId || null, schoolId), 4500, [] as RawQ[]),
      withTimeout(loadFromExamQuestions(examId), 4500, [] as RawQ[]),
    ]);
    rows = rpcRows;
    if (!rows.length || rows.some((r) => !hasUsableOptions(r))) {
      if (linked.length) {
        if (!rows.length) {
          rows = linked;
        } else {
          const byId = new Map(linked.map((q) => [q.id, q]));
          rows = rows.map((q) => {
            if (hasUsableOptions(q)) return q;
            const f = byId.get(q.id);
            return f ? mergeRaw(q, f) : q;
          });
        }
      }
    }
  }

  if (!rows.length && courseId) {
