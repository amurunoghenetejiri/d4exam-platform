name: Fix live identity simple
on:
  push:
    paths:
      - scripts/fix_live_identity_simple.py
      - .github/workflows/fix-live-identity-simple.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_live_identity_simple.py
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          if git diff --staged --quiet; then echo No changes; else git commit -m "fix(officer-live): show real name/matric/course/exam from live frames"; git push; fi
