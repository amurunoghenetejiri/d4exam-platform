<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1b3a" />
  <title>D4EXAM — Offline</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: #0b1b3a; color: #e2e8f0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      max-width: 22rem; padding: 1.5rem; text-align: center;
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 1rem; background: rgba(15,23,42,0.85);
    }
    h1 { font-size: 1.15rem; margin: 0 0 0.5rem; }
    p { font-size: 0.9rem; line-height: 1.45; color: #94a3b8; margin: 0 0 1rem; }
    button {
      appearance: none; border: 0; border-radius: 999px;
      padding: 0.65rem 1.25rem; font-weight: 600; font-size: 0.9rem;
      background: #3b82f6; color: #fff; cursor: pointer;
    }
    button:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>D4EXAM could not load this page. Saved screens still work after you have signed in once while online.</p>
    <button type="button" id="retry">Try again</button>
  </div>
  <script>
    document.getElementById("retry").onclick = function () {
      try { location.href = "./index.html"; } catch (e) { location.reload(); }
    };
  </script>
</body>
</html>
