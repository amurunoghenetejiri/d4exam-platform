<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070D1B" />
    <title>Offline — D4EXAM</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #070d1b;
        color: #e2e8f0;
        padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
          max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
        color: #94a3b8;
        max-width: 20rem;
        line-height: 1.45;
      }
      button {
        margin-top: 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        padding: 0.7rem 1.25rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="/icon-192.png" alt="D4EXAM" />
      <h1>You are offline</h1>
      <p>D4EXAM needs a connection for exams and results. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
